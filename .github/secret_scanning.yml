# Le corpus publié n'est pas du code, et un identifiant public n'est pas un secret.
#
# `pivot_data/amendements/<lég>.contenu.json` publie l'uid de chaque amendement
# AMPUTÉ de son préfixe commun à la législature (`AMANR5L15`), reconstitué à la
# lecture par `amendements_contenu.uid_complet` — 6,6 Mo économisés sur les
# quatre fichiers. Ce qui reste fait 24 caractères alphanumériques, exactement
# le motif d'un ancien jeton d'API Atlassian : le 24/09/2026, GitHub en a
# signalé cinq, et le corpus en contient 372 135.
#
# CE QUI REND L'EXCLUSION SÛRE, et qui a été mesuré avant de l'écrire : la
# structure de ces fichiers est entièrement contrainte, donc rien d'autre ne
# peut s'y trouver. Sur les quatre législatures — 768 216 identifiants —, zéro
# `ids` hors du motif d'uid de l'AN, zéro clé de `mots` hors `[a-z]{4,}`, zéro
# renvoi hors base 36, zéro `articles` mal formé. Un secret ne franchirait pas
# `validate_profil`, et il ne franchirait pas non plus ce schéma.
#
# CE QUI N'EST DÉLIBÉRÉMENT PAS EXCLU. Les actes réglementaires portent eux
# aussi des chaînes de 24 caractères — `dihydroxydiphenylsulfone`,
# `dodecylbenzenesulfonique` : des mots de chimie tirés des titres de décrets,
# qu'aucun contrôle d'entropie ne prend pour un jeton. Ils n'ont jamais
# déclenché d'alerte, et exclure un chemin qui ne pose pas de problème
# n'achèterait qu'un angle mort de plus. Le reste de `pivot_data/` et tout
# `raw_data/` restent analysés.
paths-ignore:
  - "pivot_data/amendements/*.contenu.json"
