name: Génération des données

on:
  #schedule:
  #  - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      # These strings are the FORM LABELS: GitHub shows the description and
      # hides the input name. So they must be short, self-contained, and never
      # reference another field by a name nobody can see on screen.
      #
      # THEY ARE TITLES, NOT DOCUMENTATION. GitHub wraps them at ~65 columns
      # in a narrow column above their control, so a sentence becomes a wall
      # nobody reads at the moment they are configuring a run. Name the field;
      # do not explain it. A menu SHOWS its values, so the label never has to
      # spell them out. Locked by test_un_libelle_tient_sur_une_ligne.
      # Run `python3 scripts/rendu_formulaire.py` to SEE the form before
      # changing a label — reading the YAML hides exactly this defect.
      #
      # TWO DISJOINT AXES (#578), plus the cache on its own. One field used to
      # answer two questions at once, which is why no wording ever made it
      # read straight.
      # The rationale lives in docs/technical_decisions.md, reachable by anchor.
      #
      # TEST RUN — first field on purpose: it is a MODE, and a mode is read
      # before the settings it modifies. Filling it does three things and says
      # so: it shrinks the extract-an matrix to these slugs, it caps the roster
      # at one shard when no cap was asked for, and it DISARMS the commit.
      #
      # One field, three effects, deliberately: two independent checkboxes
      # would allow "reduced scope AND commit", i.e. publishing a corpus known
      # to be partial. Empty = an ordinary run, unchanged.
      test_slugs:
        description: "Test run — these slugs only (empty = full run, never commits)"
        type: string
        required: false
      existing_profiles:
        description: "Existing profiles treatment"
        type: choice
        options:
          - leave-as-is
          - refresh
          - overwrite
        default: refresh
      cold_start:
        description: "Purge cache (slow)"
        type: boolean
        default: false
      add_uncovered_members:
        description: "Add uncovered members"
        type: boolean
        default: true
      roster_limit:
        description: "Members per run (0 = no cap)"
        type: number
        default: 0
      collect_interventions:
        description: "Collect floor speeches (roster: theme only)"
        type: boolean
        default: false
      collect_dossiers_legislatifs:
        description: "Collect roster members' carried legislative files"
        type: boolean
        default: false
      incomplete_read_threshold:
        description: "Network issue threshold before the gate fails"
        type: number
        default: 3
      allow_declared_losses:
        description: "INTENDED REMOVAL: commit despite lost entries"
        type: boolean
        default: false
      allow_broken_references:
        description: "EMERGENCY ONLY: commit despite broken references"
        type: boolean
        default: false
      allow_unpublished_profiles:
        description: "LAST RESORT: commit despite unpublished profiles"
        type: boolean
        default: false
      allow_publication_gaps:
        description: "BREAK GLASS: commit despite publication gaps"
        type: boolean
        default: false

# Moindre privilège (#413 §6) : `contents: read` au niveau du workflow, et
# `contents: write` uniquement sur merge-and-pivot, seul job qui pousse. Les 6
# jobs d'extraction exécutent du code réseau contre des sources tierces (AN
# Open Data, NosDéputés, Parlement européen, ParlTrack) — leur donner un
# token en écriture sur le dépôt était un privilège sans usage.
permissions:
  contents: read

# Évite deux exécutions qui écriraient/committeraient en même temps.
concurrency:
  group: generate-data
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Timeout ParlTrack : modifiable ici (30 min par défaut). Rappel : ce job a
# continue-on-error: true — son dépassement ne bloque pas merge-and-pivot.
# extract-an (#344) : matrix strategy, un shard par candidat à slug résolvable
# (raw_data/candidats.json, calculé par le job prepare-an-matrix) — isole la
# perte en cas de shutdown signal runner (#228, angle mort de if: always()) à
# un seul candidat au lieu de tout le job. max-parallel: 1 sur ce matrix :
# conservé par #412, mais PLUS pour la raison écrite jusqu'ici — voir
# docs/decisions/concurrence-shards-extraction-412.md et
# #matrix-extract-an-par-candidat. En deux lignes : le pic de jobs simultanés
# n'est plus 4 mais 6 (six jobs démarrent sans needs: depuis #344/#394), et
# l'hypothèse de plafond de dépense Actions qui fondait #222 a été infirmée
# ([[verification-billing-actions]]) ; ce qui reste valide de #222 est
# l'argument *cache* — des shards en parallèle retéléchargeraient chacun les
# dumps AN Open Data au lieu de se passer un cache déjà chaud.
# Cet argument ne vaut QUE pour extract-an, qui écrit réellement la clé de la
# semaine. La matrice roster, elle, démarre derrière lui par `needs:` : sa clé
# est déjà chaude, ses shards ne se réchauffent rien mutuellement (mesuré :
# « not saving cache » sur les 8 shards du run 32288588518) et #467 l'a donc
# ouverte à max-parallel: 4. Voir
# docs/decisions/budget-execution-pleine-echelle-467.md.
#
# ── LES 8 JOBS ──────────────────────────────────────────────────────────────
# 2 préparatoires (prepare-an-matrix, prepare-roster-matrix), 5 d'extraction
# (extract-amendements-an, extract-an, extract-ue-officiel, extract-parltrack,
# extract-roster-groupes — dont 2 shardés), 1 de fusion (merge-and-pivot). Les
# en-têtes de job ne sont plus numérotés : la numérotation « JOB n/4 » était
# périmée depuis #344/#394 et l'était redevenue à chaque ajout (#413).
#
# `extract-senat` a été RETIRÉ par #528 : le Sénat est sorti du périmètre
# éditorial du produit, et ce job tournait, échouait sur 8 candidats sur 8 et
# concluait vert depuis le 24/08/2026. Voir
# docs/decisions/retrait-senat-528.md — la condition de réouverture y
# est écrite, et un certificat renouvelé ne suffit pas.
#
# ── BUDGET DE TEMPS MUR ─────────────────────────────────────────────────────
# ATTENTION, deux grandeurs à ne pas confondre — et c'est la confusion qui a
# produit tous les chiffres faux publiés ici jusqu'à #467 :
#   - le PLAFOND AUTORISÉ = somme des timeouts. Ce que le workflow s'autorise à
#     consommer avant que GitHub ne le coupe. Il ne dit rien de la durée réelle.
#   - le TEMPS MUR, seule grandeur à budgéter. MESURÉ, pas calculé.
#
# Le chiffre publié jusqu'à #413 (« 190 min ») oubliait extract-senat du max()
# et traitait extract-roster-groupes comme un job unique. Celui publié jusqu'à
# #467 (« 210 / 630 min ») corrigeait ces deux erreurs mais en ajoutait une
# troisième, plus grosse : multiplier par S un timeout dimensionné pour le job
# NON shardé. Le timeout de 60 min d'un shard roster couvre ~712 membres ; un
# shard en contient ~94. Les 8 shards se partagent une charge FIXE — sharder
# n'ajoute pas de travail, il le divise. « S × 60 » supposait 5 696 membres.
#
# #528 a retiré extract-senat, et le plafond N'A PAS BOUGÉ : ses 15 min étaient
# dominées par les 70 min d'extract-an dans le max() du premier étage. Ce qui
# disparaît est un job de runner et ~32 requêtes par run vers une source morte,
# pas du temps mur. Le calcul est refait ci-dessous plutôt que corrigé de tête
# — c'est l'oubli de ce job dans ce même max() qui a produit le « 190 min »
# faux publié jusqu'à #413.
#
# ── PLAFOND AUTORISÉ (somme des timeouts, jamais atteint) ────────────────────
# prepare-* 5 min / amendements-an 30 / AN 5 PAR SHARD, 9 avec
# collect_interventions (#498 ; nb de shards = candidats à slug résolvable, 8
# aujourd'hui, alerte au-delà de AN_SHARDS_WARN) / UE 60 / ParlTrack 30 /
# roster-groupes 60 PAR SHARD (S = 1 en rollout progressif, 8 en run complet) /
# merge-and-pivot 60.
#
# Chaîne la plus longue : `extract-roster-groupes` attend tout le premier étage
# ET `extract-an` ; ce dernier plafonne à 30 (amendements) + 5·8 = 70 min,
# au-delà des 60 min d'`extract-ue-officiel`. Donc 70 + 60·S + 60 = **190 min à
# S=1, 610 min à S=8** (222 / 642 avec collect_interventions, où extract-an
# passe à 30 + 9·8 = 102). Inchangé par le retrait du Sénat (#528) : ses 15 min
# n'ont jamais dominé ce max(). Aucune limite GitHub n'est approchée (6 h par
# JOB, 35 j par RUN). Ces valeurs sont des filets de sécurité : ne pas les
# budgéter.
#
# ── TEMPS MUR MESURÉ — run 32288588518, 19/08/2026, run complet (S=8) ────────
#
#   | Étape                        | Début  | Durée   | Timeout | Ratio  |
#   |------------------------------|--------|---------|---------|--------|
#   | 6 jobs sans needs: (Sénat)   | 0      | 4,6 min | 15 min  | ×3,3   |
#   | extract-an (8 shards, série) | 2,2    | 18,2    | 40      | ×2,2   |
#   | extract-roster (8 sh., série)| 20,5   | 26,9    | 480     | ×18    |
#   | merge-and-pivot              | 47,4   |  7,5    | 60      | ×8     |
#   | TOTAL                        | —      | 54,9    | 610     | ×11,1  |
#
# Le Sénat ne dominait PAS, et c'est pourquoi le retirer (#528) laisse ce total
# à 54,9 min : il n'était pas sur le chemin critique. La ligne reste ici parce
# qu'un relevé mesuré ne se réécrit pas — le job a existé, ces 4,6 min ont été
# consommées. Elles incluaient encore la collecte d'interventions, que #501
# avait coupée : 280 des 311 requêtes de ce job y passaient, pour zéro
# intervention retenue. Le chemin critique réel, ce sont les deux matrices en
# série ; il n'y a plus que 5 jobs sans `needs:`.
#
# ── CE QUE COÛTE UN SHARD (mesuré, même run) ────────────────────────────────
# Un shard roster = ~200 s, dont ~130 s de FRAIS FIXES (dont ~110 s de
# `actions/checkout` seul — le dépôt porte les profils) et ~65 s d'extraction
# (24 membres, ~1,9 s/membre). Sharder ×8 paie donc 8 fois ces 130 s.
# Deux conséquences, tranchées par #467 :
#   - #467 fait tomber l'extraction à ~0,5 s par membre (projeté) : mesuré
#     −86,8 % sur les 24 membres de ce shard rejoués en local (74,1 s → 9,8 s).
#     Ça n'attaque que le tiers extraction ;
#   - le reste ne se réduit qu'en parallélisant : max-parallel: 4 sur la
#     matrice roster (#467, voir son commentaire).
#
# ── BUDGET À PLEINE ÉCHELLE (752 membres, PROJETÉ, jamais exécuté) ───────────
#   extraction/shard ~1 min (11 s fixes + 94 × 0,5 s) → shard ~3,1 min
#   matrice roster à max-parallel: 4 → 2 vagues → ~6 min
#   + extract-an ~20 min + merge-and-pivot (7,5 min mesuré à 209 profils, NON
#   mesuré à 752 : c'est l'inconnue restante du budget)
#   → ordre de grandeur **40 à 60 min**, pas 630. À confronter au premier run
#     complet réel : ces lignes sont une projection, pas une mesure.
# ─────────────────────────────────────────────────────────────────────────────
env:
  PARLTRACK_TIMEOUT_MINUTES: 30   # <── modifier ici si besoin (ne requiert pas de rewrite du YAML)
  # stdout est bufferisé par blocs (pas par ligne) par CPython dès qu'il détecte
  # une sortie non-TTY (cas de tout step GitHub Actions) ; stderr ne l'est jamais.
  # Sans ceci, les print() de progression apparaissent en rafale différée dans les
  # logs CI (ordre chronologique trompeur) et sont perdus si le job est tué avant
  # la fin normale du process (#259).
  PYTHONUNBUFFERED: "1"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB PRÉPARATOIRE — Calcul du matrix extract-an, un shard par candidat
  # (#344 — voir docs/decisions/matrix-extract-an-par-candidat.md)
  #
  # Un shard par candidat à *slug résolvable* uniquement : un candidat sans
  # slug (raw_data/candidats.json) est un no-op silencieux dans extract-an
  # --source an (aucune chambre FR interrogeable, et --source an ne déclenche
  # jamais la recherche UE — voir process_candidat/_fetch_ue dans
  # generate_all_profiles.py), donc exclu du matrix plutôt que de générer un
  # shard qui n'écrirait jamais de fichier.
  # ──────────────────────────────────────────────────────────────────────────
  # RAFRAICHIR-CANDIDATS (#757) — la liste qui décide du périmètre du run.
  #
  # Sans ce job, `raw_data/candidats.json` n'avançait que lorsqu'une main y
  # pensait : mesuré à 51 jours de retard et 19 déclarés absents le 07/09/2026.
  # D'ici avril 2027 la liste bougera des dizaines de fois.
  #
  # POURQUOI EN TÊTE, ET PAS DANS `merge-and-pivot` : c'est ce job qui
  # dimensionne la matrice `extract-an`, donc il doit conclure AVANT elle. La
  # forme est celle de `prepare-roster-matrix` (#518) — une construction par
  # run, publiée en artifact — et pour la même raison : deux lectures de la même
  # liste à deux moments du run divergent, et un candidat collecté par l'une
  # sans être normalisé par l'autre ne fait échouer aucune étape.
  #
  # POURQUOI IL NE POUSSE RIEN : `merge-and-pivot` annule le commit si
  # `raw_data/*.json` a bougé sur la branche PENDANT le run
  # (GENERATION_CODE_CHANGED_DURING_RUN, #390/#413). Le fichier voyage donc dans
  # l'artifact et il est committé à la fin, AVEC les données qu'il a produites.
  #
  # LE RÉSEAU EST ICI, ET NULLE PART AILLEURS : la résolution d'identifiants
  # (Wikidata P4123) a lieu dans ce job, et son résultat voyage en artifact. La
  # passe qui écrit les entrées de correspondance, elle, est hors ligne — une
  # panne de source tierce ne doit pas coûter le commit d'un run dont la donnée
  # est bonne (#524, et c'est la forme que #715 s'est donnée).
  #
  # PAS DE `continue-on-error` : il masquerait un échec en le rendant vert. Le
  # repli est explicite, dans le shell, et il est NOMMÉ — sur une source
  # injoignable, le run continue avec la liste COMMITTÉE, qui est un état connu,
  # jamais avec une liste vide (AGENTS.md §2 règle 5, le patron de #511).
  # ──────────────────────────────────────────────────────────────────────────
  rafraichir-candidats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            src
            requirements.txt
            raw_data/candidats.json
            raw_data/correspondance_acteurs_an.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Le code 1 dit « collecte incomplète, RIEN n'a été écrit » : le fichier
      # committé est intact, on le publie tel quel et le run garde le périmètre
      # d'hier. Le code 3 n'est pas demandé ici (`--echouer-si-ecart` est absent) :
      # un écart est ce que ce job vient corriger, pas une anomalie.
      - name: Rafraîchir la liste des candidats déclarés
        id: liste
        run: |
          set -uo pipefail
          python3 src/fetch_candidats_declares.py \
            --ecrire \
            --resoudre-identifiants \
            --resolutions-out raw_data/resolutions_candidats.json
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "rafraichie=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "::warning::CANDIDATS_SOURCE_INJOIGNABLE — la liste n'a pas pu être rafraîchie ; le run garde la liste committée. Le fichier n'a pas été modifié."
            echo "rafraichie=false" >> "$GITHUB_OUTPUT"
            # Un fichier de résolutions VIDE et non absent : la passe hors ligne
            # doit pouvoir distinguer « rien à ajouter » de « fichier manquant ».
            printf '{"schema_version":"resolutions-candidats-v1","resolutions":{}}\n' \
              > raw_data/resolutions_candidats.json
          else
            echo "::error::CANDIDATS_ECHEC_INATTENDU — code $code."
            exit "$code"
          fi
          # Le fichier de résolutions DOIT exister à ce point, quel que soit le
          # chemin pris (#771). Son absence est ce qui a coûté le run
          # `34160985529` : l'artifact n'en portait qu'un, `hashFiles()` était
          # vide dans merge-and-pivot, la passe hors ligne fut sautée, et 8
          # profils sont partis en publication sans entrée de correspondance.
          # Échouer ICI nomme la cause ; échouer trois jobs plus loin la cache.
          if [ ! -f raw_data/resolutions_candidats.json ]; then
            echo "::error::CANDIDATS_RESOLUTIONS_ABSENTES — le fichier de résolutions n'a pas été écrit ; la passe hors ligne de merge-and-pivot serait sautée et le portail refuserait le commit."
            exit 1
          fi

      # Les deux fichiers voyagent ENSEMBLE, dans un seul artifact : la liste
      # dit qui collecter, les résolutions disent quel acteur AN chacun porte.
      # Séparés, un run pourrait collecter d'après l'une sans pouvoir écrire les
      # correspondances de l'autre — c'est la divergence que #518 a supprimée
      # côté roster.
      - uses: actions/upload-artifact@v6
        with:
          name: candidats-a-jour
          path: |
            raw_data/candidats.json
            raw_data/resolutions_candidats.json
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  prepare-an-matrix:
    needs: rafraichir-candidats
    # `!cancelled()` et non `always()` : si `rafraichir-candidats` échoue, ce job
    # tourne quand même et retombe sur la liste committée — le périmètre d'hier
    # vaut mieux qu'un run sans aucun candidat. Un job amont *skipped* ne doit
    # pas rendre celui-ci skipped à son tour (#412 §2.1).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}

    steps:
      # SPARSE-CHECKOUT — MÊME CAUSE QUE DANS `extract-an`, MÊME CORRECTIF (#674).
      #
      # Ce job a été oublié par la première application du lot, et le run
      # `33414042623` l'a montré le jour même : `prepare-an-matrix` tué à
      # 5 min 00 **dans `actions/checkout`**, donc matrice jamais publiée, donc
      # `extract-an` skippé — le job réparé n'a même pas démarré. La leçon est
      # écrite dans la décision : la cause n'est pas propre à un job, c'est le
      # poids de l'arbre (8 483 Mio, dont 7 525 pour `raw_data/profiles/`), et
      # tout job à `timeout-minutes: 5` la rencontre.
      #
      # CE JOB NE LIT QU'UN FICHIER : `raw_data/candidats.json`, en `python3`
      # système, sans dépendance et sans action locale. `.github` est conservé
      # pour qu'une action locale ajoutée plus tard ne disparaisse pas du
      # disque sans que rien ne le dise.
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            src/perimetre_candidats.py
            raw_data/candidats.json

      # La liste du jour ÉCRASE la liste committée, et son absence n'est pas une
      # erreur : `continue-on-error` sur le download ferait retomber le job sur
      # le fichier du checkout, qui est un état connu (#757). Ce qui serait une
      # erreur, c'est de ne pas le dire — d'où le log ci-dessous.
      - uses: actions/download-artifact@v7
        id: liste_a_jour
        continue-on-error: true
        with:
          name: candidats-a-jour
          path: raw_data/

      - name: Périmètre de ce run
        run: |
          if [ "${{ steps.liste_a_jour.outcome }}" = "success" ]; then
            echo "Liste du jour (artifact candidats-a-jour)."
          else
            echo "::warning::CANDIDATS_ARTIFACT_ABSENT — la matrice est construite sur la liste COMMITTÉE, pas sur celle du jour."
          fi

      # set -euo pipefail (#412 §2.1) : sans lui, un python3 en échec
      # (candidats.json illisible/malformé) laissait SLUGS_JSON vide, écrivait
      # `slugs=` dans $GITHUB_OUTPUT et faisait échouer l'évaluation de
      # `fromJson('')` côté extract-an — un job *skipped*, pas *failed*, que
      # continue-on-error: ne rattrape pas. Mieux vaut échouer ici, lisiblement.
      - name: Slugs résolvables (raw_data/candidats.json)
        id: slugs
        env:
          # Nombre de shards au-delà duquel le temps mur d'extract-an devient un
          # problème silencieux : les shards s'exécutent en série (max-parallel:
          # 1), donc 16 shards = 16 fois le timeout d'un shard pour ce seul job.
          # Modifier ici suffit — aucune autre occurrence de cette valeur.
          # Répond au « recalculer si raw_data/candidats.json change
          # significativement » de l'en-tête de ce fichier, jusqu'ici non
          # outillé (#412 §2.7).
          AN_SHARDS_WARN: "16"
          # Doit refléter le `timeout-minutes` d'extract-an, qui dépend du mode
          # depuis #498 : annoncer 5 min de temps mur par shard pendant qu'un run
          # avec interventions en consomme 9 rendrait cet avertissement faux au
          # moment précis où il sert. Cohérence vérifiée par
          # tests/test_ci_budget_interventions.py.
          AN_TIMEOUT_MINUTES: ${{ inputs.collect_interventions && 10 || 5 }}
          TEST_SLUGS: ${{ inputs.test_slugs }}
        run: |
          set -euo pipefail
          SLUGS_JSON=$(TEST_SLUGS="${TEST_SLUGS:-}" python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "src")
          from perimetre_candidats import (
              restreindre_au_test, slugs_a_collecter, slugs_geles,
          )
          data = json.load(open("raw_data/candidats.json", encoding="utf-8"))
          candidats = data["candidats"]
          # Le gel se DÉCLARE : un candidat qui sort du périmètre est nommé ici,
          # là où le périmètre est calculé (#760). Sur stderr, pour ne pas
          # polluer la sortie que le shell capture.
          for slug, statut in slugs_geles(candidats):
              print(f"::notice::CANDIDAT_GELE — {slug} (statut: {statut}) : collecte gelée, profil publié conservé tel quel (#760).", file=sys.stderr)
          slugs = slugs_a_collecter(candidats)
          # Le périmètre de test se RESTREINT, il ne se substitue pas : un slug
          # demandé mais gelé ou mal tapé n'entre pas dans la matrice, et il est
          # nommé — sinon un run de test qui collecte zéro se lit comme un run
          # qui n'a rien trouvé (patron de #510).
          retenus, introuvables = restreindre_au_test(slugs, os.environ["TEST_SLUGS"])
          for slug in introuvables:
              print(f"::warning::TEST_SLUG_INTROUVABLE — {slug} : absent du périmètre de collecte (mal orthographié, sans slug résolvable, ou gelé #760). Il n'aura pas de shard.", file=sys.stderr)
          if introuvables and not retenus:
              print("::error::TEST_PERIMETRE_VIDE — aucun des slugs demandés n'est collectable ; le run n'aurait rien à faire.", file=sys.stderr)
              raise SystemExit(1)
          if retenus is not slugs and len(retenus) != len(slugs):
              print(f"::notice::RUN_DE_TEST — matrice réduite à {len(retenus)} shard(s) sur {len(slugs)} ; ce run NE COMMITTERA PAS.", file=sys.stderr)
          print(json.dumps(retenus))
          EOF
          )
          COUNT=$(SLUGS_JSON="$SLUGS_JSON" python3 -c 'import json, os; print(len(json.loads(os.environ["SLUGS_JSON"])))')
          echo "slugs=$SLUGS_JSON" >> "$GITHUB_OUTPUT"
          echo "${COUNT} candidat(s) à slug résolvable → ${COUNT} shard(s) extract-an."

          # Matrix vide : GitHub Actions *skippe* extract-an (et non l'échoue).
          # Depuis #412, la chaîne aval survit à ce skip (if: !cancelled() sur
          # extract-roster-groupes et merge-and-pivot), mais le run ne produira
          # aucune donnée AN — il faut que ce soit visible, pas déduit.
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::warning::Aucun candidat à slug résolvable dans raw_data/candidats.json — extract-an sera skippé (matrix vide). Le reste du run continue sur les autres sources."
            {
              echo "### ⚠️ Matrix extract-an vide"
              echo ""
              echo "Aucun candidat de \`raw_data/candidats.json\` n'a de \`slug\` :"
              echo "\`extract-an\` est skippé et ce run ne collectera rien côté"
              echo "Assemblée nationale. Les autres sources (UE, ParlTrack,"
              echo "roster) et la fusion finale s'exécutent normalement."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$COUNT" -gt "$AN_SHARDS_WARN" ]]; then
            echo "::warning::${COUNT} shards extract-an (> ${AN_SHARDS_WARN}) — shards exécutés en série à ${AN_TIMEOUT_MINUTES} min chacun, soit ~$((COUNT * AN_TIMEOUT_MINUTES)) min de temps mur. Revoir max-parallel/timeout ou le volume de raw_data/candidats.json."
            {
              echo "### ⚠️ Budget de temps mur d'extract-an"
              echo ""
              echo "${COUNT} shards (seuil d'alerte : ${AN_SHARDS_WARN}), exécutés en série"
              echo "(\`max-parallel: 1\`) à ${AN_TIMEOUT_MINUTES} min de timeout chacun → jusqu'à"
              echo "~$((COUNT * AN_TIMEOUT_MINUTES)) min de temps mur pour ce seul job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Garde-fou #460 : écrasement sans collecte d'interventions ─────────
      # `existing_profiles=overwrite` lève `--no-merge` ;
      # `collect_interventions=false` lève `--skip-interventions`. Chacun est
      # correct isolément — l'un est le mode de correction de schéma, l'autre
      # le mode d'extraction rapide. Ensemble, ils réécrivent le profil SANS ce
      # que ce run n'a pas collecté : les interventions déjà acquises sont
      # effacées, brut et pivot, et la perte se propage à `tags_thematiques`
      # puis à `tags_thematiques_agreges` des groupes — deux champs publiés
      # (AGENTS.md §6). C'est exactement ce qui s'est produit au run
      # 32288588518 (commit a125e9e) : 789 interventions, 647 tags et 497 tags
      # agrégés perdus sans un signal.
      #
      # Pourquoi un ::warning:: et non un exit 1. Le refus dur existe déjà, en
      # aval et sur la mesure plutôt que sur la prédiction : `audit_diff_profils.py`
      # bloque le commit sur toute perte d'un champ stable, avec
      # `allow_declared_losses` pour déclarer une perte légitime. Refuser ici
      # la combinaison ferait double emploi, et casserait un usage légitime :
      # propager une correction de clé (#431/#432) sans repayer la collecte des
      # interventions est un choix valide dès lors qu'il est conscient. Ce qui
      # manquait n'était pas un veto, c'était de le rendre conscient AVANT
      # d'engager une heure de runner. C'est le SEUL ::warning:: qui reste sur
      # cet axe (#578) : celui qui criait sur le mode fusionnant a été supprimé,
      # le workflow ne pouvant pas savoir si un correctif porte sur une clé.
      # Celui-ci, lui, chiffre la perte sur la baseline committée.
      #
      # Le signal porte sur une VARIATION, pas sur un niveau — c'est ce qui
      # manquait à la quality gate, dont la §3 se déclenchait sur 100 % du
      # corpus et ne distinguait donc pas « n'en a jamais eu » de « vient d'en
      # perdre 789 ». Corpus sans interventions committées = aucun avertissement :
      # il n'y a rien à détruire, et un garde-fou qui crie à vide se fait ignorer.
      - name: Garde-fou — écrasement sans collecte d'interventions (#460)
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
          INTERVENTIONS: ${{ inputs.collect_interventions }}
        run: |
          set -euo pipefail
          # Condition alignée mot pour mot sur le calcul de MERGE_FLAG des jobs
          # d'extraction : c'est `--no-merge`, et lui seul, qui rend l'écrasement
          # destructeur. La désaligner rendrait ce garde-fou muet ou bavard.
          if [[ "$OVERWRITE" != "true" ]]; then
            echo "Fusion additive (existing_profiles != overwrite) : les interventions déjà acquises sont conservées."
            exit 0
          fi
          if [[ "$INTERVENTIONS" == "true" ]]; then
            echo "Écrasement AVEC collecte d'interventions (collect_interventions=true) : rien à signaler."
            exit 0
          fi

          # Ce que ce run détruirait, mesuré sur la baseline committée du
          # checkout — jamais supposé. Un profil à la fois : le corpus pèse
          # ~1,5 Go par répertoire et trois outils de ce dépôt s'y sont déjà
          # fait tuer par l'OOM killer.
          MESURE=$(python3 - <<'EOF'
          import glob, json, os

          total, porteurs = 0, []
          for chemin in sorted(glob.glob("pivot_data/profiles/*.pivot.json")):
              with open(chemin, encoding="utf-8") as fichier:
                  nombre = len(json.load(fichier).get("interventions") or [])
              if nombre:
                  total += nombre
                  porteurs.append((os.path.basename(chemin)[: -len(".pivot.json")], nombre))
          porteurs.sort(key=lambda p: -p[1])
          print(total)
          print(len(porteurs))
          print(", ".join(f"{slug} ({n})" for slug, n in porteurs))
          EOF
          )
          TOTAL=$(echo "$MESURE" | sed -n 1p)
          PROFILS=$(echo "$MESURE" | sed -n 2p)
          DETAIL=$(echo "$MESURE" | sed -n 3p)

          if [[ "$TOTAL" -eq 0 ]]; then
            echo "Écrasement sans collecte d'interventions, mais la baseline committée n'en porte aucune : rien à perdre."
            exit 0
          fi

          echo "::warning::existing_profiles=overwrite avec collect_interventions=false : ce run va EFFACER les ${TOTAL} interventions déjà acquises sur ${PROFILS} profil(s), ainsi que les tags_thematiques qui en dérivent et les tags_thematiques_agreges des groupes — deux champs publiés. Relancer avec collect_interventions=true pour les recollecter, ou assumer la perte via allow_declared_losses (le contrôle de perte bloquera le commit sinon)."
          {
            echo "### ⚠️ Interventions menacées par ce run"
            echo ""
            echo "\`existing_profiles=overwrite\` lève \`--no-merge\` et"
            echo "\`collect_interventions=false\` lève \`--skip-interventions\` :"
            echo "les profils seront réécrits **sans** les interventions que ce run"
            echo "ne collectera pas."
            echo ""
            echo "| Mesure sur la baseline committée | Valeur |"
            echo "| --- | --- |"
            echo "| Interventions qui seraient effacées | **${TOTAL}** |"
            echo "| Profils concernés | ${PROFILS} |"
            echo ""
            echo "Détail : ${DETAIL}"
            echo ""
            echo "Champs dérivés touchés : \`tags_thematiques\` (profils) et"
            echo "\`tags_thematiques_agreges\` (groupes) — publiés, cf. AGENTS.md §6."
            echo ""
            echo "**Pour conserver ces données** : relancer avec"
            echo "\`collect_interventions=true\`. **Pour assumer la perte** :"
            echo "\`allow_declared_losses=true\`, sans quoi le contrôle de perte"
            echo "d'avant-commit fera échouer \`merge-and-pivot\` (#460)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB D'EXTRACTION — Assemblée nationale (matrix par candidat, #344)
  # ──────────────────────────────────────────────────────────────────────────
  extract-an:
    needs: [extract-amendements-an, prepare-an-matrix]
    name: extract-an (${{ matrix.slug }})
    runs-on: ubuntu-latest
    # TIMEOUT CONDITIONNEL AU MODE (#498). Une seule valeur ne peut pas couvrir
    # les deux : ce job fait deux choses différentes selon `collect_interventions`.
    #
    # collect_interventions=false (défaut) → 5 min. Mesuré sur les 16 shards des
    #   runs 32233766814 et 32288588518, TOUS dans ce mode : job total 117-207 s,
    #   dont **8-18 s d'extraction**. Le reste est le préambule du job (checkout,
    #   setup-python, pip, restauration des caches, artifact d'amendements) :
    #   107-193 s. C'est lui que ce timeout borne en réalité, pas la collecte.
    #
    # collect_interventions=true → 10 min (#546, était 9). LE CALIBRAGE DU 20/08
    #   NE VAUT PLUS, et ce n'est pas un ajustement de confort : il posait
    #   « 240 s de préambule provisionné + 240 s de budget + ~60 s de marge » sur
    #   deux hypothèses tombées depuis. (1) Il provisionnait 90 s de recherche
    #   NosDéputés, retirée par #529. (2) Il mesurait les archives Syceron à
    #   22-55 s par législature ALORS QU'ELLES RENDAIENT ZÉRO intervention —
    #   c'est le défaut de #510, corrigé le 27/08. Le poste facturé n'était pas
    #   le poste réel.
    #
    #   DÉCOMPOSITION MESURÉE, run 33110395663 (27/08) — le premier run où les
    #   trois archives Syceron ont répondu (au run 33100214165, deux heures plus
    #   tôt, les législatures 15 et 16 étaient injoignables : ses durées ne
    #   caractérisent pas ce mode). Secondes, par shard, sur les 7 shards
    #   PORTEURS d'un mandat AN — le 8e, jordan-bardella, n'a rien à collecter et
    #   son extraction dure 1 s :
    #
    #     préambule du job ...................... 146-197  (max jerome-guedj)
    #     préambule du script (avant 1re unité) ... 5-6
    #     index Syceron législature 16 ........... 34-55
    #     index Syceron législature 15 ........... 79-166  (max jerome-guedj)
    #     questions officielles .................. 14-104  (max jean-luc-melenchon)
    #     écriture du profil ...................... 3-4
    #     ------------------------------------------------
    #     extraction totale ..................... 175-342  (max jean-luc-melenchon)
    #     job total (somme des steps) ........... 339-531
    #
    #   L'INTERLOCK QUI MANQUAIT. Le budget interne est vérifié ENTRE deux unités,
    #   jamais au milieu de l'une : le timeout doit donc couvrir le budget PLUS
    #   l'unité en vol au moment où il expire. Les législatures Syceron ne peuvent
    #   pas être cette unité — elles sont engagées à l'horloge 41-63 s, très en
    #   deçà de tout budget de cet ordre. C'est une législature de questions
    #   officielles, mesurée 5-104 s (max jean-luc-melenchon, législature 15).
    #   Provision : 120 s. D'où
    #
    #     timeout >= préambule provisionné (200 s, max mesuré 197)
    #             +  préambule de script + écriture (15 s, mesuré 8-10)
    #             +  --budget-interventions-secondes (250 s)
    #             +  unité en vol provisionnée (120 s)
    #             =  585 s, soit 15 s sous les 600 s de ce timeout.
    #
    #   Avec 9 min et un budget de 240 s, cette somme valait 575 s pour 540 s
    #   disponibles : la paire était INCOHÉRENTE, le shard pouvait être tué avant
    #   d'écrire — le défaut même de #498. Que jean-luc-melenchon soit sorti à
    #   8,9 min tenait à l'unité qui a dépassé ce jour-là, pas au dimensionnement.
    #
    # Le risque d'origine reste borné. Ce qui justifiait 5 min était un cas
    # anormal resté bloqué 20+ min sans signature reconnue (run du 16/08,
    # jerome-guedj) qui a immobilisé tout le matrix séquentiel (max-parallel: 1)
    # derrière lui. Trois raisons pour lesquelles 10 min ne le réintroduit pas :
    # (1) la valeur ne s'applique QUE si `collect_interventions` est coché, ce
    # qui n'est pas le défaut ; (2) dans ce mode, la collecte se borne
    # elle-même — `--budget-interventions-secondes` rend la main, écrit le profil
    # partiel et consigne la troncature, si bien que le timeout de job n'est plus
    # le mécanisme d'arrêt normal mais le dernier recours contre un vrai gel ;
    # (3) un tel gel coûte 10 min au lieu de 20+, et 80 min au pire pour les
    # 8 shards en série au lieu de 72.
    #
    # CE QUE CE CALIBRAGE NE RÉGLAIT PAS, ET CE QUE #550 A CORRIGÉ. 113-219 s
    # par shard partaient à réindexer les législatures Syceron 15 et 16 — le
    # MÊME travail, refait par les 7 shards porteurs, parce que la clé
    # `public-data-cache-an-*-interv` faisait un exact key hit sur une entrée
    # écrite au run 33100214165 alors que ces deux archives étaient
    # injoignables : `actions/cache` saute alors sa sauvegarde, et l'index
    # reconstruit était jeté à chaque fin de shard. C'était #505 sous une
    # troisième forme — la clé portait le mode, pas la complétude du contenu.
    # #550 a ajouté cette dimension à la clé et rendu la sauvegarde explicite.
    #
    # CE QUI RESTE VRAI TANT QU'UN RUN RÉEL N'A PAS TRANCHÉ. Le shard qui
    # CONSTRUIT l'index le paie toujours en entier — 42 s pour la 17e (mesuré
    # run 33100214165), 55 s pour la 16e, 147 s pour la 15e (mesuré run
    # 33110395663) : environ 244 s, soit la quasi-totalité du budget de 250 s.
    # Ce shard-là sortira tronqué. Les six suivants, eux, n'ont plus rien à
    # réindexer, et leurs horloges de collecte tombent à 39-87 s (mesurées :
    # 166-247 s dont 127-205 s de réindexation). C'est le premier shard, et non
    # `jean-luc-melenchon` en particulier, qui porte désormais la troncature —
    # sauf si l'index de la semaine est déjà complet à son démarrage, auquel cas
    # les SEPT profils tiennent dans le budget actuel.
    #
    # Toute modification de ces valeurs doit rester cohérente avec le budget du
    # step d'extraction et avec le message de temps mur de prepare-an-matrix —
    # les trois sont vérifiés ensemble par tests/test_ci_budget_interventions.py.
    timeout-minutes: ${{ inputs.collect_interventions && 10 || 5 }}
    strategy:
      # fail-fast: false — un shard en échec/gelé (shutdown signal) ne doit
      # jamais annuler les shards restants : sinon le matrix n'apporte aucune
      # isolation, contrairement à l'objectif de #344.
      fail-fast: false
      # max-parallel: 1 — CONSERVÉ par #412, sur l'argument *cache* de #222 et
      # lui seul : les shards se passent le cache AN chaud de proche en proche,
      # là où des shards parallèles retéléchargeraient chacun les dumps AN Open
      # Data. L'argument *concurrence* de #222 (« préserve le pic de 4 jobs »)
      # est mort deux fois : le pic réel est 6 depuis #344/#394, et l'hypothèse
      # de plafond de dépense qui le motivait a été infirmée. Voir
      # docs/decisions/concurrence-shards-extraction-412.md.
      #
      # #467 a ouvert le matrix ROSTER à 4 sans toucher à celui-ci, et
      # l'asymétrie est délibérée : ici les shards écrivent réellement la clé
      # de la semaine (le premier sauvegarde, les suivants font un exact key
      # hit), donc la chaîne de réchauffement existe — c'est ce que #424 a
      # réparé. Le job roster, lui, démarre derrière ce job par `needs:` : sa
      # clé est déjà chaude quand sa matrice commence, ses shards ne se passent
      # rien et n'ont donc rien à sérialiser. Voir
      # docs/decisions/budget-execution-pleine-echelle-467.md.
      max-parallel: 1
      matrix:
        # `|| '[]'` : garde-fou de forme (#412 §2.1). Un prepare-an-matrix en
        # échec skippe déjà ce job — le repli évite en plus une erreur
        # d'évaluation `fromJson('')` illisible dans l'interface Actions.
        slug: ${{ fromJson(needs.prepare-an-matrix.outputs.slugs || '[]') }}
    # continue-on-error: true — même pattern que extract-parltrack/
    # extract-amendements-an : l'échec d'un shard ne doit pas empêcher
    # merge-and-pivot de fusionner les autres shards/sources qui ont réussi
    # (avant #222, needs: sur ce job dans extract-roster-groupes/
    # merge-and-pivot bloquait tout le run dès qu'une seule des 3 sources
    # FR/UE échouait, même si les 2 autres avaient réussi).
    continue-on-error: true

    steps:
      # SPARSE-CHECKOUT — LE CHECKOUT COMPLET NE TIENT PLUS DANS `timeout-minutes`.
      #
      # Run 33404236969 (31/08/2026) : les 13 shards ont été tués l'un après
      # l'autre à 5 min 00 **dans `actions/checkout`**, l'étape « Extraction AN »
      # restant `skipped`. Ce n'est pas un incident réseau : le checkout mesuré
      # ce jour-là valait 4 min 52 à 6 min 03 dans TOUS les jobs du run — seul
      # `extract-an` en meurt, parce qu'il est le seul à `timeout-minutes: 5`.
      # Un shard tué par `timeout-minutes` n'écrit AUCUN profil (#498) : le run
      # a donc coûté 40 minutes pour rien.
      #
      # LA CAUSE EST LE POIDS DE L'ARBRE, PAS CELUI D'UN FICHIER. À `501c6997`,
      # l'arbre pèse 8 483 Mio, dont 7 566 dans `raw_data/` et **7 525 dans le
      # seul `raw_data/profiles/`** (1 503 fichiers). Le garde-fou #580
      # (`src/garde_fou_blobs.py`, §7 du quality gate) surveille le PLUS GROS
      # FICHIER — 50 Mio d'alerte, 80 Mio d'échec — et n'a rien à dire sur un
      # total qui grossit à chaque run. Relever `timeout-minutes` ne ferait que
      # reporter la date du prochain franchissement.
      #
      # CE QU'UN SHARD LIT VRAIMENT. `generate_all_profiles.py --source an
      # --only <slug>` filtre les candidats sur `raw_data/candidats.json`, pas
      # sur le répertoire de profils : la seule énumération de ce répertoire,
      # `profil_brut.slugs_du_repertoire`, n'est appelée que par des scripts de
      # migration et d'audit, jamais par le chemin de collecte. Un shard n'a
      # donc besoin que du code, des référentiels de premier niveau, des index
      # figés — et de SON PROPRE profil brut, socle `<slug>.json` plus tranches
      # `<slug>/<legislature>.json` (#580), qu'il doit lire pour que la fusion
      # additive ne perde rien.
      #
      # `filter: blob:none` complète la liste blanche, comme dans `tests.yml` :
      # sans lui git téléchargerait les blobs de tout l'arbre avant de n'en
      # matérialiser qu'une fraction — c'est-à-dire exactement le coût qu'on
      # cherche à supprimer.
      #
      # AJOUTER ICI TOUT NOUVEAU CHEMIN QUE LA COLLECTE AN LIT. Un chemin
      # oublié ne casse pas le checkout : il rend un fichier absent, et la
      # collecte échoue ou se replie en silence — le scénario #434, #518 (deux
      # fois) et #520. `tests/test_ci_sparse_checkout_extract_an.py` échoue
      # LOCALEMENT sur un littéral de `src/` non couvert.
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            .gitignore
            requirements.txt
            scripts
            src
            raw_data/candidats.json
            raw_data/correspondance_acteurs_an.json
            raw_data/resolutions_candidats.json
            raw_data/gouvernements_reels.json
            raw_data/groupes_reels.json
            raw_data/amendements_an_figes
            raw_data/scrutins_an_figes
            raw_data/profiles/${{ matrix.slug }}.json
            raw_data/profiles/${{ matrix.slug }}

      # Le checkout n'a matérialisé qu'une fraction de l'arbre : on le dit, et
      # on vérifie que les référentiels indispensables en font partie. Sans ce
      # relevé, un profil absent se lit plus bas comme « ce candidat n'avait
      # rien de collecté » — une collecte vide qui n'écrase rien (#465) mais qui
      # ferait repartir la fusion additive de zéro, en silence.
      - name: Périmètre du checkout — ${{ matrix.slug }}
        run: |
          echo "Arbre matérialisé : $(du -sh . 2>/dev/null | cut -f1)"
          if [ -f "raw_data/profiles/${{ matrix.slug }}.json" ]; then
            echo "Socle brut présent : $(du -sh "raw_data/profiles/${{ matrix.slug }}.json" | cut -f1)"
          else
            echo "::notice::Aucun socle brut committé pour ${{ matrix.slug }} — première collecte, ou slug absent du corpus publié."
          fi
          for chemin in raw_data/candidats.json raw_data/correspondance_acteurs_an.json; do
            [ -f "$chemin" ] || { echo "::error::$chemin absent du checkout : la liste blanche sparse-checkout de extract-an est incomplète."; exit 1; }
          done

      # Horodatage de démarrage + relevé mémoire runner (OOM) + setup-python +
      # pip install, factorisés par #412 §3.
      - uses: ./.github/actions/bootstrap-extraction

      - name: Semaine ISO courante (clé de cache AN)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # #550 : L'EMPREINTE DE COMPLÉTUDE ATTENDUE, seconde dimension de la clé.
      # Elle dit quelles législatures d'index un cache COMPLET porte, et elle
      # est DÉRIVÉE des constantes du code (`SYCERON_AVAILABLE_LEGISLATURES`,
      # `AN_QUESTIONS_PATH`), jamais recopiée ici : recopiée, elle deviendrait
      # fausse à l'ouverture de la 18e législature et l'entrée complète ne
      # serait plus jamais atteinte. Voir src/cache_an_empreinte.py et
      # docs/decisions/cache-completude-interventions-550.md.
      #
      # Calculée dans les DEUX modes : en mode par défaut son résultat n'entre
      # pas dans la clé (le contenu concerné n'y est pas produit), mais le step
      # de sauvegarde a besoin d'une sortie non vide pour distinguer « rien à
      # sauvegarder » de « le calcul a échoué ».
      - name: Empreinte de complétude attendue (clé de cache AN, #550)
        id: empreinte_attendue
        if: ${{ !inputs.cold_start }}
        run: |
          EMPREINTE=$(python3 src/cache_an_empreinte.py --attendue)
          echo "empreinte=$EMPREINTE" >> "$GITHUB_OUTPUT"
          echo "Complétude visée pour le cache d'interventions AN : $EMPREINTE"

      # cold_start=true  → pas de restore (on repart de zéro).
      # cold_start=false → restore du cache AN ; réduit les requêtes NosDéputés.
      # Clé partagée entre les shards de ce job et extract-roster-groupes, qui
      # consomment le même jeu de données source.
      #
      # `path` liste les sous-répertoires UN PAR UN, et n'inclut PAS
      # .cache/amendements_an (#424). La réserve de #412 §2.3 a été confirmée
      # par le run 32136438841 : quand extract-amendements-an écrivait cette
      # même clé, ce job faisait un *exact key hit* et actions/cache sautait sa
      # sauvegarde post-job (« Cache hit occurred on the primary key, not saving
      # cache ») — les ~48 Mo d'archives AN qu'il télécharge n'étaient donc
      # jamais persistés, et étaient re-téléchargés par chacun des 9 jobs,
      # ~438 Mo par run. Les amendements ont désormais leur propre clé.
      #
      # Cacher `.cache` en bloc ré-embarquerait amendements_an et déplacerait le
      # problème au lieu de le résoudre. L'énumération explicite est donc
      # délibérée : son revers est qu'un nouveau sous-répertoire de .cache ne
      # serait pas caché silencieusement, d'où le garde-fou ci-dessous.
      #
      # LA CLÉ PORTE LE MODE (#505). Elle ne portait que la semaine ISO, alors
      # que le CONTENU dépend de `collect_interventions` : sans lui, ce job ne
      # remplit ni questions_an ni syceron_an. Le premier run de la semaine
      # figeait donc l'entrée pour les six jours suivants, et un run en mode
      # interventions faisait un *exact key hit* sur une entrée sans débats ni
      # questions — `actions/cache` sautait sa sauvegarde et CHAQUE shard
      # retéléchargeait 650 Mo d'archives. Mesuré : l'entrée
      # `public-data-cache-an-2026-W34` (21 881 332 o) a été écrite le
      # 18/08 14:46:15 par le premier shard de ce job dans le run 32149708461,
      # en mode par défaut ; les deux runs en mode interventions du 20/08
      # (32302557156, 32379928098) l'ont tous deux touchée sans jamais sauver.
      # C'est #424 sous une autre forme : dissociation non pas entre deux JOBS
      # mais entre deux MODES du même job.
      #
      # `path` ne retient des interventions que l'INDEX, jamais les archives.
      # `_build_acteur_questions_index` / `_read_cached_interventions_syceron_acteur`
      # court-circuitent tout le réseau dès que l'index existe : cacher les ZIP
      # et l'arborescence XML extraite n'accélérerait rien et coûterait ~1,8 Go
      # d'entrée (mesuré le 20/08 : 380 Mo sur disque pour la SEULE législature
      # 17 de syceron_an, dont 324 Mo de XML extrait).
      #
      # #510 : côté Syceron, l'index est désormais un RÉPERTOIRE de tranches par
      # acteur (`index_par_acteur/PA######.json`) et non plus un fichier plat —
      # le fichier plat était relu ENTIER à chaque candidat. Le `path` doit
      # suivre, et **à l'identique dans les deux jobs qui le déclarent** : la
      # version d'une entrée de cache est un hachage du `path`, donc deux
      # écritures différentes sous la même clé ne se verraient pas (AGENTS.md).
      # À SURVEILLER au premier run : l'entrée passe de ~21 Mo à l'ordre du Go
      # (1 664,8 Mio d'index sur disque, avant compression) face au quota de
      # 10 Go du dépôt. Si elle le sature, c'est la mise en cache de l'index
      # Syceron qu'il faut trancher — pas le contenu de l'index.
      # MESURÉ le 28/08 : l'entrée du 27/08 pèse 114 481 867 o et le dépôt en
      # utilise 826 173 608 au total, 13 entrées comprises. Le quota n'est donc
      # pas la contrainte active. Restent à mesurer le poids d'une entrée
      # COMPLÈTE (les trois législatures Syceron, pas une seule) et le nombre
      # d'entrées par semaine, que #550 fait passer de 1 à une par état de
      # complétude réellement atteint.
      #
      # LA CLÉ PORTE AUSSI LA COMPLÉTUDE (#550). Le mode y était depuis #505,
      # mais rien n'y disait ce que l'entrée CONTIENT : le 27/08, deux archives
      # Syceron et deux archives de questions étant injoignables, ce job a
      # sauvegardé sous la clé du mode une entrée qui ne portait que la 17e
      # législature de débats et les 16e/17e de questions. Le run suivant a fait
      # un *exact key hit* dessus, `actions/cache` a sauté sa sauvegarde, et les
      # 7 shards porteurs ont réindexé les 15e et 16e pour rien — 113 à 219 s
      # chacun. Le suffixe d'empreinte fait qu'une entrée partielle ne percute
      # plus une entrée complète.
      #
      # RESTAURATION SEULE ici, sauvegarde EXPLICITE en fin de job : les deux
      # clés diffèrent (visée / atteinte), ce qu'un `actions/cache` combiné ne
      # sait pas exprimer — il ne connaît qu'une clé, et une entrée de cache
      # GitHub est immuable, donc la clé fautive de la semaine ne pourrait pas
      # être réécrite même en sauvegardant explicitement sous la même.
      #
      # `restore-keys` : la semaine + le mode d'abord (la meilleure entrée du
      # jour, y compris une partielle laissée par un shard précédent), puis le
      # repli historique. En mode par défaut la première ligne est vide et
      # `actions/cache` l'ignore — la liste redevient celle d'avant #550.
      #
      # LE PRÉFIXE NU RESTE (#555), et c'est délibéré. Il TRAVERSE les semaines :
      # sur un miss de la clé exacte, `actions/cache` sert l'entrée la plus
      # récente qui commence par lui, donc potentiellement celle de la semaine
      # précédente. Mesuré, run 32738726729 (lundi 24/08, première exécution de
      # W35, job 97468417763) : « Cache restored from key:
      # public-data-cache-an-2026-W34 » à 14:28:54, extraction de 10,12 s sans
      # qu'une seule archive soit rouverte, « Cache saved with key:
      # public-data-cache-an-2026-W35 » à 14:29:12. Dix-huit secondes pour
      # blanchir le contenu du 20/08 sous la clé du 24/08.
      # Le retirer réglerait la fraîcheur en rouvrant #424 — le premier run de
      # chaque semaine repartirait d'un cache vide — et jetterait avec les
      # archives vivantes les index des législatures CLOSES, dont le
      # réchauffement inter-semaines est légitime : 147 s de réindexation pour
      # la 15e, 55 s pour la 16e, 42 s pour la 17e (mesures #550). Ce qui
      # manquait n'est pas une clé mais un marqueur de fraîcheur — voir le step
      # suivant, qui périme ce qui périme et conserve ce qui ne périme pas.
      - uses: actions/cache/restore@v5
        id: cache_an
        if: ${{ !inputs.cold_start }}
        with:
          path: |
            .cache/acteurs_historique_an
            .cache/scrutins_an
            .cache/questions_an/*/index_par_acteur.json
            .cache/syceron_an/*/index_par_acteur
          key: public-data-cache-an-${{ steps.week.outputs.week }}${{ inputs.collect_interventions && format('-interv-{0}', steps.empreinte_attendue.outputs.empreinte) || '' }}
          restore-keys: |
            ${{ inputs.collect_interventions && format('public-data-cache-an-{0}-interv', steps.week.outputs.week) || '' }}
            public-data-cache-an-

      # #555 — PÉREMPTION SÉLECTIVE, job PRODUCTEUR.
      #
      # Le marqueur de fraîcheur n'est pas un fichier à écrire : c'est
      # `cache-matched-key`, la clé effectivement restaurée, qui porte déjà sa
      # semaine. Rien n'est donc ajouté au `path:` ci-dessus — un `path:` modifié
      # change la *version* de l'entrée et ferait perdre une semaine de cache
      # rien qu'à déployer la correction.
      #
      # Semaine restaurée = semaine courante → rien. Sinon, `--perimer` supprime
      # les seuls chemins qui VIEILLISSENT : `acteurs_historique_an` en entier
      # (aucune structure par législature, republié en continu) et les
      # répertoires des législatures NON figées sous scrutins/questions/syceron.
      # Les législatures closes restent en place : c'est ce qui distingue cette
      # correction du retrait du préfixe nu, et ce qui fait tomber le coût
      # hebdomadaire de 244 s (les trois législatures) à 42 s (la 17e seule).
      # La frontière est dérivée de AN_SCRUTINS_LEGISLATURES_FIGEES et
      # AN_AMENDEMENTS_LEGISLATURES_FIGEES, jamais recopiée ici — même règle que
      # l'empreinte de #550, qui deviendrait fausse à la clôture de la 17e.
      #
      # Ne peut pas faire échouer le shard : la péremption est un
      # rafraîchissement, pas une garde. Voir src/cache_an_fraicheur.py et
      # docs/decisions/cache-fraicheur-interventions-555.md.
      - name: Fraîcheur du cache AN restauré — péremption sélective (#555)
        if: ${{ !inputs.cold_start }}
        continue-on-error: true
        run: |
          python3 src/cache_an_fraicheur.py \
            --semaine "${{ steps.week.outputs.week }}" \
            --cle-restauree "${{ steps.cache_an.outputs.cache-matched-key }}" \
            --perimer

      # Clé DÉDIÉE aux dossiers législatifs (#427), séparée de la clé AN.
      # merge-and-pivot en a besoin pour générer les profils de gouvernement,
      # mais restaurer `public-data-cache-an-*` depuis là-bas embarquerait
      # aussi `scrutins_an` — plusieurs centaines de Mo pour en utiliser 46.
      #
      # Ce commentaire a affirmé jusqu'à #505 qu'aucune dissociation entre
      # producteur de contenu et écrivain de clé n'était possible ici, les
      # *trois* jobs concernés consommant les mêmes archives. C'ÉTAIT FAUX au
      # moment où on l'a écrit, et la raison invoquée est fausse à son tour
      # aujourd'hui : `extract-roster-groupes` a porté
      # `--skip-dossiers-legislatifs` en dur de #357 à #817, qui l'a mis sous
      # `inputs.collect_dossiers_legislatifs`. Quand cette case est cochée, le
      # roster télécharge et REMPLIT `.cache/dossiers_an` — il est donc un
      # producteur de contenu, ce que ce bloc niait.
      # Deux fois le même défaut, sur le même commentaire : une justification
      # datée que personne ne relit quand le pipeline bouge sous elle.
      #
      # LA CONCLUSION NE CHANGE PAS, et #817 la renforce même : le roster reste
      # en restauration seule. Ce qu'il en coûte est mesurable et assumé — quand
      # la case est cochée, les 8 shards retéléchargent les dossiers à chaque
      # run, faute d'écrire la clé. L'inverse coûterait bien plus cher : voir
      # juste en dessous pourquoi un roster écrivain est dangereux.
      # Le défaut restait latent parce que ce job-ci est ordonné AVANT le roster
      # (`needs:`) et écrit donc la clé le premier — mais rien ne le garantit :
      # un `prepare-an-matrix` rendant une liste vide skippe ce job, et le
      # roster (`if: !cancelled()`) écrirait alors la clé de la semaine sur un
      # répertoire de dossiers vide. D'où la restauration seule côté roster
      # (#505) et le garde-fou tests/test_ci_cache_producteur_ecrivain.py.
      - uses: actions/cache@v5
        id: cache_dossiers_extract_an
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/dossiers_an
          key: public-data-cache-dossiers-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-dossiers-

      # #762 — REPRENDRE L'ARCHIVE VIVANTE QUAND LA SEMAINE A CHANGÉ.
      #
      # La clé de ce cache est hebdomadaire, mais le `restore-keys` de préfixe
      # la désamorce : au changement de semaine, la clé exacte manque, le
      # préfixe restaure le répertoire de la semaine d'avant, et
      # `ensure_dossiers_zip_downloaded` court-circuite sur `is_file()` — rien
      # n'est retéléchargé, et le répertoire inchangé repart sous la clé neuve.
      # C'est #749, appliqué aux dossiers.
      #
      # `cache-hit == 'true'` UNIQUEMENT sur correspondance exacte de la clé
      # primaire ; 'false' quand la restauration vient d'un `restore-keys` —
      # exactement le signal « on a changé de semaine ».
      #
      # Seules les législatures EN COURS sont reprises (9,8 Mo). Les dissoutes
      # ne produisent plus d'acte : les reprendre coûterait 23 Mo par semaine
      # pour un contenu identique.
      #
      # `!inputs.cold_start` COMME LE BLOC DE CACHE CI-DESSUS, et pour une
      # raison concrète : sur un démarrage à froid, le `rm -rf .cache` qui suit
      # effacerait ce que cette étape vient de télécharger. Rien à rafraîchir
      # là où tout est purgé puis repris.
      - name: Reprendre les archives de dossiers vivantes (semaine nouvelle)
        if: ${{ !inputs.cold_start && steps.cache_dossiers_extract_an.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: python3 src/rafraichir_dossiers_actifs.py

      # cold_start=true → purge des caches de téléchargement avant extraction.
      # `cold_start` purge les CACHES DE TÉLÉCHARGEMENT, et rien d'autre
      # (#578). Il supprimait aussi `raw_data/profiles/*.json`, ce qui est une
      # politique d'écriture déguisée en politique de fraîcheur : un profil
      # effacé n'a plus rien à fusionner, donc le mode écrivait par-dessus
      # l'existant sans que personne ne l'ait demandé. Ce qu'on fait des
      # profils déjà écrits se demande sur l'autre axe, `existing_profiles`.
      # (Sans effet sur le corpus committé de toute façon : depuis #450 chaque
      # job ne publie que ce qu'il a écrit, et `merge-and-pivot` refait son
      # propre checkout.)
      - name: Purge des caches de téléchargement (cold_start uniquement)
        if: ${{ inputs.cold_start }}
        run: rm -rf .cache

      # Cache-only : cet artifact provient du job extract-amendements-an (#251),
      # qui est bien en `needs:` de ce job (le commentaire disait l'inverse
      # jusqu'à #412 §2.2). continue-on-error: true quand même : ce job a
      # continue-on-error: true, donc il peut « réussir » sans avoir produit
      # d'artifact — en cas d'absence, on s'appuie sur ce que la restauration du
      # cache partagé public-data-cache-an-* contient déjà (#252). Placé après
      # la purge cold_start (pas avant) : la lecture cache-only s'applique
      # aussi en cold_start, donc ne doit pas être effacée par le
      # `rm -rf .cache` ci-dessus.
      - name: Download artifact amendements AN (optionnel)
        id: amendements_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # Repli #424 : avant la scission des clés, l'absence d'artifact était
      # rattrapée par le cache partagé, qui contenait alors les amendements.
      # Ce n'est plus le cas — d'où cette restauration explicite, en lecture
      # seule (`cache/restore`, jamais de sauvegarde : ce job ne produit pas
      # d'amendements) et UNIQUEMENT si l'artifact a manqué. La conditionner
      # évite de restaurer ~676 Mo dans chaque shard pour un cas rare, ce qui
      # recréerait le coût que cette issue supprime.
      #
      # Non repris dans merge-and-pivot : ce job n'a ni step `week` ni cache, et
      # l'absence d'amendements y est déjà une dégradation gracieuse documentée
      # (section 3d du quality gate signale « jamais construite »).
      - name: Repli — cache amendements si l'artifact manque
        if: ${{ steps.amendements_artifact.outcome == 'failure' }}
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/amendements_an
          key: public-data-cache-amendements-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-amendements-

      # --source an → NosDéputés uniquement (pas d'UE dans ce job ; le Sénat
      # n'existe plus comme source depuis #528).
      # --only : un seul candidat par shard, donc --workers n'a plus d'effet
      # (le parallélisme inter-candidats est désormais porté par le matrix).
      # existing_profiles=overwrite → --no-merge : écrasement complet.
      # sinon                        → fusion additive : données existantes préservées.
      # /usr/bin/time -v : trace le pic de RSS (diagnostic OOM, voir le step
      # "Diagnostic mémoire runner" de ./.github/actions/bootstrap-extraction)
      # — n'apparaît dans les logs que si le process Python se termine
      # (normalement ou tué) sans que le runner entier ne disparaisse avec lui.
      #
      # NE PAS déplacer les MERGE_FLAG/INTERV_FLAG ci-dessous dans une action
      # composite (verdict #412 §3) : retry-generate-data.yml reconstruit les
      # inputs du run échoué en grepant le TEXTE BASH SUBSTITUÉ de ce step dans
      # les logs (`--source an --workers \K[0-9]+`, `INTERV_FLAG`). Les
      # factoriser casserait ce mécanisme. `--max-pages` en faisait partie
      # jusqu'à #510, qui l'a retiré avec la recherche NosDéputés. Même remarque pour les steps homonymes de
      # extract-ue-officiel et extract-roster-groupes.
      # LES RÉSOLUTIONS DU RUN (#775). Sans elles, un candidat que l'identifiant
      # externe déclare sans mandat AN ne recevait AUCUN profil — et sans profil,
      # la passe hors ligne ne pouvait pas écrire son entrée de table, qui était
      # justement ce qui lui aurait donné un profil. Cinq candidats déclarés
      # étaient bloqués là, et aucun run futur ne les aurait débloqués.
      #
      # Optionnel : sans l'artifact, `--resolutions` pointe un fichier absent,
      # la lecture rend False, et le comportement est celui d'avant à
      # l'identique. L'artifact porte AUSSI `candidats.json` du jour — le shard
      # lisait jusqu'ici la liste COMMITTÉE, donc celle d'hier.
      - name: Liste et résolutions du run — artifact (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: candidats-a-jour
          path: raw_data/

      - name: Extraction AN — ${{ matrix.slug }}
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
        run: |
          MERGE_FLAG=()
          # `existing_profiles=overwrite` écrase SANS purger le cache (#440,
          # #578) : c'est le cas courant — on réécrit les profils à partir de
          # données déjà téléchargées. Purger obligerait à re-télécharger
          # ~300 Mo d'archives AN, sur une source dont l'indisponibilité a déjà
          # bloqué trois chantiers. `cold_start` est l'autre axe, et il ne lève
          # plus `--no-merge` : purger le cache ne dit rien de ce qu'on écrit.
          [[ "$OVERWRITE" == "true" ]] && MERGE_FLAG=(--no-merge)
          INTERV_FLAG=()
          [[ "${{ inputs.collect_interventions }}" != "true" ]] && INTERV_FLAG=(--skip-interventions)
          # `--max-pages` a été RETIRÉ (#510) : il bornait la recherche
          # d'interventions NosDéputés, qui n'existe plus. Le repli qu'elle
          # alimentait est parti avec elle, et les 90 s qu'elle coûtait sur
          # `jean-luc-melenchon` (run 32379928098) sont rendues au budget.
          # #498 : la collecte d'interventions se borne elle-même. Au-delà du
          # budget, elle s'arrête entre deux unités, le profil partiel est écrit
          # — donc publié par le step suivant — et la troncature part en
          # ::warning:: et dans meta.warnings[] du profil. Sans ce budget, le
          # shard était tué par `timeout-minutes` avant son écriture : les 12
          # shards tués des runs 32302557156 (4 sur 8) et 32379928098 (8 sur 8)
          # ont TOUS publié « 0 profil(s) », vérifiés un par un.
          #
          # 250 s (#546, était 240). LES 240 s NE VENAIENT PAS DE CE PIPELINE :
          # « 1,5x la plus longue extraction allée au bout dans CE mode (160 s,
          # edouard-philippe, run 32302557156) » — un run où Syceron rendait ZÉRO
          # intervention (défaut #510) et où la recherche NosDéputés pesait encore
          # 90 s. Elles ont tronqué deux profils sur sept au premier run où les
          # archives ont répondu (33110395663, 27/08) :
          #
          #   jerome-guedj ....... horloge 247 s — 1 législature de questions perdue
          #   jean-luc-melenchon . horloge 332 s — 1 législature de questions perdue
          #
          # HORLOGE DE COLLECTE MESURÉE sur ce run, 7 shards porteurs : 166, 200,
          # 208, 208, 244, 247*, 332* s (* = tronqué). 250 s est la plus grande
          # valeur qui tienne dans le `timeout-minutes` de ce job — voir
          # l'interlock détaillé au-dessus de `timeout-minutes:` — et elle passe
          # au-dessus de six de ces sept horloges. La septième
          # (jean-luc-melenchon) restera tronquée : la compléter demande >= 340 s
          # d'horloge, donc un timeout >= 11,3 min, au-delà du plafond de 10 min
          # que le gel de 20+ min du 16/08 a posé. La perte reste DÉCLARÉE.
          # Et jerome-guedj ne passe qu'à 3 s près : ce n'est pas une garantie,
          # c'est un profil de plus ce jour-là. Ce qui la donne est la réparation
          # du cache Syceron, pas un budget plus grand — c'est ce que #550 a
          # fait : les 113-219 s de réindexation ne sont plus payées que par le
          # shard qui construit l'index, pas par les sept. La valeur de 250 s
          # n'est PAS retouchée ici : elle a été posée sur des horloges mesurées
          # avant #550, et les remesurer demande un run réel.
          #
          # Doit rester cohérent avec le `timeout-minutes` de ce job (vérifié par
          # tests/test_ci_budget_interventions.py).
          BUDGET_FLAG=()
          [[ "${{ inputs.collect_interventions }}" == "true" ]] && BUDGET_FLAG=(--budget-interventions-secondes 250)
          # `--budget-collecte-secondes 0` (#514) : absence de budget de
          # collecte globale, DÉCLARÉE. Ce n'est pas un oubli reconduit —
          # mesuré sur les 16 shards des runs 32233766814 et 32288588518, une
          # extraction AN sans interventions coûte 8 à 18 s, et avec
          # interventions elle est déjà bornée par les 240 s ci-dessus, qui
          # couvrent les deux charges restantes du mode (Syceron et questions
          # officielles — les détails NosDéputés sont partis avec le repli,
          # #510). Un second plafond n'aurait rien à borner de plus, et
          # #500 fonctionne : les 8 shards du run 32421439590 sont en succès.
          # Le zéro est explicite parce que l'OMISSION est ce qui a produit
          # #514 — la valeur doit être une décision lisible, pas un défaut.
          /usr/bin/time -v python3 src/generate_all_profiles.py --source an --only "${{ matrix.slug }}" --budget-collecte-secondes 0 --manifest-out _manifest/profils-ecrits.txt "${MERGE_FLAG[@]}" "${INTERV_FLAG[@]}" "${BUDGET_FLAG[@]}"

      # #450 : n'uploader QUE ce que ce job a écrit. Le `path:` pointe sur le
      # staging rempli à partir du manifeste, jamais sur `raw_data/profiles/`,
      # qui contient aussi la baseline committée issue du checkout — c'est elle
      # qui, republiée par chaque job, réinjectait des données périmées à la
      # fusion et faisait entrer les shards en collision. Rationale complète
      # dans ./.github/actions/publish-written-profiles.
      - name: Profils écrits par ce job — ${{ matrix.slug }}
        if: always()
        uses: ./.github/actions/publish-written-profiles
        with:
          manifest: _manifest/profils-ecrits.txt

      # Le `path:` était déjà scopé au seul fichier de ce candidat (#344), mais
      # sur le CHEMIN attendu et non sur une écriture constatée : une extraction
      # qui ne trouvait aucune identité (statut "introuvable", aucun profil
      # écrit) republiait quand même la copie périmée laissée par le checkout.
      # Le staging du manifeste ferme ce cas — un job qui n'écrit rien ne
      # publie rien.
      - name: Upload artifact AN — ${{ matrix.slug }}
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-an-${{ matrix.slug }}
          path: _publish/profiles/
          if-no-files-found: warn

      # #550 : la complétude ATTEINTE par ce shard, mesurée sur le disque —
      # exactement les fichiers que le `path:` ci-dessous capture, pas ce que le
      # code croit avoir écrit. C'est elle qui nomme l'entrée sauvegardée.
      #
      # `!cancelled()` et non `success()` : une extraction en échec ou tronquée
      # par son budget laisse quand même sur le disque les index qu'elle a eu le
      # temps de construire, et ce sont eux que les shards suivants n'auront pas
      # à reconstruire. Ce qui serait faux, c'est de les faire passer pour
      # complets — et c'est l'empreinte qui l'interdit, pas cette condition.
      - name: Complétude atteinte par ce shard (clé de sauvegarde, #550)
        id: empreinte_obtenue
        if: ${{ !cancelled() && !inputs.cold_start }}
        run: |
          EMPREINTE=$(python3 src/cache_an_empreinte.py --disque)
          echo "empreinte=$EMPREINTE" >> "$GITHUB_OUTPUT"
          echo "Complétude atteinte : $EMPREINTE (visée : ${{ steps.empreinte_attendue.outputs.empreinte }})"

      # SAUVEGARDE EXPLICITE (#550). Trois choses la gouvernent :
      #
      # 1. PLACÉE APRÈS LA PUBLICATION DU PROFIL, délibérément. Elle est le
      #    dernier poste du job et le seul qui puisse s'étirer (5,2 s mesurées
      #    le 27/08 pour 114 Mo ; une entrée complète, plus lourde, reste à
      #    mesurer). Si le `timeout-minutes` du job la coupe, ce qui est perdu
      #    est une entrée de cache — jamais le profil, déjà écrit et uploadé.
      #    Même raison pour `continue-on-error: true` : un échec de sauvegarde
      #    ne doit pas marquer en échec un shard qui a livré ses données.
      #
      # 2. LA CLÉ PORTE L'EMPREINTE OBTENUE, pas l'attendue. Un shard qui n'a pu
      #    indexer que deux législatures sur trois sauvegarde sous une clé qui
      #    le dit ; le shard suivant la restaure par `restore-keys`, complète la
      #    troisième et sauvegarde sous la clé complète. La semaine se réchauffe
      #    de proche en proche au lieu de se figer sur son premier échec.
      #
      # 3. NE SAUVEGARDE PAS SI RIEN N'A CHANGÉ. La condition compare la clé
      #    restaurée à celle qu'on écrirait : égales, l'entrée existe déjà (elles
      #    sont immuables) et le seul effet d'un appel serait de payer
      #    l'archivage pour un refus. C'est le cas de tous les shards qui
      #    suivent celui qui a complété l'index. `empreinte != ''` couvre le
      #    step d'empreinte lui-même en échec : sans lui, la clé s'écrirait
      #    `…-interv-` et redeviendrait muette sur son contenu.
      - name: Sauvegarde du cache AN — complétude atteinte (#550)
        if: >-
          ${{ !cancelled() && !inputs.cold_start
          && steps.empreinte_obtenue.outputs.empreinte != ''
          && steps.cache_an.outputs.cache-matched-key !=
          format('public-data-cache-an-{0}{1}', steps.week.outputs.week,
          inputs.collect_interventions &&
          format('-interv-{0}', steps.empreinte_obtenue.outputs.empreinte) || '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/acteurs_historique_an
            .cache/scrutins_an
            .cache/questions_an/*/index_par_acteur.json
            .cache/syceron_an/*/index_par_acteur
          key: public-data-cache-an-${{ steps.week.outputs.week }}${{ inputs.collect_interventions && format('-interv-{0}', steps.empreinte_obtenue.outputs.empreinte) || '' }}

      # Blocs factorisés en action composite (#412 §3). Le `if:` reste porté par
      # le step appelant : cancelled()/failure() évalués à l'intérieur de
      # l'action porteraient sur ses propres steps, pas sur l'état du job.
      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: cancelled
          scope: 'candidat `${{ matrix.slug }}`'

      - name: Diagnostic — job en échec
        if: failure()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: failure
          scope: 'candidat `${{ matrix.slug }}`'


  # ──────────────────────────────────────────────────────────────────────────
  # JOB D'EXTRACTION — API officielle Parlement européen
  # ──────────────────────────────────────────────────────────────────────────
  extract-ue-officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # continue-on-error: true — voir justification sur extract-an ci-dessus.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Horodatage de démarrage + relevé mémoire runner (OOM) + setup-python +
      # pip install, factorisés par #412 §3.
      - uses: ./.github/actions/bootstrap-extraction

      - name: Semaine ISO courante (clé de cache UE)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # `path` resserré sur ce que ce job produit réellement (#424) : cacher
      # `.cache` en bloc lui faisait ré-embarquer les données AN et amendements
      # présentes dans le répertoire, gonflant une entrée qui n'en a pas besoin.
      # Le quota de cache du dépôt étant partagé, une entrée surdimensionnée
      # provoque l'éviction LRU des autres — dont la clé AN que #424 vient de
      # réparer.
      - uses: actions/cache@v5
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/europarl
          key: public-data-cache-ue-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-ue-

      # `cold_start` purge les CACHES DE TÉLÉCHARGEMENT, et rien d'autre
      # (#578). Il supprimait aussi `raw_data/profiles/*.json`, ce qui est une
      # politique d'écriture déguisée en politique de fraîcheur : un profil
      # effacé n'a plus rien à fusionner, donc le mode écrivait par-dessus
      # l'existant sans que personne ne l'ait demandé. Ce qu'on fait des
      # profils déjà écrits se demande sur l'autre axe, `existing_profiles`.
      # (Sans effet sur le corpus committé de toute façon : depuis #450 chaque
      # job ne publie que ce qu'il a écrit, et `merge-and-pivot` refait son
      # propre checkout.)
      - name: Purge des caches de téléchargement (cold_start uniquement)
        if: ${{ inputs.cold_start }}
        run: rm -rf .cache

      # --source ue → Open Data Portal Parlement européen uniquement (pas de FR).
      - name: Extraction UE (Open Data Portal EP)
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
        run: |
          MERGE_FLAG=()
          # `existing_profiles=overwrite` écrase SANS purger le cache (#440,
          # #578) : c'est le cas courant — on réécrit les profils à partir de
          # données déjà téléchargées. Purger obligerait à re-télécharger
          # ~300 Mo d'archives AN, sur une source dont l'indisponibilité a déjà
          # bloqué trois chantiers. `cold_start` est l'autre axe, et il ne lève
          # plus `--no-merge` : purger le cache ne dit rien de ce qu'on écrit.
          [[ "$OVERWRITE" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_all_profiles.py --source ue --workers 1 --manifest-out _manifest/profils-ecrits.txt "${MERGE_FLAG[@]}"

      # #450 : n'uploader QUE ce que ce job a écrit. Le `path:` pointe sur le
      # staging rempli à partir du manifeste, jamais sur `raw_data/profiles/`,
      # qui contient aussi la baseline committée issue du checkout — c'est elle
      # qui, republiée par chaque job, réinjectait des données périmées à la
      # fusion et faisait entrer les shards en collision. Rationale complète
      # dans ./.github/actions/publish-written-profiles.
      - name: Profils écrits par ce job
        if: always()
        uses: ./.github/actions/publish-written-profiles
        with:
          manifest: _manifest/profils-ecrits.txt

      - name: Upload artifact UE
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-ue-officiel
          path: _publish/profiles/
          if-no-files-found: warn

      # Blocs factorisés en action composite (#412 §3). Le `if:` reste porté par
      # le step appelant : cancelled()/failure() évalués à l'intérieur de
      # l'action porteraient sur ses propres steps, pas sur l'état du job.
      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: cancelled

      - name: Diagnostic — job en échec
        if: failure()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: failure

  # ──────────────────────────────────────────────────────────────────────────
  # JOB D'EXTRACTION — ParlTrack (fragile — tierce source non officielle)
  #
  # continue-on-error: true → son échec ou timeout ne bloque pas merge-and-pivot.
  # Timeout court (env.PARLTRACK_TIMEOUT_MINUTES, défaut 30 min).
  # En cas d'absence d'artifact, merge-and-pivot tourne en fallback
  # (données ParlTrack du dépôt précédent, warning ajouté dans meta.warnings).
  # ──────────────────────────────────────────────────────────────────────────
  extract-parltrack:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ← même valeur que env.PARLTRACK_TIMEOUT_MINUTES (Github Actions n'accepte pas les env vars ici)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Horodatage de démarrage + relevé mémoire runner (OOM) + setup-python +
      # pip install, factorisés par #412 §3.
      - uses: ./.github/actions/bootstrap-extraction

      - name: Semaine ISO courante (clé de cache ParlTrack)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # cold_start=true  → pas de restore ; les dumps seront re-téléchargés.
      # cold_start=false → restore du cache ParlTrack (évite re-téléchargement de centaines de Mo).
      - uses: actions/cache@v5
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/parltrack
          key: public-data-cache-parltrack-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-parltrack-

      - name: Nettoyage cache ParlTrack (cold_start uniquement)
        if: ${{ inputs.cold_start }}
        run: rm -rf .cache/parltrack

      # Télécharge les dumps ParlTrack (.zst) dans .cache/parltrack/.
      # Ces dumps seront uploadés comme artifact et utilisés par merge-and-pivot
      # pour l'enrichissement ParlTrack (enrich_pivot_with_parltrack).
      #
      # #683 — CINQ DUMPS, ET NON PLUS TROIS. `ep_votes` porte les scrutins
      # nominatifs (44 648, de 2004 au 26/03/2026) et `ep_mep_activities` les
      # interventions, questions, explications de vote et propositions de
      # résolution. Ils pèsent 11 et 47 Mio, soit +58 Mio sur les 182 déjà
      # téléchargés — le job garde très largement ses 30 minutes.
      #
      # La liste vit DANS le module (`DUMPS_LUS`) et non ici : recopiée dans le
      # YAML, elle aurait divergé du jour où le module lit un sixième dump, et
      # le fichier manquant serait arrivé jusqu'à merge-and-pivot sous la forme
      # d'une liste vide — c'est-à-dire d'un constat (#510).
      - name: Téléchargement dumps ParlTrack
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from parltrack_dumps import ensure_dump, DUMPS_LUS
          force = "${{ inputs.cold_start }}" == "true"
          ok = True
          for dump in DUMPS_LUS:
              path = ensure_dump(dump, force_download=force)
              if path is None:
                  print(f"[!] Échec téléchargement : {dump}", file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          EOF

      # Nom hors de la famille raw-profiles-* (#412 §4) : cet artifact ne
      # contient pas de profils bruts mais les dumps .zst ParlTrack, consommés
      # par merge-and-pivot dans .cache/parltrack. Aucun consommateur hors du
      # run courant, donc renommage sans effet de bord.
      - name: Upload artifact ParlTrack (dumps .zst)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parltrack-dumps
          path: .cache/parltrack/
          if-no-files-found: warn

      # Blocs factorisés en action composite (#412 §3). Le `if:` reste porté par
      # le step appelant : cancelled()/failure() évalués à l'intérieur de
      # l'action porteraient sur ses propres steps, pas sur l'état du job.
      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: cancelled

      - name: Diagnostic — job en échec
        if: failure()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: failure

  # ──────────────────────────────────────────────────────────────────────────
  # JOB D'EXTRACTION — Construction dédiée des index amendements AN (#251,
  # sous-issue 3/6 du plan d'architecture #248)
  #
  # Construit sans condition les 3 index de législature (17/16/15,
  # AN_AMENDEMENTS_PATH dans src/candidate_profile.py) via
  # _download_and_build_amendement_index (#250, src/build_amendements_index.py),
  # indépendamment de toute liste de candidats — à la différence de
  # extract-an/extract-roster-groupes, qui ne déclenchent cette construction
  # que paresseusement, au niveau candidat. Objectif : pré-chauffer le cache
  # partagé .cache/amendements_an/ une seule fois par run.
  #
  # Pas de needs: sur ce job — il démarre à t=0, en parallèle des autres jobs
  # sans dépendance. Mais extract-an et extract-roster-groupes l'ont, EUX, en
  # `needs:`, si bien que les trois jobs restent strictement séquencés
  # (extract-amendements-an → extract-an → extract-roster-groupes), et les deux
  # consommateurs sont en lecture cache-only depuis #252.
  # Ce commentaire parlait des « trois jobs qui écrivent la clé de cache
  # partagée public-data-cache-an-* » : périmé depuis #424, qui a donné aux
  # amendements leur propre clé, et depuis #505, qui a mis le roster en
  # restauration seule. UN SEUL job écrit désormais cette clé : extract-an.
  #
  # La course d'écriture décrite ici jusqu'à #412 §2.2, et laissée ouverte par
  # #248 sous-issue 4, n'existe donc plus : elle a été éteinte par effet de bord
  # du séquencement de #344, sans avoir jamais été actée. Réserve corollaire à
  # valider sur un run réel : voir le commentaire de cache d'extract-an (#412
  # §2.3, sauvegarde post-job sautée sur exact key hit).
  #
  # Granularité de clé HEBDOMADAIRE et non quotidienne — décision et
  # justification complète dans
  # docs/decisions/amendements-index-budget-ci-cache-granularite.md
  # (sous-issue 1 de #248). Ce qui a changé depuis : la clé n'est plus la clé
  # partagée `public-data-cache-an-*` mais `public-data-cache-amendements-*`
  # (#424) ; seule la granularité de #248 subsiste.
  #
  # continue-on-error: true, même pattern que extract-parltrack : un échec
  # (total ou partiel, une seule législature) ne bloque pas merge-and-pivot.
  # Isolation par législature préservée (#241/#242) : un échec sur l'une
  # n'empêche jamais la construction des autres (voir
  # src/build_amendements_index.py et son test dédié).
  #
  # Timeout 30 min : budget mesuré par le spike sans code de la sous-issue 1
  # de #248 (voir docs/decisions/amendements-index-budget-ci-cache-granularite.md)
  # — valeur provisoire, à recalibrer sur le premier run réel
  # (workflow_dispatch), aucune mesure de débit GitHub Actions authentique
  # n'ayant pu être obtenue lors du spike.
  # ──────────────────────────────────────────────────────────────────────────
  extract-amendements-an:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Horodatage de démarrage + relevé mémoire runner (OOM) + setup-python +
      # pip install, factorisés par #412 §3.
      - uses: ./.github/actions/bootstrap-extraction

      - name: Semaine ISO courante (clé de cache AN, partagée avec extract-an)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Clé PROPRE à ce job depuis #424 (public-data-cache-amendements-*), et
      # non plus public-data-cache-an-* partagée avec extract-an/
      # extract-roster-groupes. Ce job étant séquencé en premier, il écrivait la
      # clé exacte de la semaine avant les autres, qui faisaient alors un exact
      # key hit et ne sauvegardaient jamais la leur (#412 §2.3, confirmé par le
      # run 32136438841). Le `path` est restreint à ce que ce job produit
      # réellement — il n'écrit que sous .cache/amendements_an/.
      #
      # cold_start=true → pas de restore : le job repart de zéro et retélécharge
      # l'archive de la législature active, sans étape de purge dédiée (ce
      # répertoire est absent par construction sur un checkout neuf quand aucun
      # cache n'est restauré).
      #
      # `id` (#749) : `outputs.cache-hit` vaut 'true' UNIQUEMENT sur
      # correspondance exacte de la clé primaire, et 'false' quand la
      # restauration vient d'un `restore-keys`. C'est donc précisément le signal
      # « on a changé de semaine ISO », et c'est lui qui manquait.
      - uses: actions/cache@v5
        id: cache_amendements
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/amendements_an
          key: public-data-cache-amendements-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-amendements-

      # #749 — LA ROTATION DE CLÉ ÉTAIT TOUTE LA POLITIQUE DE FRAÎCHEUR, et son
      # propre repli la désamorçait. #249 a choisi la clé hebdomadaire comme
      # seul mécanisme de péremption (le seuil de 7 jours de la §3d du gate est
      # documenté comme « aligné sur la granularité de cache hebdomadaire »), et
      # #253 a explicitement REJETÉ le retéléchargement inconditionnel. Mais
      # `restore-keys` restaure la semaine précédente quand la clé exacte
      # manque : le cache n'est donc jamais absent, le court-circuit de
      # `_download_and_build_amendement_index` voit toujours un index valide, et
      # la 17e n'a plus été reconstruite pendant 18 jours — le gate le criait à
      # chaque run.
      #
      # Retirer `restore-keys` aurait vidé le cache ENTIER chaque semaine, donc
      # re-matérialisé les législatures figées depuis leurs archives committées
      # — voir docs/decisions/oom-reconstruction-amendements-figees.md. Or #249
      # l'écrivait déjà : « Seule la 17e législature est concernée par la mise à
      # jour quotidienne ; les 16e et 15e sont des législatures archivées dont
      # les archives ne changeront plus jamais. » On purge donc les seules
      # actives, une fois par semaine ISO : 283 Mo, pas 1,22 Gio.
      #
      # Traitement du drapeau en bash, comme GATE_THRESHOLD plus bas : une
      # expression ternaire dans `run:` rendrait la condition illisible.
      - name: Construction des index amendements (législatures 17/16/15/14)
        env:
          CLE_SEMAINE_TOUCHEE: ${{ steps.cache_amendements.outputs.cache-hit }}
        run: |
          ARGS=()
          if [[ "$CLE_SEMAINE_TOUCHEE" != "true" ]]; then
            echo "Clé de cache exacte non touchée (semaine ISO nouvelle, ou aucun cache) :"
            echo "reconstruction forcée des législatures actives (#749)."
            ARGS+=(--reconstruire-actives)
          fi
          python3 src/build_amendements_index.py "${ARGS[@]}"

      - name: Upload artifact amendements AN
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amendements-index-an
          path: .cache/amendements_an/
          if-no-files-found: warn

      # Blocs factorisés en action composite (#412 §3). Le `if:` reste porté par
      # le step appelant : cancelled()/failure() évalués à l'intérieur de
      # l'action porteraient sur ses propres steps, pas sur l'état du job.
      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: cancelled

      - name: Diagnostic — job en échec
        if: failure()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: failure

  # ──────────────────────────────────────────────────────────────────────────
  # JOB D'EXTRACTION — Roster-driven (rollout progressif, #192)
  #
  # Déploiement progressif de l'extraction pilotée par la composition réelle
  # des groupes parlementaires (#188/#190), en alternative à la liste
  # éditoriale raw_data/candidats.json (~8 personnes) : le roster couvre
  # ~750+ membres. `roster_limit` PLAFONNE le volume traité par run ; son
  # défaut est passé de 20 à 0 (pas de plafond) avec #578 — le rollout
  # progressif qu'il budgétait est terminé (roster couvert à 452/452), et un
  # plafond ferait mentir le défaut `existing_profiles=refresh`, qui promet
  # qu'un correctif de collecte atteint l'existant sans qu'on le demande.
  # L'activation d'un run PLANIFIÉ reste une décision distincte (schedule:
  # cron toujours commenté ci-dessus).
  #
  # Séquencé après les autres jobs d'extraction (needs: ci-dessous, #222). Ce
  # séquencement avait deux justifications ; une seule tient encore (#412 §2.5,
  # docs/decisions/concurrence-shards-extraction-412.md) :
  #   - CACHE (valide) : il garantit que la clé public-data-cache-an-* est déjà
  #     chaude (écrite en amont) au moment de sa restauration ici, évitant que
  #     les jobs se disputent le même téléchargement des dumps AN Open Data.
  #   - CONCURRENCE (périmée) : « réduit le pic de 5 à 4 jobs simultanés » en
  #     mitigation d'un plafond de dépense Actions suspecté (#221). Le pic réel
  #     est de 6 depuis #344/#394 (six jobs démarrent sans needs:) et
  #     l'hypothèse #221 a été explicitement infirmée
  #     ([[verification-billing-actions]] : quota non atteint, $0 facturé,
  #     cause retenue = préemption d'infrastructure).
  #
  # continue-on-error: true, comme extract-parltrack : un échec ou
  # dépassement de ce job ne bloque pas merge-and-pivot.
  #
  # TIMEOUT MESURÉ (#376, re-mesuré après #392, RE-MESURÉ EN CI par #467).
  #
  # Historique du coût par membre, extraction légère (--skip-interventions
  # --skip-dossiers-legislatifs --workers 1, comme ce job) :
  #   avant #392 : 44 s + 11,7 s × N   (local, échantillons aléatoires)
  #   après #392 :  2,3 s + 5,05 s × N (local, idem)
  #   run 32288588518, EN CI, 19/08/2026 : ~10 s fixes + **1,9 s × N**
  #     (shard 0, 24 membres, 63,1 s de temps d'extraction, RSS max 1,52 Go)
  #   après #467, mêmes 24 membres rejoués en local : 74,1 s → 9,8 s (−86,8 %),
  #     soit ~0,5 s × N projeté en CI.
  # Ce que #467 a supprimé : la relecture, à chaque candidat, des index
  # `.cache/acteurs_historique_an/index_*.json` (2 255 relectures d'index_organes
  # pour 24 membres) et une temporisation de courtoisie payée envers une source
  # qui n'était plus appelée. Même remède que #392 sur les amendements et #403
  # sur les scrutins — voir docs/decisions/budget-execution-pleine-echelle-467.md.
  #
  # Ce que couvre 60 min APRÈS #467 : plusieurs milliers de membres, sur un
  # roster de 752. Le timeout n'est plus une contrainte dimensionnante dans
  # aucun des deux modes ; il reste un filet contre une boucle folle, et à ce
  # titre il n'a pas été rabaissé — il ne coûte rien tant qu'il n'est pas
  # atteint, et le budget publié en tête de fichier ne se calcule plus à partir
  # de lui.
  #
  # PASSAGE À PLEINE ÉCHELLE : 752 membres ≈ 4 min d'extraction cumulée
  # (projeté), là où le modèle #392 en prévoyait 63. Le découpage en shards
  # garde donc sa justification, mais UNIQUEMENT celle de #347/#394 — borner la
  # perte sur préemption : l'upload d'artifact en if: always() ne s'exécute pas
  # sur shutdown signal (angle mort #228) et le checkpoint --resume est
  # gitignoré, donc un shard préempté perd sa tranche et elle seule.
  # Ce n'est plus le timeout qui impose de sharder.
  #
  # #488 NE CHANGE RIEN À CE BUDGET, et c'est le résultat d'une mesure.
  # Ce job est le seul à omettre --source, donc le seul qui aurait pu payer
  # l'interrogation systématique du Sénat. Elle est restreinte aux profils de
  # CANDIDATS (meta.provenance = candidat_declare) : un membre de roster garde
  # le comportement historique — on s'arrête à la première chambre qui répond.
  # Coût évité, mesuré le 20/08/2026 : 2 requêtes vers archive.nossenateurs.fr
  # à ~9,5 s de médiane par membre, soit +30,6 min PAR SHARD et +4 h 04 à
  # pleine échelle, plus le retour de la temporisation de courtoisie que #467
  # avait supprimée (0,5 s par membre, puisque la source serait de nouveau
  # réellement appelée).
  # Raison éditoriale, indépendante du coût : aucun groupe sénatorial n'est
  # agrégé (les deux groupe-Senat-*.json publiés portent cohesion_votes: 0),
  # donc le passé sénatorial d'un membre de roster n'alimente aucun agrégat.
  # Voir docs/decisions/deux-chambres-interrogees.md.
  #
  # ATTENTION, le shardage n'est pas gratuit : ~130 s de frais fixes par shard
  # (mesuré), dont ~110 s de `actions/checkout`. À max-parallel: 1 c'était
  # 8 × 130 s = ~17 min de temps mur pour zéro travail utile — c'est ce que
  # max-parallel: 4 (#467) recouvre. Voir docs/decisions/budget-roster-mesure.md.
  # ──────────────────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────────────────
  # JOB PRÉPARATOIRE — Calcul du matrix de shards roster (#394)
  #
  # Le nombre de shards dépend de roster_limit :
  #   - limite > 0 (rollout progressif, cas par défaut) : UN seul shard, pour
  #     une raison SÉMANTIQUE et non de coût — --shard précède --limit, donc la
  #     limite s'applique par shard et N shards feraient N fois le lot demandé.
  #     Raisonnement complet dans le step ci-dessous, avec l'alternative
  #     « découpage proportionnel » écartée par #467.
  #   - limite = 0 (run complet, ~752 membres) : ROSTER_SHARDS tranches, pour
  #     borner la perte sur préemption — l'upload en if: always() ne s'exécute
  #     pas sur shutdown signal (angle mort #228) et le checkpoint --resume est
  #     gitignoré donc inutile entre runs. Ce n'est PLUS le timeout qui l'impose
  #     (#467 : ~4 min d'extraction cumulée projetée pour les 752 membres).
  #
  # Ce job ne lit pas raw_data/roster_candidats.json : celui-ci est régénéré
  # dans chaque shard (2 appels réseau, mutualisés par (chambre, législature)).
  # Le partitionnement se fait par position modulo côté Python (--shard I/N,
  # voir _select_shard), ce qui ne demande pas de connaître l'effectif ici.
  # ──────────────────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────────────────
  # Ce job fait DEUX choses depuis #518, et c'est une seule décision : il
  # décide du découpage du roster, et il construit le roster lui-même.
  #
  # Avant, `raw_data/roster_candidats.json` était reconstruit par chacune des
  # 9 invocations d'un run (8 shards + `merge-and-pivot`), soit 9 fetchs
  # identiques de la même liste de 618 parlementaires. Deux défauts, l'un de
  # coût et l'autre de correction :
  #
  #   - COÛT/FRAGILITÉ : 9 requêtes qui doivent TOUTES passer pour que le run
  #     aboutisse, sur une source qui a déjà fait tomber trois runs (#516).
  #     Le run 32738726729 (24/08/2026) a perdu 4 shards sur 8 exactement là,
  #     pendant que les 4 autres obtenaient la même liste sans incident ;
  #   - CORRECTION : rien ne garantissait que les 9 listes soient la MÊME.
  #     Les shards se partagent le roster par `--shard i/N`, position par
  #     position, et `merge-and-pivot` normalise en pivot ce que sa PROPRE
  #     liste contient. Deux listes qui divergent, et un membre collecté par un
  #     shard n'est plus normalisé par la fusion : c'est la définition du
  #     « collecté mais non publié » de #511, produit sans qu'aucune étape
  #     n'ait échoué.
  #
  # Le roster est donc construit UNE fois, ici, et transité par artifact.
  # Chaque consommateur garde un repli qui le régénère si l'artifact manque
  # (`prepare-roster-matrix` en échec ou skippé) : la panne d'un job de
  # préparation ne doit pas valoir panne du run, cohérent avec le
  # `|| '[0]'` du matrix ci-dessous.
  # ──────────────────────────────────────────────────────────────────────────
  prepare-roster-matrix:
    runs-on: ubuntu-latest
    # 5 -> 15 min : ce job fait désormais un appel réseau avec reprises (#518).
    # 15 -> 20 min (#708) : ce job dérive la composition des groupes depuis
    # l'archive AMO30, donc son coût suit le nombre de membres — et #708 fait
    # entrer les 156 membres de la XVIIe que la circularité du slug écartait,
    # soit +34 % sur ~461. Mesuré sur le run 33514676506 : 7,8 min, la marge la
    # plus faible du workflow (x1,9 quand `merge-and-pivot` est à x2,4 et les
    # shards du roster à x6,3). Projetée à ~10,5 min, la marge tomberait à x1,4.
    #
    # Reste un filet, pas un budget : le fetch tient en quelques secondes, et
    # la règle de #498 — ne jamais relever un `timeout-minutes` sans son
    # `--budget-interventions-secondes` — ne s'applique pas ici : elle vise
    # `extract-an` et sa collecte d'interventions, que ce job ne fait pas.
    #
    # Ce qu'il ne faut PAS faire si ce plafond est de nouveau atteint : le
    # relever une troisième fois sans mesurer. Un job tué par `timeout-minutes`
    # n'écrit RIEN (AGENTS.md §3b), donc le plafond doit couvrir un pic, pas
    # une dérive — et une dérive se mesure, elle ne se compense pas.
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      shard_total: ${{ steps.shards.outputs.shard_total }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Le roster du run, construit une fois pour toutes. Un échec ici fait
      # échouer ce job — donc `extract-roster-groupes` retombe sur son matrix
      # `[0]` et sur son repli de régénération, et le run continue en mode
      # dégradé au lieu de s'arrêter. Ne PAS ajouter de `continue-on-error`
      # sans ce repli : un artifact absent doit rester distinguable d'un
      # artifact vide (AGENTS.md §2 règle 5).
      # Le `#518` reste dans ce commentaire et pas dans le `name:` : un `#` non
      # quoté dans un scalaire YAML ouvre un commentaire, et le nom du step
      # serait tronqué juste avant lui.
      # `--rosters-bruts-out` publie AUSSI la liste avant filtrage par sigle.
      # C'est ce qui supprime le dernier fetch du même roster dans un run,
      # celui de `generate_group_profiles.py` — et avec lui la dernière
      # divergence possible : jusqu'ici la fiche de groupe publiée décrivait
      # une composition lue ~7 min après celle sur laquelle les profils
      # avaient été collectés. Le run 32750929942 est mort sur ce fetch-là.
      #
      # SEUL LE CODE 2 EST TOLÉRÉ ICI (#524), et c'est la raison d'être du
      # code 2 — même arbitrage, même mécanique que le step « Générer les
      # profils de groupe parlementaire réel » de `merge-and-pivot`.
      # `EXIT_ROSTER_INDISPONIBLE` veut dire « toutes les entrées de
      # `groupes_reels.json` ont leur extraction suspendue » : il n'y avait
      # RIEN à collecter, par décision écrite (#516), et rien n'a été écrit.
      # Tant que ce cas sortait en 1, suspendre les entrées AN — le remède
      # documenté d'une source en panne — reproduisait l'échec qu'il devait
      # éteindre, et aucun run ne pouvait conclure vert pendant que
      # NosDéputés répondait 500.
      #
      # Le filtrage se fait sur le CODE, dans le shell, et non par un
      # `continue-on-error: true` : celui-ci avalerait aussi le code 1 — un
      # fetch tombé, donc un roster INCOMPLET — et le run repartirait sur une
      # composition de groupe non mesurée (#511).
      - name: Roster du run — une seule construction pour tout le run
        id: roster
        run: |
          CODE=0
          python3 src/generate_roster_candidats.py \
            --rosters-bruts-out raw_data/rosters_bruts.json || CODE=$?
          if [[ "$CODE" == "2" ]]; then
            echo "ecrit=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Roster du run non construit (code 2, extraction de tous les groupes suspendue) : la branche roster de ce run est sautée, aucun artifact roster-candidats n'est publié (#524)."
            exit 0
          fi
          [[ "$CODE" == "0" ]] || exit "$CODE"
          echo "ecrit=true" >> "$GITHUB_OUTPUT"

      # Les DEUX fichiers dans le même artifact, et sous le même
      # `if-no-files-found: error` : ils décrivent la même collecte, à la même
      # seconde. En publier un sans l'autre rendrait au consommateur une
      # composition de groupe qui n'est pas celle du corpus collecté.
      # (Avec plusieurs chemins, l'action prend leur ancêtre commun `raw_data/`
      # pour racine — les fichiers reviennent donc bien à leur place chez le
      # consommateur qui télécharge dans `path: raw_data`.)
      #
      # `if:` sur le step, et `if-no-files-found: error` CONSERVÉ (#524) : sur
      # une suspension totale il n'y a aucun fichier à publier, et les deux
      # façons de le dire ne sont pas équivalentes. Sans le `if:`, il faudrait
      # relâcher `error` en `ignore` — ce qui publierait un artifact VIDE que
      # les consommateurs téléchargeraient avec succès, transformant « roster
      # absent » en « roster de 0 candidat », c'est-à-dire l'incident de #511.
      # Un artifact ABSENT, lui, fait tomber les consommateurs sur leur repli.
      - name: Roster du run — artifact
        if: ${{ steps.roster.outputs.ecrit == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: roster-candidats
          path: |
            raw_data/roster_candidats.json
            raw_data/rosters_bruts.json
          if-no-files-found: error

      - name: Liste des shards roster
        id: shards
        env:
          ROSTER_LIMIT: ${{ inputs.roster_limit }}
          # Nombre de tranches pour un run complet. 8 -> ~94 membres/shard,
          # soit ~2,9 min chacun (projeté après #467 : ~130 s de frais fixes
          # par shard + ~1 min d'extraction), exécutés 4 à la fois.
          # Modifier ici suffit : le total est propagé au flag --shard, jamais
          # codé en dur ailleurs. Augmenter ce nombre affine la borne de perte
          # sur préemption mais multiplie les frais fixes de checkout : c'est
          # le vrai arbitrage derrière cette constante, pas le temps de calcul.
          ROSTER_SHARDS: "8"
          TEST_SLUGS: ${{ inputs.test_slugs }}
          # Un shard, huit membres : de quoi exercer la chaîne roster de bout en
          # bout (collecte → artifact → transport → fusion → agrégats) sans
          # payer une couverture dont un test n'a que faire.
          TEST_ROSTER_LIMIT: "8"
        run: |
          set -euo pipefail
          # RUN DE TEST : un plafond par défaut, et il est ANNONCÉ (#786/#788).
          # Sans lui, un run « de test » collecterait quand même les 625 membres
          # du roster — 10 min de mur pour vérifier une orchestration qui n'en a
          # pas besoin. Un `roster_limit` explicite l'emporte : le plafond
          # automatique ne s'applique qu'à la valeur par défaut.
          if [[ -n "${TEST_SLUGS:-}" && ( -z "${ROSTER_LIMIT}" || "${ROSTER_LIMIT}" == "0" ) ]]; then
            ROSTER_LIMIT="${TEST_ROSTER_LIMIT}"
            echo "::notice::RUN_DE_TEST — roster plafonné à ${ROSTER_LIMIT} membre(s) sur 1 shard (aucun plafond n'avait été demandé). Passez roster_limit pour en collecter plus."
          fi
          if [[ -z "${ROSTER_LIMIT}" || "${ROSTER_LIMIT}" == "0" ]]; then
            TOTAL="${ROSTER_SHARDS}"
            echo "Aucun plafond (roster_limit=${ROSTER_LIMIT:-0}) : ${TOTAL} shards."
          else
            # TOTAL=1 en rollout progressif : raison SÉMANTIQUE, pas de coût
            # (documentée par #467, elle ne l'était nulle part). Dans
            # generate_all_profiles.main(), --shard s'applique AVANT --limit :
            # la limite vaut donc PAR SHARD. `limite=100` sur 8 shards ne
            # traiterait pas 100 candidats mais jusqu'à 800 — on demanderait un
            # lot et on en obtiendrait huit. Forcer 1 shard est ce qui rend
            # `roster_limit` exact.
            #
            # Alternative écartée (#471) — découper quand même en 8 tranches
            # de limite/8, en passant --limit ceil(L/N) à chaque shard.
            #
            # Deux motifs ont été avancés contre elle, et SIMULÉS sur le roster
            # réel (752 membres, budget 100/run, rollout complet depuis un
            # dépôt vierge) : aucun des deux ne tient.
            #
            #   - « le lot ne ferait plus exactement N » : non. 1 shard x 100
            #     donne 8 runs [100 x7, 52] ; 8 shards x 13 donne 8 runs
            #     [104 x7, 24]. Même nombre de runs, même couverture finale
            #     752/752. L'écart est un DÉPASSEMENT de 4, jamais un déficit.
            #   - « le modulo corrigerait le biais de groupe du fichier
            #     roster » (#471) : non plus, et c'est arithmétique. Le shard i
            #     porte les positions i, i+8, i+16… donc ses 13 premiers sont
            #     les positions i à i+96 ; la réunion des 8 shards est
            #     exactement les positions 0 à 103 du fichier. Chaque shard
            #     préserve l'ordre du fichier en son sein, donc le découpage ne
            #     déplace personne. Vérifié : sélections identiques sur dépôt
            #     vierge (écart symétrique 0), 4 personnes d'écart sur la
            #     couverture au 20/08/2026.
            #
            # Ce qui tranche est le coût, pas l'exactitude : un shard coûte
            # ~2,2 min de frais fixes (checkout compris, mesuré sur le run
            # 32288588518) pour une extraction tombée à ~0,5 s par membre
            # (#467). Découper un lot de 100 ferait payer huit fois ces frais
            # fixes pour économiser ~1 min de temps mur — et max-parallel: 4
            # capture déjà le parallélisme là où il compte. Reste le seul gain
            # réel, la résilience à la préemption : perdre 1/8 au lieu de tout,
            # sur un job tombé à ~3 min. Trop peu pour le prix.
            TOTAL=1
            echo "Rollout progressif (limite ${ROSTER_LIMIT}) : 1 seul shard (la limite s'applique par shard, cf. commentaire ci-dessus)."
          fi
          SHARDS=$(TOTAL="$TOTAL" python3 -c "import json,os; print(json.dumps(list(range(int(os.environ['TOTAL'])))))")
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "shard_total=${TOTAL}" >> "$GITHUB_OUTPUT"

  extract-roster-groupes:
    needs: [extract-amendements-an, extract-an, extract-ue-officiel, extract-parltrack, prepare-roster-matrix]
    # if: !cancelled() (#412 §2.1) — continue-on-error: transforme un ÉCHEC en
    # non-bloquant, mais ne fait rien contre un job *skipped* : un maillon amont
    # skippé (matrix vide, prepare-* en échec) skippait toute la suite, donc le
    # run entier ne produisait rien. Ce garde-fou rétablit le comportement
    # documenté (« on traite/fusionne ce qui a réussi ») ; seule une annulation
    # externe arrête encore la chaîne.
    if: ${{ !cancelled() }}
    name: extract-roster-groupes (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 60 min PAR SHARD — filet de sécurité, plus une valeur dimensionnante
    # depuis #467. Mesuré en CI (run 32288588518) : ~200 s par shard, dont
    # ~130 s de frais fixes et ~65 s d'extraction pour 24 membres ; l'extraction
    # tombe à ~1 min pour 94 membres après #467 (projeté). La marge est de deux
    # ordres de grandeur. Ne pas budgéter un run à partir de cette valeur : voir
    # la section BUDGET DE TEMPS MUR en tête de fichier.
    timeout-minutes: 60
    strategy:
      # fail-fast: false — un shard préempté ne doit jamais annuler les
      # autres, sinon le découpage n'apporte aucune isolation (même
      # raisonnement que #344 pour extract-an).
      fail-fast: false
      # max-parallel — OUVERT à 4 par #467, en appliquant la condition de
      # réouverture que #412 §2.5 s'était elle-même fixée (« à rouvrir si §3 se
      # confirme et que le run complet devient la norme ») : §3 confirmée par
      # #424, run complet devenu la norme au passage à pleine échelle.
      #
      # Les DEUX arguments qui restaient à #412 sont tombés à la mesure, et
      # seulement pour CE matrix (extract-an garde max-parallel: 1, voir son
      # propre commentaire) :
      #   - CACHE : les shards ne se passent RIEN. Depuis #505 c'est une
      #     propriété du workflow et non plus un effet de bord observé : les
      #     deux steps de cache de ce job sont en `actions/cache/restore`, donc
      #     aucun shard ne peut sauvegarder. Ce que le `needs:` garantit reste
      #     vrai — la clé public-data-cache-an-* est déjà écrite par extract-an
      #     quand la matrice démarre. Mesuré avant la bascule, run 32288588518 :
      #     « Cache hit occurred on the primary key public-data-cache-an-2026-W34,
      #     not saving cache » sur les shards roster, entrée de 21 Mo restaurée
      #     en 1,1 s. Sérialiser ne réchauffe rien qui ne soit déjà chaud.
      #   - PRUDENCE RÉSEAU : le profil réseau d'un shard, mesuré, est de
      #     2 requêtes NosDéputés (construction du roster) + 1 requête
      #     data.europarl.europa.eu (liste des eurodéputés) + **0 requête par
      #     candidat** — identité/mandats/votes/amendements viennent tous
      #     d'index locaux depuis #369/#392/#403. Quatre shards simultanés,
      #     c'est 8 requêtes NosDéputés au lieu de 2, une fois par run.
      #
      # Pourquoi 4 et non 8 : en cold_start=true les steps de cache sont sautés
      # et chaque shard retélécharge ~40 Mo d'archives AN (acteurs historiques
      # 13,6 Mo + scrutins XVII 26,3 Mo, relevé le 20/08/2026). 4 borne cette
      # rafale à la moitié pour ~3 min de temps mur en plus à pleine échelle.
      # Voir docs/decisions/budget-execution-pleine-echelle-467.md.
      max-parallel: 4
      matrix:
        # `|| '[0]'` : repli sur un shard unique si prepare-roster-matrix a
        # échoué (#412 §2.1). Combiné au if: !cancelled() ci-dessus, ce job
        # tourne alors en mode non shardé plutôt que d'échouer sur
        # `fromJson('')` — le pendant de shard_total plus bas.
        shard: ${{ fromJson(needs.prepare-roster-matrix.outputs.shards || '[0]') }}
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Horodatage de démarrage + relevé mémoire runner (OOM) + setup-python +
      # pip install, factorisés par #412 §3. Le relevé mémoire compte
      # particulièrement ici : ce job est shardé par tranche de roster, pas par
      # candidat, donc plusieurs membres sont traités dans le même process —
      # exposition plus forte au risque OOM que extract-an
      # (docs/decisions/oom-lecture-amendements-par-candidat.md).
      - uses: ./.github/actions/bootstrap-extraction

      - name: Semaine ISO courante (clé de cache AN, partagée avec extract-an)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # #657 — MÊME EMPREINTE QUE extract-an, et pour la même raison qu'à #505.
      # Ce job restaure sous la clé de la semaine ; extract-an, en mode
      # interventions, ne SAUVEGARDE que sous la clé suffixée
      # `-interv-<empreinte>`. Sans ce suffixe ici, la clé NUE de la semaine —
      # écrite par n'importe quel run en mode par défaut, éventuellement plus
      # récent — fait un *exact key hit*, et `restore-keys` n'est pas consulté
      # après un hit exact : les 8 shards repartiraient d'une entrée SANS
      # contenu Syceron et reconstruiraient les trois index chacun. C'est
      # #424/#505 sous une troisième forme, et depuis #657 elle a un coût réel :
      # ce job LIT l'index Syceron.
      #
      # Restauration seule : l'empreinte ATTENDUE suffit. Il n'y a pas
      # d'empreinte obtenue à écrire, ce job ne sauvegardant aucune entrée.
      - name: Empreinte de complétude attendue (clé de cache AN, #550/#657)
        id: empreinte_attendue
        if: ${{ !inputs.cold_start }}
        run: |
          EMPREINTE=$(python3 src/cache_an_empreinte.py --attendue)
          echo "empreinte=$EMPREINTE" >> "$GITHUB_OUTPUT"
          echo "Complétude visée pour le cache d'interventions AN : $EMPREINTE"

      # Clé de cache partagée avec extract-an (public-data-cache-an-*), pas
      # une clé "roster" séparée : ce job consomme le même jeu de données
      # source (AN Open Data — SCRUTINS/AMENDEMENTS/DOSSIERS/ACTEURS/
      # ACTEURS_HISTORIQUE/QUESTIONS_CACHE_DIR, cf. src/candidate_profile.py)
      # que extract-an dès qu'un membre de roster appartient à la chambre
      # "deputes", indépendamment de la liste de candidats/membres traitée.
      # Le séquencement (needs: ci-dessus, #222) garantit que ce cache est
      # déjà chaud au moment de cette restauration.
      #
      # Même `path` explicite que extract-an, amendements_an exclu (#424) : voir
      # le commentaire détaillé sur le cache de extract-an. Le `path` doit
      # rester IDENTIQUE à celui d'extract-an, et pas seulement équivalent :
      # `actions/cache` dérive la *version* de l'entrée du hash des chemins, si
      # bien que deux listes différentes sous la même clé donnent deux entrées
      # distinctes qui ne se voient pas (trois coexistent sous
      # `public-data-cache-an-2026-W34` — 915 Mo, 53 Mo, 21 Mo — vestiges des
      # `path` successifs). Vérifié par tests/test_ci_cache_paths.py.
      #
      # RESTAURATION SEULE (#505), et #657 ne la change pas — il la RENFORCE.
      # Ce job ne remplit toujours ni `questions_an` (le mode réduit n'appelle
      # pas les questions officielles) ni `.cache/syceron_an/*/index_par_acteur`
      # (s'il doit construire un index, il le publie sous
      # `index_par_acteur_theme`, que le `path:` ci-dessous ne capture pas :
      # deux formes, deux répertoires). Deux des quatre chemins déclarés
      # restent donc produits par extract-an seul. Un `actions/cache` complet le
      # rendrait candidat à écrire la clé de la semaine pour un contenu qu'il ne
      # produit pas — exactement le défaut de #424. Il ne l'a jamais fait en
      # pratique, parce que
      # `needs: extract-an` le place derrière le vrai producteur (mesuré sur le
      # run 32149708461 : « not saving cache » sur les deux clés à 15:05:30,
      # alors qu'extract-an les avait écrites à 14:46:12-15) — mais c'était un
      # accident d'ordonnancement, pas une garantie. `cache/restore` en fait
      # une propriété du workflow.
      # Rien n'est perdu : les deux répertoires qu'il produit réellement
      # (acteurs_historique_an, scrutins_an) sont déjà persistés par extract-an.
      #
      # LE PRÉFIXE NU RESTE ICI AUSSI (#555) : même raison que côté extract-an,
      # et une de plus. Ce job est en restauration seule — il ne sauvegarde
      # rien. Y périmer le cache ferait retélécharger les ~40 Mo d'archives AN
      # par chacun de ses 8 shards sans que rien ne soit persisté en retour :
      # ce serait #424 recréé, pas corrigé. D'où l'asymétrie du step suivant —
      # le PRODUCTEUR périme, le CONSOMMATEUR déclare. C'est la distinction de
      # #424/#505 (qui produit / qui écrit la clé) appliquée à la fraîcheur.
      - uses: actions/cache/restore@v5
        id: cache_an
        if: ${{ !inputs.cold_start }}
        with:
          path: |
            .cache/acteurs_historique_an
            .cache/scrutins_an
            .cache/questions_an/*/index_par_acteur.json
            .cache/syceron_an/*/index_par_acteur
          key: public-data-cache-an-${{ steps.week.outputs.week }}${{ inputs.collect_interventions && format('-interv-{0}', steps.empreinte_attendue.outputs.empreinte) || '' }}
          restore-keys: |
            ${{ inputs.collect_interventions && format('public-data-cache-an-{0}-interv', steps.week.outputs.week) || '' }}
            public-data-cache-an-

      # #555 — DÉCLARATION SEULE, job CONSOMMATEUR (pas de `--perimer`).
      #
      # `needs: extract-an` place ce job derrière le producteur, qui a déjà
      # rafraîchi et sauvegardé l'entrée de la semaine : la restauration ici
      # devrait donc porter la semaine courante. « Devrait » — c'est un
      # ordonnancement, pas une garantie (un `prepare-an-matrix` rendant une
      # liste vide skippe extract-an, cf. le commentaire de #505 ci-dessus), et
      # ce qui n'est pas garanti doit au moins être VISIBLE. Un `::warning::`
      # nomme alors la semaine effectivement servie, ce que rien ne disait
      # avant #555.
      - name: Fraîcheur du cache AN restauré — déclaration (#555)
        if: ${{ !inputs.cold_start }}
        continue-on-error: true
        run: |
          python3 src/cache_an_fraicheur.py \
            --semaine "${{ steps.week.outputs.week }}" \
            --cle-restauree "${{ steps.cache_an.outputs.cache-matched-key }}"

      # Clé DÉDIÉE aux dossiers législatifs (#427), séparée de la clé AN.
      # merge-and-pivot en a besoin pour générer les profils de gouvernement,
      # mais restaurer `public-data-cache-an-*` depuis là-bas embarquerait
      # aussi `scrutins_an` — plusieurs centaines de Mo pour en utiliser 46.
      #
      # RESTAURATION SEULE (#505). La raison n'est plus celle qui était écrite
      # ici : ce job a porté `--skip-dossiers-legislatifs` en dur jusqu'à #817,
      # qui l'a mis sous `inputs.collect_dossiers_legislatifs`. Case cochée, il
      # REMPLIT bien `.cache/dossiers_an`.
      #
      # Il reste en restauration seule pour une raison plus forte : ce qu'il y
      # met dépend d'un input, et une clé dont le CONTENU dépend d'un input doit
      # porter cet input (la règle du suffixe `-interv-<empreinte>`, #657).
      # Sans ce suffixe, un run avec la case cochée écrirait la clé nue de la
      # semaine, et tous les runs suivants — case décochée — la restaureraient
      # en croyant y trouver ce qu'extract-an y met. Ne pas écrire du tout est
      # ici plus sûr qu'écrire sous une clé qui ment.
      # Le coût : quand la case est cochée, les 8 shards retéléchargent les
      # dossiers. Mesuré nulle part à ce jour — si ça devient le poste
      # dominant du run, la réponse est un suffixe, pas un `save`.
      # Le commentaire qui vivait ici affirmait le contraire : voir sa
      # correction dans extract-an et
      # docs/decisions/cache-mode-interventions-505.md.
      - uses: actions/cache/restore@v5
        id: cache_dossiers_roster
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/dossiers_an
          key: public-data-cache-dossiers-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-dossiers-

      # #762 — REPRENDRE L'ARCHIVE VIVANTE QUAND LA SEMAINE A CHANGÉ.
      #
      # La clé de ce cache est hebdomadaire, mais le `restore-keys` de préfixe
      # la désamorce : au changement de semaine, la clé exacte manque, le
      # préfixe restaure le répertoire de la semaine d'avant, et
      # `ensure_dossiers_zip_downloaded` court-circuite sur `is_file()` — rien
      # n'est retéléchargé, et le répertoire inchangé repart sous la clé neuve.
      # C'est #749, appliqué aux dossiers.
      #
      # `cache-hit == 'true'` UNIQUEMENT sur correspondance exacte de la clé
      # primaire ; 'false' quand la restauration vient d'un `restore-keys` —
      # exactement le signal « on a changé de semaine ».
      #
      # Seules les législatures EN COURS sont reprises (9,8 Mo). Les dissoutes
      # ne produisent plus d'acte : les reprendre coûterait 23 Mo par semaine
      # pour un contenu identique.
      #
      # `!inputs.cold_start` COMME LE BLOC DE CACHE CI-DESSUS, et pour une
      # raison concrète : sur un démarrage à froid, le `rm -rf .cache` qui suit
      # effacerait ce que cette étape vient de télécharger. Rien à rafraîchir
      # là où tout est purgé puis repris.
      - name: Reprendre les archives de dossiers vivantes (semaine nouvelle)
        if: ${{ !inputs.cold_start && steps.cache_dossiers_roster.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: python3 src/rafraichir_dossiers_actifs.py

      # `cold_start` purge les CACHES DE TÉLÉCHARGEMENT, et rien d'autre
      # (#578). Il supprimait aussi `raw_data/profiles/*.json`, ce qui est une
      # politique d'écriture déguisée en politique de fraîcheur : un profil
      # effacé n'a plus rien à fusionner, donc le mode écrivait par-dessus
      # l'existant sans que personne ne l'ait demandé. Ce qu'on fait des
      # profils déjà écrits se demande sur l'autre axe, `existing_profiles`.
      # (Sans effet sur le corpus committé de toute façon : depuis #450 chaque
      # job ne publie que ce qu'il a écrit, et `merge-and-pivot` refait son
      # propre checkout.)
      - name: Purge des caches de téléchargement (cold_start uniquement)
        if: ${{ inputs.cold_start }}
        run: rm -rf .cache

      # Cache-only : cet artifact provient du job extract-amendements-an (#251),
      # qui est bien en `needs:` de ce job (le commentaire disait l'inverse
      # jusqu'à #412 §2.2). continue-on-error: true quand même : ce job a
      # continue-on-error: true, donc il peut « réussir » sans avoir produit
      # d'artifact — en cas d'absence, on s'appuie sur ce que la restauration du
      # cache partagé public-data-cache-an-* contient déjà (#252). Placé après
      # la purge cold_start (pas avant) : la lecture cache-only s'applique
      # aussi en cold_start, donc ne doit pas être effacée par le
      # `rm -rf .cache` ci-dessus.
      - name: Download artifact amendements AN (optionnel)
        id: amendements_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # Repli #424 : avant la scission des clés, l'absence d'artifact était
      # rattrapée par le cache partagé, qui contenait alors les amendements.
      # Ce n'est plus le cas — d'où cette restauration explicite, en lecture
      # seule (`cache/restore`, jamais de sauvegarde : ce job ne produit pas
      # d'amendements) et UNIQUEMENT si l'artifact a manqué. La conditionner
      # évite de restaurer ~676 Mo dans chaque shard pour un cas rare, ce qui
      # recréerait le coût que cette issue supprime.
      #
      # Non repris dans merge-and-pivot : ce job n'a ni step `week` ni cache, et
      # l'absence d'amendements y est déjà une dégradation gracieuse documentée
      # (section 3d du quality gate signale « jamais construite »).
      - name: Repli — cache amendements si l'artifact manque
        if: ${{ steps.amendements_artifact.outcome == 'failure' }}
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/amendements_an
          key: public-data-cache-amendements-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-amendements-

      # raw_data/roster_candidats.json n'est pas committé : produit à chaque run
      # (source de vérité = groupes_reels.json). Ce n'était vrai que sur le
      # papier jusqu'à #413 §5 — le fichier était tracké et dérivait
      # silencieusement ; il est désormais gitignoré et désindexé, comme
      # parltrack-status.json.
      #
      # DEPUIS #518, ce shard ne le construit plus lui-même en régime nominal :
      # il télécharge celui que `prepare-roster-matrix` a construit pour TOUT
      # le run. Voir l'en-tête de ce job pour les deux raisons (fragilité de
      # 9 fetchs, et divergence possible entre les listes des shards et celle
      # de `merge-and-pivot`).
      - name: Roster du run — artifact (optionnel)
        id: roster_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: roster-candidats
          path: raw_data

      # Repli, et pas une seconde source de vérité : il ne s'exécute QUE si
      # l'artifact a manqué (prepare-roster-matrix en échec, préempté, ou son
      # fetch tombé). Le supprimer rendrait ce job dépendant d'un job de
      # préparation dont l'échec est précisément ce que #412 §2.1 a cessé de
      # laisser propager.
      #
      # SEUL LE CODE 2 EST TOLÉRÉ (#524) : « toutes les entrées suspendues »,
      # donc rien à collecter et rien d'écrit. Le step d'extraction ci-dessous
      # est conditionné à l'existence du fichier, ce shard ne collecte donc
      # rien et son artifact est vide — ce que `publish-written-profiles` sait
      # déjà produire sans le confondre avec la baseline (#450). Un code 1
      # (roster incomplet, fetch tombé) continue de faire rougir ce shard :
      # là, une composition NON MESURÉE existe, et la taire ferait collecter
      # une tranche qui n'est celle de personne.
      - name: Repli — construction de la liste roster-driven
        if: ${{ steps.roster_artifact.outcome == 'failure' }}
        run: |
          echo "::warning::Artifact roster-candidats absent : ce shard reconstruit le roster pour lui-même. Sa tranche peut différer de celle des autres shards si la source a changé entre-temps (#518)."
          CODE=0
          python3 src/generate_roster_candidats.py || CODE=$?
          if [[ "$CODE" == "2" ]]; then
            echo "::warning::Roster non construit (code 2, extraction de tous les groupes suspendue) : ce shard n'extrait rien (#524)."
            exit 0
          fi
          [[ "$CODE" == "0" ]] || exit "$CODE"

      # Même fan-out par membre que extract-an (coût par candidat identique,
      # seul le volume change) — `roster_limit` plafonne ce volume.
      #
      # Mode d'extraction léger (#357, sous-issue 6/6 de #351).
      #
      # #817 — LES DOSSIERS NON PLUS NE SONT PLUS ÉCARTÉS EN DUR, et le motif
      # qui les écartait était le même que pour les interventions : « les textes
      # portés ne sont consommés par aucun agrégat de groupe (#349) ». Il était
      # faux au même titre — la §3 « Ce qu'ils proposent » de la fiche de groupe
      # les lit, et 17 profils sur 1 035 en publiaient, tous `candidat_declare`,
      # zéro sur les membres de roster. Mesuré le 10/09/2026 : **887 des 1 021
      # membres roster** portent des dossiers dans l'index bulk, pour **9 895
      # dossiers** — une fiche de groupe montrait « 1 membre sur 86 » là où elle
      # peut en montrer la quasi-totalité.
      #
      # Le coût est le même qu'au-dessus, et pour la même raison : l'index
      # `acteur → dossiers` se construit UNE FOIS par processus depuis l'archive
      # bulk, puis c'est un `dict.get()` par membre. Mesuré : **3,0 s** de
      # construction, **57 Mio** de RSS, sur une archive que ce job restaure
      # déjà (`.cache/dossiers_an`, restauration seule #505). Ce n'est pas une
      # collecte par membre.
      #
      # Il suit `inputs.collect_dossiers_legislatifs`, sous une case du
      # formulaire plutôt que retiré en dur : la charge se choisit run par run,
      # exactement comme `collect_interventions` depuis #657.
      #
      # #657 — LES INTERVENTIONS, ELLES, NE SONT PLUS ÉCARTÉES EN DUR. Elles
      # l'étaient au motif qu'aucun agrégat ne les consomme ; c'était faux :
      # `tags_thematiques` en dérive intégralement
      # (`normalize_profil`), et `tags_thematiques_agreges` de chaque fiche de
      # groupe en dérive à son tour. Les 468 membres publiant `interventions: []`,
      # l'« empreinte thématique » de chaque fiche était celle d'UNE SEULE
      # personne (470 étiquettes sur AN:RN portées par Marine Le Pen, 382 sur
      # AN:SOC par Jérôme Guedj, zéro sur AN:LFI et AN:LR).
      #
      # Le mode est RÉDUIT AU THÈME (`--interventions-theme-seul`), pas complet :
      # le verbatim n'est pas collecté, et les questions officielles — qui ne
      # portent aucun thème — pas davantage. Ce n'est pas une économie de temps
      # de collecte : l'index Syceron se construit UNE FOIS par législature, pas
      # une fois par membre (mesuré : 18,03 s pour lire la tranche des 468
      # membres sur les législatures 16+17, index chaud). C'est une économie de
      # VOLUME PUBLIÉ et d'index.
      #
      # Il suit `inputs.collect_interventions`, comme extract-an : c'est
      # extract-an qui construit l'index complet, et ce job est derrière lui par
      # `needs:`. Collecter ici quand il ne collecte pas ferait reconstruire les
      # trois index par chacun des 8 shards.
      #
      # MERGE_FLAG/LIMIT_FLAG non factorisables : cf. le commentaire équivalent
      # sur le step d'extraction d'extract-an (#412 §3, grep de logs de
      # retry-generate-data.yml).
      #
      # `if: hashFiles(...)` (#524) — la liste roster est le SEUL intrant de ce
      # step, et elle n'est pas committée : sans elle, `--candidats` pointe sur
      # un fichier absent et le step échouerait de toute façon, en disant
      # « fichier introuvable » plutôt que « la branche roster est fermée pour
      # ce run ». La sauter est la seule lecture juste de ce qui s'est passé —
      # et un shard qui n'extrait rien publie un artifact vide, jamais la
      # baseline (#450).
      - name: Extraction roster-driven (mode léger)
        if: ${{ hashFiles('raw_data/roster_candidats.json') != '' }}
        env:
          # Écrits en clair dans le log par la substitution GHA : c'est la
          # seule source EXACTE dont dispose retry-generate-data.yml pour
          # reconstruire les inputs d'un run préempté (même mécanisme que
          # ROSTER_LIMIT).
          EXISTING_PROFILES: ${{ inputs.existing_profiles }}
          ADD_UNCOVERED: ${{ inputs.add_uncovered_members }}
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
          ROSTER_LIMIT: ${{ inputs.roster_limit }}
          # #657 — en `env:` et non dans le script, comme les cinq au-dessus :
          # tests/test_ci_inputs_workflow.py EXÉCUTE ce bloc de décision pour
          # vérifier les six combinaisons, et une expression `${{ }}` le lui
          # rendrait illisible. Le log en garde la trace, ce dont
          # retry-generate-data.yml a besoin.
          COLLECT_INTERVENTIONS: ${{ inputs.collect_interventions }}
          # #817 : même raison, même endroit.
          COLLECT_DOSSIERS: ${{ inputs.collect_dossiers_legislatifs }}
        run: |
          # ── DEUX AXES DISJOINTS (#578) ──────────────────────────────────
          # Axe 1 (`existing_profiles`) : ce qu'on fait des profils DÉJÀ
          # écrits. Axe 2 (`add_uncovered_members`) : si on en écrit de NOUVEAUX.
          # Les six combinaisons sont atteignables, dont « recollecter
          # l'existant EN FUSIONNANT et ajouter les nouveaux », qu'aucun
          # réglage ne permettait de demander avant #578.
          #
          #                        | add_uncovered=false  | add_uncovered=true
          #   ---------------------+----------------------+----------------------
          #   leave-as-is          | rien à faire         | --skip-existing
          #   refresh              | --refresh-existing   | (aucun drapeau)
          #   overwrite            | --refresh-existing   | (aucun drapeau)
          #                        |   --no-merge         |   --no-merge
          #
          # `cold_start` n'apparaît pas : il purge le cache de téléchargement,
          # ce qui ne dit rien de ce qu'on écrit. Écraser SANS purger le cache
          # est le cas courant (#440) — purger obligerait à re-télécharger
          # ~300 Mo d'archives AN, sur une source dont l'indisponibilité a
          # déjà bloqué trois chantiers.
          MERGE_FLAG=()
          [[ "$OVERWRITE" == "true" ]] && MERGE_FLAG=(--no-merge)

          # `--skip-existing` est STRICT depuis #578 : plus aucune exemption
          # implicite. Recollecter l'existant se demande en ne le posant pas,
          # jamais en espérant qu'un plafond de volume le fasse.
          POP_FLAG=()
          if [[ "$EXISTING_PROFILES" == "leave-as-is" ]]; then
            if [[ "$ADD_UNCOVERED" != "true" ]]; then
              # Combinaison licite et vide : on ne touche pas à l'existant et
              # on n'étend pas la couverture. Le manifeste vide dit « ce job
              # n'a écrit aucun profil » — et non « le job a échoué » (#450).
              echo "Aucun membre à traiter : existing_profiles=leave-as-is et add_uncovered_members=false. Les profils écrits restent tels quels, la couverture n'est pas étendue."
              mkdir -p _manifest && : > _manifest/profils-ecrits.txt
              exit 0
            fi
            POP_FLAG=(--skip-existing)
          elif [[ "$ADD_UNCOVERED" != "true" ]]; then
            # --refresh-existing (#445) : ne traiter que l'existant. Il exclut
            # --skip-existing par construction (le script refuse la
            # combinaison, qui ne traiterait personne).
            POP_FLAG=(--refresh-existing)
          fi
          echo "Population : existing_profiles=${EXISTING_PROFILES} × add_uncovered_members=${ADD_UNCOVERED} → ${POP_FLAG[*]:-aucun drapeau (tout le roster)} ${MERGE_FLAG[*]:-(fusion additive)}"

          # `--limit` est un PLAFOND, et rien d'autre (#578). Il ne commande
          # plus aucune politique de rafraîchissement : c'est ce couplage qui
          # faisait que `roster_limit=0` rafraîchissait MOINS que `20`.
          LIMIT_FLAG=()
          [[ -n "$ROSTER_LIMIT" && "$ROSTER_LIMIT" != "0" ]] && LIMIT_FLAG=(--limit "$ROSTER_LIMIT")

          # #657 : les deux valeurs sont EXCLUSIVES, et le script refuse net de
          # recevoir les deux (voir `valider_budgets`). Le mode réduit n'est
          # armé que quand extract-an a construit l'index — sinon chacun des 8
          # shards le reconstruirait pour un travail identique.
          INTERV_FLAG=(--skip-interventions)
          [[ "$COLLECT_INTERVENTIONS" == "true" ]] && INTERV_FLAG=(--interventions-theme-seul)
          echo "Interventions : ${INTERV_FLAG[*]} (collect_interventions=${COLLECT_INTERVENTIONS})"
          # #817 : les dossiers ne sont plus écartés EN DUR. Voir le commentaire
          # au-dessus du step pour le motif qui est tombé.
          DOSSIERS_FLAG=(--skip-dossiers-legislatifs)
          [[ "$COLLECT_DOSSIERS" == "true" ]] && DOSSIERS_FLAG=()
          echo "Dossiers législatifs : ${DOSSIERS_FLAG[*]:-collectés} (collect_dossiers_legislatifs=${COLLECT_DOSSIERS})"
          # --shard : partition déterministe par position modulo (#394). Avec
          # un seul shard (rollout progressif), 0/1 équivaut à l'absence de
          # découpage.
          # --workers 1 en dur, plus un input (#467 mesuré, figé ensuite) :
          # augmenter cette valeur RALENTIT. La charge est du parsing JSON sous
          # GIL, sérialisé de surcroît par les verrous par législature — quatre
          # threads se disputent le même interpréteur (9,8 s -> 13,8 s, +41 %),
          # et le RSS de pointe monte sur un job déjà exposé à l'OOM (#377).
          # L'input a été retiré parce qu'il ne pouvait que nuire s'il était
          # tourné : voir #workers-fige-a-1 pour les trois charges qu'il
          # confondait.
          #
          # `--budget-collecte-secondes 0` (#514) : absence de budget DÉCLARÉE,
          # et non reconduite par omission. Ce job a `--resume` et un point de
          # sauvegarde par membre : un shard coupé reprend là où il s'est
          # arrêté au run suivant, ce que l'ex-job `extract-senat` n'avait pas
          # (retiré par #528, la remarque vaut pour tout job sans reprise). Le
          # dimensionner demanderait une mesure sur les 752 membres du roster,
          # population que #514 n'a pas relevée — poser un chiffre ici serait
          # exactement la valeur mesurée ailleurs qu'elle corrige. À rouvrir si
          # un shard roster meurt sur une source dégradée (ROADMAP.md).
          /usr/bin/time -v python3 src/generate_all_profiles.py \
            --candidats raw_data/roster_candidats.json \
            --workers 1 \
            --shard "${{ matrix.shard }}/${{ needs.prepare-roster-matrix.outputs.shard_total || '1' }}" \
            "${POP_FLAG[@]}" --resume \
            "${INTERV_FLAG[@]}" "${DOSSIERS_FLAG[@]}" \
            --budget-collecte-secondes 0 \
            --manifest-out _manifest/profils-ecrits.txt \
            "${LIMIT_FLAG[@]}" "${MERGE_FLAG[@]}"

      # #450 : n'uploader QUE ce que ce job a écrit. Le `path:` pointe sur le
      # staging rempli à partir du manifeste, jamais sur `raw_data/profiles/`,
      # qui contient aussi la baseline committée issue du checkout — c'est elle
      # qui, republiée par chaque job, réinjectait des données périmées à la
      # fusion et faisait entrer les shards en collision. Rationale complète
      # dans ./.github/actions/publish-written-profiles.
      - name: Profils écrits par ce job — shard ${{ matrix.shard }}
        if: always()
        uses: ./.github/actions/publish-written-profiles
        with:
          manifest: _manifest/profils-ecrits.txt

      # Un artifact PAR SHARD (#394) : merge-and-pivot les récupère tous via
      # pattern + merge-multiple, comme il le fait déjà pour les shards
      # extract-an (#344). Un shard préempté ne prive donc que de sa tranche.
      #
      # merge-multiple aplatit les 8 artifacts dans un seul dossier : à nom de
      # fichier égal, un seul survit. Tant que chaque shard publiait TOUT
      # raw_data/profiles/, les 8 se disputaient chacun des 752 noms et seule
      # la tranche d'un shard atteignait la fusion — sur le run 32277443716,
      # 205 profils régénérés par les 8 shards, et les seuls à porter trace
      # d'une régénération dans le commit venaient tous du shard 6. Ne publier
      # que sa propre tranche rend les 8 jeux de fichiers disjoints : plus rien
      # à départager (#450).
      - name: Upload artifact roster-driven — shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-roster-groupes-${{ matrix.shard }}
          path: _publish/profiles/
          if-no-files-found: warn

      # Blocs factorisés en action composite (#412 §3). Le `if:` reste porté par
      # le step appelant : cancelled()/failure() évalués à l'intérieur de
      # l'action porteraient sur ses propres steps, pas sur l'état du job.
      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: cancelled
          scope: 'shard ${{ matrix.shard }}'

      - name: Diagnostic — job en échec
        if: failure()
        uses: ./.github/actions/job-diagnostics
        with:
          kind: failure
          scope: 'shard ${{ matrix.shard }}'


  # ──────────────────────────────────────────────────────────────────────────
  # JOB FUSION — merge-and-pivot
  #
  # Fusionne les artifacts des jobs d'extraction, génère les pivots, les
  # profils de parti et de groupe, lance la quality gate, et committe.
  # Tourne même si un ou plusieurs des 5 jobs `needs` ci-dessous ont échoué OU
  # ONT ÉTÉ SKIPPÉS : leur continue-on-error: true couvre le premier cas, le
  # `if: ${{ !cancelled() }}` ci-dessous couvre le second (#412 §2.1 — un job
  # skippé, par ex. parce que prepare-an-matrix a échoué ou que le matrix est
  # vide, skippait jusqu'ici toute la chaîne aval, à rebours de ce que cet
  # en-tête a toujours affirmé). Seule une annulation externe (cancelled())
  # arrête encore ce job. La résilience aux sources partiellement en échec est
  # déléguée à la quality gate (check_quality_gate.py) plutôt qu'à needs:.
  # ──────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # #885 — LES APPARTENANCES SÉNATORIALES.
  #
  # Le Sénat rentre dans le périmètre pour ses appartenances, PAS pour son
  # activité : son jeu ne porte ni scrutins ni comptes rendus, et la condition 2
  # du §7 de #528 reste déclarée non remplie, pas contournée.
  #
  # Le job ne collecte QUE les candidats déclarés (`normalize_senat.POPULATIONS_PUBLIEES`).
  # Mesuré : 2 profils et 133 appartenances, contre 36 profils et 1 794 entrées
  # sans ce filtre — dont 1 674 pour des membres de roster que seule
  # `mandats_agreges` lirait, un agrégat que #853 conteste déjà.
  #
  # `continue-on-error` comme extract-parltrack : une source tierce indisponible
  # ne doit pas coûter le run entier. Le corpus garde alors ce que la fusion
  # additive a publié au run précédent.
  extract-senat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/bootstrap-extraction

      - name: Jour courant (clé de cache Sénat)
        id: jour
        run: echo "jour=$(date +%F)" >> "$GITHUB_OUTPUT"

      # L'export est régénéré chaque nuit par le Sénat : la clé est le JOUR, là
      # où ParlTrack se contente de la semaine.
      - uses: actions/cache@v5
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/senat
          key: public-data-cache-senat-${{ steps.jour.outputs.jour }}
          restore-keys: |
            public-data-cache-senat-

      - name: Nettoyage cache Sénat (cold_start uniquement)
        if: ${{ inputs.cold_start }}
        run: rm -rf .cache/senat

      # L'ARCHIVE A DÉJÀ ÉTÉ SERVIE VIDE : 444 octets, 0 table, le 13/09/2026 à
      # 03 h 33, avec un HTTP 200 et un Content-Type application/zip. Republiée
      # saine à 12 h 42. Rien qu'un code de retour ne signale, d'où le contrôle
      # de taille ici ET `ExportSenatVide` dans `senat_opendata` : un collecteur
      # qui aurait tourné entre les deux aurait vidé les fiches en silence.
      - name: Téléchargement de l'export Sénat
        run: |
          mkdir -p .cache/senat
          if [[ -s .cache/senat/export_sens.sql ]]; then
            echo "Export déjà en cache, téléchargement sauté."
            exit 0
          fi
          curl -sS -L --max-time 300 -o .cache/senat/export_sens.zip \
            https://data.senat.fr/data/senateurs/export_sens.zip
          TAILLE=$(stat -c%s .cache/senat/export_sens.zip)
          echo "export_sens.zip : $TAILLE octets"
          if [[ "$TAILLE" -lt 1000000 ]]; then
            echo "::error::Export Sénat vide ou tronqué ($TAILLE octets, attendu ~8 Mo)."
            echo "::error::L'archive a déjà été servie vide le 13/09/2026 à 03h33 (444 octets, HTTP 200)."
            rm -f .cache/senat/export_sens.zip
            exit 1
          fi
          unzip -o -q .cache/senat/export_sens.zip -d .cache/senat/

      - name: Collecte des appartenances sénatoriales
        run: |
          python3 src/collecte_senat.py \
            --export .cache/senat/export_sens.sql \
            --manifest-out _publish/manifeste-senat.txt \
            --apply

      # #450 — UN ARTIFACT = LA CONTRIBUTION D'UN JOB. `raw_data/profiles/`
      # contient la baseline committée récupérée par le checkout : l'uploader
      # entier réinjecterait une copie périmée de tous les autres profils, que
      # `merge_raw_dirs` fusionnerait additivement avec les versions fraîches.
      - uses: ./.github/actions/publish-written-profiles
        if: always()
        with:
          manifest: _publish/manifeste-senat.txt
          # #997 — ce job collecte les appartenances sénatoriales, et rien
          # d'autre. Mesuré sur le run 35430469408 : `mandat_senatorial` est le
          # SEUL champ qui diffère de la baseline, sur ses 2 profils.
          champs: mandat_senatorial

      - name: Upload artifact profils bruts (Sénat)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-senat
          path: _publish/profiles/
          if-no-files-found: warn

  extract-mandats-locaux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/bootstrap-extraction

      # PAS DE CACHE, et c'est un choix (#922). Ce job ne télécharge aucun
      # fichier : il interroge `tabular-api.data.gouv.fr`, qui filtre côté
      # serveur — ~160 requêtes ciblées contre 76 Mo de CSV. Il n'y a donc rien
      # à mettre en cache, et une clé hebdomadaire ferait servir un répertoire
      # vide en croyant servir des données.
      #
      # Le `rid` de chaque fichier est résolu par le catalogue à chaque run : il
      # CHANGE à chaque publication trimestrielle, et le coder en dur ferait
      # collecter un corpus figé au jour où quelqu'un l'a copié.
      - name: Collecte des mandats locaux (Répertoire national des élus)
        run: |
          python3 src/collecte_mandats_locaux.py \
            --manifest-out _publish/manifeste-mandats-locaux.txt \
            --apply

      # #450 — UN ARTIFACT = LA CONTRIBUTION D'UN JOB.
      - uses: ./.github/actions/publish-written-profiles
        if: always()
        with:
          manifest: _publish/manifeste-mandats-locaux.txt
          # #997 — mesuré sur le run 35430469408 : `mandats_locaux` est le SEUL
          # champ qui diffère de la baseline, sur ses 33 profils. Le reste
          # partait figé au run précédent et écrasait les stades corrigés.
          champs: mandats_locaux

      - name: Upload artifact profils bruts (mandats locaux)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-mandats-locaux
          path: _publish/profiles/
          if-no-files-found: warn

  merge-and-pivot:
    needs: [extract-an, extract-ue-officiel, extract-parltrack, extract-roster-groupes, extract-senat, extract-mandats-locaux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 60 → 120 (#827). Le job tournait en 28 min ; la PREMIÈRE interrogation du
    # portail européen en ajoute 47, mesurées sur les 1 424 références des
    # explications de vote — 1 320 requêtes à 0,6 s, plus 13 blocages de 60 s
    # que le portail impose sans jamais les annoncer sur une réponse en 200.
    # 28 + 47 = 75 : à 60 le job serait tué, et le retry automatique repartirait
    # pour un second échec. Les runs suivants retombent à ~28 min grâce au cache
    # restauré plus bas — sans lequel le budget serait à repayer chaque fois.
    timeout-minutes: 120
    # actions: write — requis par le `gh workflow run deploy-pages.yml` de la
    # dernière étape (#416). Déclaré au niveau du job et non du workflow : les
    # jobs d'extraction n'ont aucune raison de pouvoir déclencher un workflow.
    permissions:
      contents: write
      actions: write

    steps:
      # ssh-key (#508) — POURQUOI le push ne se fait plus avec le GITHUB_TOKEN.
      #
      # Un ruleset de dépôt applique ses `required_status_checks` AUX PUSHS
      # DIRECTS, pas seulement aux PR. C'est la différence avec la protection
      # de branche classique, et elle ne se voit qu'à l'exécution : le
      # 20/08/2026, l'ajout du check requis « Suite complète » au ruleset a
      # fait rejeter ce push trois fois de suite — `GH013 [...] Required status
      # check "Suite complète" is expected` — sur un run qui avait produit
      # toutes ses données. Le check a dû être retiré le soir même, laissant le
      # dépôt sans protection bloquante.
      #
      # Ce job pousse sur `main` SANS PR : aucun check n'est attaché au commit
      # qu'il crée, donc aucun check ne peut passer avant le push. La règle est
      # structurellement insatisfiable pour lui — il lui faut un contournement,
      # pas une attente.
      #
      # L'acteur de contournement évident, l'app GitHub Actions, est refusé par
      # l'API sur un dépôt PERSONNEL (« Actor GitHub Actions integration must
      # be part of the ruleset source or owner organization »). `DeployKey`,
      # lui, est accepté. Le push passe donc en SSH sous une clé de
      # déploiement inscrite dans les `bypass_actors` du ruleset.
      #
      # DÉGRADATION : secret absent (fork, branche de travail sans le secret)
      # ⇒ `ssh-key` vaut la chaîne vide, actions/checkout retombe sur le
      # GITHUB_TOKEN en HTTPS et ce job se comporte exactement comme avant. Le
      # rejet éventuel est alors nommé par le step de push ci-dessous.
      #
      # CONSÉQUENCE À CONNAÎTRE : un push fait sous une clé de déploiement
      # ÉMET un événement `push`, là où le GITHUB_TOKEN n'en émet aucun
      # (protection anti-boucle). Deux workflows le voient désormais passer —
      # `tests.yml` et `deploy-pages.yml` ; voir la dernière étape de ce job et
      # docs/decisions/push-donnees-cle-de-deploiement-508.md.
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DATA_PUSH_SSH_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Step `week` + cache dossiers (#427). Ce job était le seul de
      # generate-data.yml SANS aucun actions/cache : il re-téléchargeait les
      # trois archives de dossiers (~33 Mo) à chaque run pour générer les
      # profils de gouvernement, `generate_gouvernement_profiles.py` appelant
      # directement `fetch_dossiers_gouvernementaux()`.
      #
      # Ce n'était pas qu'un gaspillage : ce script ÉCRASE les profils, et la
      # collecte est non-fatale. Un échec réseau ici réécrivait les 10
      # gouvernements avec `textes: []` — 725 textes perdus, committés et
      # publiés. Le garde-fou principal est côté Python (refus de réécrire sur
      # collecte incomplète) ; ce cache réduit la fréquence d'exposition.
      - name: Semaine ISO courante (clé de cache dossiers)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        id: cache_dossiers_merge
        with:
          path: .cache/dossiers_an
          key: public-data-cache-dossiers-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-dossiers-

      # #762 — REPRENDRE L'ARCHIVE VIVANTE QUAND LA SEMAINE A CHANGÉ.
      #
      # La clé de ce cache est hebdomadaire, mais le `restore-keys` de préfixe
      # la désamorce : au changement de semaine, la clé exacte manque, le
      # préfixe restaure le répertoire de la semaine d'avant, et
      # `ensure_dossiers_zip_downloaded` court-circuite sur `is_file()` — rien
      # n'est retéléchargé, et le répertoire inchangé repart sous la clé neuve.
      # C'est #749, appliqué aux dossiers.
      #
      # `cache-hit == 'true'` UNIQUEMENT sur correspondance exacte de la clé
      # primaire ; 'false' quand la restauration vient d'un `restore-keys` —
      # exactement le signal « on a changé de semaine ».
      #
      # Seules les législatures EN COURS sont reprises (9,8 Mo). Les dissoutes
      # ne produisent plus d'acte : les reprendre coûterait 23 Mo par semaine
      # pour un contenu identique.
      #
      # `!inputs.cold_start` COMME LE BLOC DE CACHE CI-DESSUS, et pour une
      # raison concrète : sur un démarrage à froid, le `rm -rf .cache` qui suit
      # effacerait ce que cette étape vient de télécharger. Rien à rafraîchir
      # là où tout est purgé puis repris.
      - name: Reprendre les archives de dossiers vivantes (semaine nouvelle)
        if: ${{ !inputs.cold_start && steps.cache_dossiers_merge.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: python3 src/rafraichir_dossiers_actifs.py

      # ── Téléchargement des artifacts d'extraction ─────────────────────────
      # Chaque source arrive dans son propre sous-répertoire pour éviter les conflits.
      # continue-on-error: true sur les 3 téléchargements ci-dessous — depuis
      # que extract-an/extract-ue-officiel ont eux-mêmes
      # continue-on-error: true, un échec précoce (avant l'étape "Upload
      # artifact", ex. pip install) peut laisser l'artifact absent plutôt que
      # simplement vide ; sans ce flag, download-artifact ferait échouer tout
      # ce job pour une seule source en échec. merge_raw_dirs (merge_profile.py)
      # ignore déjà silencieusement un répertoire source absent.
      # extract-an est un matrix (#344, un job par candidat à slug résolvable)
      # : pattern + merge-multiple récupère tous les artifacts raw-profiles-an-*
      # (un par shard) et les aplatit dans un seul dossier — download-artifact
      # ne fait pas échouer ce step si aucun ne matche (continue-on-error déjà
      # présent ci-dessous couvre ce cas, cohérent avec le pattern "optionnel"
      # des autres téléchargements de ce job).
      - name: Download artifacts AN — tous les shards (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-profiles-an-*
          path: _artifacts/an
          merge-multiple: true

      - name: Download artifact UE (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-ue-officiel
          path: _artifacts/ue

      # ParlTrack : optionnel — continue-on-error si l'artifact est absent
      # (job extract-parltrack a échoué ou timeout). Le mode fallback est
      # géré par --enrich-parltrack dans l'étape de pivot ci-dessous.
      # #827 — le cache des documents européens. Sans lui, chaque run repaie les
      # 47 minutes d'interrogation du portail pour un corpus qui, lui, ne bouge
      # pas : ce sont des documents publiés, définitifs, dont l'existence ne
      # change plus. La clé est fixe et non hebdomadaire, contrairement aux
      # dumps ParlTrack : un document du Parlement européen ne se périme pas,
      # et faire expirer ce cache ne rachèterait rien qu'une facture.
      # #901 — une clé PAR RUN, et c'est voulu. Ce cache ACCUMULE : chaque run
      # repart du précédent et l'enrichit. La clé était fixe
      # (`…-documents-v1`) : `actions/cache` ne réécrit jamais une clé qui
      # existe, si bien que le cache restauré au run 35087127267 était encore
      # celui de sa toute première sauvegarde — des booléens d'existence, sans
      # titre ni concepts — et que rien de ce que les runs suivants avaient
      # appris n'était gardé (« Cache hit occurred on the primary key, not
      # saving cache »). Une clé par run ne touche jamais juste : chaque run
      # sauvegarde, et le suivant restaure le plus récent par préfixe.
      #
      # Ce n'est PAS le piège de #749 : là, un repli désamorçait la rotation
      # d'un cache qu'on voulait reconstruire chaque semaine. Ici on veut
      # précisément reprendre l'état précédent.
      - uses: actions/cache@v5
        if: ${{ !inputs.cold_start }}
        with:
          path: .cache/europarl
          key: public-data-cache-europarl-documents-v3-${{ github.run_id }}
          restore-keys: |
            public-data-cache-europarl-documents-v3-
            public-data-cache-europarl-

      # #885 — optionnel comme les autres : si extract-senat a échoué, le corpus
      # garde ce que la fusion additive a publié au run précédent, et rien ne
      # disparaît. Vers `_artifacts/senat` et JAMAIS vers `raw_data/profiles` :
      # un artifact qui atterrit directement dans l'arbre court-circuite
      # `merge_raw_dirs` et écrase les contributions des autres jobs (#450).
      - name: Download artifact profils bruts Sénat (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-senat
          path: _artifacts/senat

      # #922 — même régime : optionnel, vers son propre répertoire. Le bloc
      # `mandats_locaux` déclare toujours son `appariement`, y compris quand il
      # ne porte aucun mandat : une fiche doit pouvoir distinguer « relu, aucun
      # mandat » de « personne n'a encore regardé ».
      - name: Download artifact profils bruts mandats locaux (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-mandats-locaux
          path: _artifacts/mandats-locaux

      - name: Download artifact ParlTrack (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: parltrack-dumps
          path: .cache/parltrack

      # Roster-driven : optionnel — continue-on-error si l'artifact est absent
      # (job extract-roster-groupes a échoué/timeout, rollout progressif #192).
      # Depuis #394, extract-roster-groupes est un matrix : un artifact par
      # shard, récupérés par pattern + merge-multiple (même mécanique que les
      # shards extract-an ci-dessus). Un shard manquant (préempté) réduit la
      # couverture du run sans faire échouer la fusion.
      - name: Download artifacts roster-driven — tous les shards (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-profiles-roster-groupes-*
          path: _artifacts/roster
          merge-multiple: true

      # ── Fusion des profils bruts des 3 sources FR/UE ──────────────────────
      # merge_profile.py --dirs : fusionne additivement les profils de chaque
      # source vers raw_data/profiles/ (même logique que --no-merge=false).
      #
      # Depuis #450, chaque artifact ne contient QUE les profils que son job a
      # écrits. Ce que cela change ici :
      # - un slug touché par plusieurs sources (ex. un candidat déclaré présent
      #   aussi dans le roster) est bien l'union de contributions FRAÎCHES —
      #   c'est le seul cas où la fusion additive doit encore jouer entre
      #   artifacts ;
      # - un slug qu'aucun job n'a touché n'apparaît dans aucun artifact, et
      #   conserve donc sa version committée : `merge_raw_dirs` boucle sur les
      #   fichiers SOURCES et ne réécrit que ceux-là. La baseline n'a jamais eu
      #   besoin de transiter par un artifact, ce job faisant son propre
      #   checkout ;
      # - un écrasement n'est donc plus défait à cette étape : la version
      #   périmée d'un profil régénéré n'est plus présente pour être réunie à la
      #   version corrigée.
      #
      # `cold_start` ne purge plus `raw_data/profiles/` depuis #578 : il ne
      # touche que les caches de téléchargement des runners d'extraction. Un
      # profil qu'aucun job d'extraction ne couvre survit de toute façon par le
      # checkout de ce job — c'était déjà le cas avant #450.
      # #885 : `_artifacts/senat` EST DE RETOUR, et son producteur avec —
      # `extract-senat`, qui lit `data.senat.fr` et non l'archive NosSénateurs.
      # #528 l'avait retiré en écrivant qu'il ne fallait pas « faire croire à une
      # source muette là où il n'y a plus de source du tout » ; il y en a une, et
      # le laisser dehors ferait maintenant l'inverse — taire une source qui
      # parle. Un répertoire absent reste un no-op pour `merge_raw_dirs`, donc
      # un run où `extract-senat` échoue se comporte exactement comme avant.
      # LA LISTE DU JOUR (#757). Elle écrase `raw_data/candidats.json` du
      # checkout : c'est elle qu'a servi `extract-an`, et c'est donc elle que la
      # première passe pivot doit normaliser. Les deux divergeraient sinon —
      # exactement le défaut que #518 a supprimé côté roster.
      #
      # Son absence n'échoue pas : le fichier committé reste en place, le run
      # publie le périmètre d'hier, et le warning le dit.
      - name: Liste des candidats du run — artifact (optionnel)
        id: candidats_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: candidats-a-jour
          path: raw_data

      - name: Périmètre publié par ce run
        run: |
          if [ "${{ steps.candidats_artifact.outcome }}" = "failure" ]; then
            echo "::warning::CANDIDATS_ARTIFACT_ABSENT — merge-and-pivot normalise la liste COMMITTÉE. Le périmètre publié est celui d'hier (#757)."
          else
            python3 -c "import json;d=json.load(open('raw_data/candidats.json'));c=d['candidats'];print(f\"Liste du jour : {len(c)} entrées, {sum(1 for x in c if x.get('slug'))} à slug résolvable.\")"
          fi

      # ── Une panne de transport n'est pas une source absente (#786) ────────
      #
      # Le run `34241352524` est vert et n'a collecté personne. Les quatre
      # téléchargements ci-dessus sont partis dans la même seconde et ont tous
      # reçu un 403 « secondary rate limit » sur `ListArtifacts`, que
      # `download-artifact` déclare non-retryable ; `continue-on-error: true` a
      # fait le reste. `merge_raw_dirs` a vu des répertoires vides et écrit
      # `0 profil(s)` là où le run d'avant en écrivait 636 — 40 artifacts AN et
      # 8 artifacts roster étaient pourtant publiés et non expirés.
      #
      # POURQUOI ICI, ET PAS DANS UN GARDE-FOU EXISTANT : les autres mesurent la
      # collecte APRÈS la fusion, et sans profil brut il n'y a ni perte à
      # constater (#460) ni collecté-non-publié à signaler (#511). Ce step est
      # le seul point du run à tenir les deux termes de la comparaison —
      # l'inventaire de ce que les jobs ont publié, et le disque.
      #
      # Il ne remplace pas les `continue-on-error` ci-dessus : ils restent la
      # bonne conduite pour une source qui n'a rien produit. Il sépare ce cas de
      # celui où la collecte a eu lieu et n'arrive pas.
      # `github.token`, PAS `secrets.GITHUB_TOKEN` : ce job n'a droit qu'à une
      # seule identité venue de `secrets.`, la clé de déploiement qui pousse
      # (#508), et un second nom sous ce préfixe rendrait le ruleset ambigu.
      # Ce step ne pousse rien — il lit l'inventaire du run, que
      # `permissions: actions: write` autorise déjà.
      - name: Artifacts d'extraction — panne de transport ou source absente
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/verifier_transport_artifacts.py

      # #997 — L'ORDRE NE SE TOUCHE PAS, ET LA MESURE L'A TRANCHÉ.
      #
      # `merge_raw_profile` fait gagner la source la plus récente : la DERNIÈRE
      # de cette liste l'emporte. Mettre les jobs d'enrichissement en tête
      # paraissait le filet évident — ils reposaient une baseline périmée sur
      # ce que l'extraction AN venait de corriger. Rejoué sur les artifacts
      # réels du run 35430469408, ce filet FAIT PERDRE ce qu'il devait
      # protéger : `_artifacts/an` porte `mandats_locaux: []`, le job AN ne les
      # collectant pas, et repasser en dernier lui fait écraser les 5 mandats
      # locaux d'Édouard Philippe.
      #
      # Une source qui APPORTE un champ doit rester la dernière à parler : cet
      # ordre-ci est le bon, et il n'y a pas de filet qui rende l'ordre
      # indifférent. `CHAMPS_PROTEGES_DU_VIDE` n'en est pas un : il ne sert
      # qu'à `preserver_collectes_non_vides`, en mode `--no-merge`, et ne
      # traverse pas `merge_raw_dirs` — vérifié avant de l'écrire ici.
      # Ce qui tient, c'est que chaque job ne publie que ses champs.
      - name: Fusion des profils bruts (AN + UE + roster + Sénat + locaux)
        run: |
          python3 src/merge_profile.py \
            --dirs _artifacts/an _artifacts/ue _artifacts/roster _artifacts/senat \
                   _artifacts/mandats-locaux \
            --out raw_data/profiles

      # ── Pivot + enrichissement ParlTrack ──────────────────────────────────
      # --pivot-only   : pas d'appel réseau, normalise les profils bruts existants.
      # --enrich-parltrack : enrichit les pivots MEP si .cache/parltrack/ est
      #                      disponible ; sinon ajoute un warning fallback.
      # --parltrack-status-out : fichier JSON lu par check_quality_gate.py §5.
      # existing_profiles=overwrite → --no-merge : recréation complète des pivots.
      # sinon                        → fusion additive des pivots (défaut).
      - name: Normalisation pivot + enrichissement ParlTrack
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
        run: |
          MERGE_FLAG=()
          # `existing_profiles=overwrite` écrase SANS purger le cache (#440,
          # #578) : c'est le cas courant — on réécrit les profils à partir de
          # données déjà téléchargées. Purger obligerait à re-télécharger
          # ~300 Mo d'archives AN, sur une source dont l'indisponibilité a déjà
          # bloqué trois chantiers. `cold_start` est l'autre axe, et il ne lève
          # plus `--no-merge` : purger le cache ne dit rien de ce qu'on écrit.
          [[ "$OVERWRITE" == "true" ]] && MERGE_FLAG=(--no-merge)
          # --no-checkpoint : une passe --pivot-only n'a rien à reprendre (pas
          # de --resume ici, ni sur la passe roster qui suit). Sans ce drapeau,
          # elle écrit `raw_data/profiles/.generation_checkpoint.json` — un
          # fichier de progression DANS le répertoire des profils bruts — et le
          # garde-fou « Collecté mais non publié » (#511), qui inventorie ce
          # répertoire par nom de fichier, le comptait comme un brut sans pivot.
          # Run 32773067295 (24/08/2026) : 22 jobs verts, commit annulé,
          # `Slug(s) : .generation_checkpoint`. Le garde-fou écarte désormais
          # les fichiers cachés ; ce drapeau supprime la cause, qui touchait
          # aussi les six inventaires en `glob("*.json")` du dépôt (pathlib
          # remonte les fichiers cachés, contrairement au module `glob`).
          python3 src/generate_all_profiles.py \
            --pivot-only \
            --no-checkpoint \
            --enrich-parltrack \
            --parltrack-status-out parltrack-status.json \
            --workers 1 \
            "${MERGE_FLAG[@]}"

      # Pas de --enrich-parltrack sur ce second passage, contrairement au
      # premier (#413 §4) : ParlTrack est une source UE (eurodéputé·es), et le
      # roster ne contient que des membres AN — l'enrichissement n'aurait
      # aucun pivot à enrichir ici. Asymétrie voulue, pas un oubli.
      #
      # Pivots roster-driven (#192) : repasse --pivot-only explicitement sur
      # raw_data/roster_candidats.json — celui du run, téléchargé juste avant
      # (#518), et non plus une liste reconstruite ICI. C'est la moitié
      # « correction » de #518 : ce step normalise en pivot ce que sa liste
      # contient, et les shards ont collecté ce que LEUR liste contenait. Tant
      # que les deux étaient deux fetchs distincts, un membre pouvait être
      # collecté par un shard sans jamais être présenté à cette passe — un
      # « collecté mais non publié » (#511) produit sans qu'aucune étape
      # n'échoue. meta.provenance
      # "roster_groupe" ne rétrograde jamais un pivot "candidat_declare"
      # existant (merge_pivot_profile, voir docs/technical_decisions.md
      # #provenance-pivot) : sûr même si le même slug existe dans les deux
      # listes. No-op silencieux si extract-roster-groupes a échoué/été
      # absent (raw_data/profiles ne contient alors aucun profil roster-driven
      # → chaque candidat roster est ignoré comme "profil brut absent").
      #
      # LA BRANCHE ROSTER NE COÛTE PLUS LE COMMIT DES CANDIDATS DÉCLARÉS (#524).
      #
      # Jusqu'ici `generate_roster_candidats.py` FAISAIT ÉCHOUER LE REPLI
      # ci-dessous (#511) : sur un fetch tombé, il refuse d'écrire un roster
      # incomplet et sort en 1, que le `bash -e` du step propageait. Le run
      # 32876863499 a montré le prix de cet arbitrage : l'étape 12 (fusion des
      # bruts) et l'étape 13 (normalisation pivot + ParlTrack, 165 s, VERTE)
      # étaient terminées, et tout a été jeté au step 15.
      #
      # C'est exactement l'arbitrage écrit 70 lignes plus bas pour
      # `generate_group_profiles.py`, et jamais appliqué ici : refuser qu'une
      # donnée NON écrite annule la publication d'une donnée écrite. Rien n'a
      # été écrit sur ce chemin — le roster n'est pas committé, les profils de
      # candidats déclarés et les fiches de parti, si.
      #
      # Le saut est SÛR ET SURVEILLÉ, il n'est pas décrété : si le fetch roster
      # échoue ici, les shards n'ont rien collecté non plus (ils meurent au même
      # endroit), donc il n'existe aucun profil « collecté mais non publié » à
      # produire. Et si cette hypothèse devenait fausse un jour,
      # `audit_collecte_non_publiee.py` (#511/#518) reste armé plus bas et
      # bloquerait le commit. Le garde-fou de #511 n'est pas contourné : il est
      # ce qui rend ce saut légitime.
      #
      # Filtrage sur le CODE, dans le shell, JAMAIS `continue-on-error: true` —
      # même raison qu'au step groupes : il avalerait aussi ce qui n'est pas un
      # code de sortie documenté (127, 137/OOM…), et un job mort pour une autre
      # cause passerait pour un roster indisponible. Codes tolérés :
      #   · 2 — extraction de tous les groupes suspendue, rien à collecter (#524) ;
      #   · 1 — roster INCOMPLET, donc NON ÉCRIT (#511). C'est le cas du 500.
      # Dans les deux cas `raw_data/roster_candidats.json` est absent, et c'est
      # cette absence — pas le code — qui ferme la branche au step suivant.
      - name: Roster du run — artifact (optionnel)
        id: roster_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: roster-candidats
          path: raw_data

      - name: Repli — construction de la liste roster-driven
        if: ${{ steps.roster_artifact.outcome == 'failure' }}
        run: |
          echo "::warning::Artifact roster-candidats absent : merge-and-pivot reconstruit le roster pour lui-même. Sa liste peut différer de celle sur laquelle les shards ont collecté (#518)."
          CODE=0
          python3 src/generate_roster_candidats.py \
            --rosters-bruts-out raw_data/rosters_bruts.json || CODE=$?
          if [[ "$CODE" == "1" || "$CODE" == "2" ]]; then
            echo "::warning::Roster du run indisponible (code ${CODE}) : la branche roster de ce job est sautée. Les profils de candidats déclarés et les profils de parti sont committés normalement ; audit_collecte_non_publiee.py reste armé et bloquerait le commit si un profil collecté restait non publié (#524)."
            exit 0
          fi
          [[ "$CODE" == "0" ]] || exit "$CODE"

      # `if: hashFiles(...)` et non un `if:` sur le code du step précédent : le
      # roster peut aussi manquer sans que ce repli ait tourné (artifact
      # téléchargé mais vide, `prepare-roster-matrix` sauté). La condition
      # porte donc sur ce dont ce step a réellement besoin — le fichier —, pas
      # sur l'une des routes qui l'amènent. Il n'est jamais committé : sans lui
      # cette passe échouerait de toute façon, sur un message qui parlerait de
      # fichier introuvable plutôt que de branche roster fermée (#524).
      - name: Normalisation pivot roster-driven
        if: ${{ hashFiles('raw_data/roster_candidats.json') != '' }}
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
        run: |
          MERGE_FLAG=()
          # `existing_profiles=overwrite` écrase SANS purger le cache (#440,
          # #578) : c'est le cas courant — on réécrit les profils à partir de
          # données déjà téléchargées. Purger obligerait à re-télécharger
          # ~300 Mo d'archives AN, sur une source dont l'indisponibilité a déjà
          # bloqué trois chantiers. `cold_start` est l'autre axe, et il ne lève
          # plus `--no-merge` : purger le cache ne dit rien de ce qu'on écrit.
          [[ "$OVERWRITE" == "true" ]] && MERGE_FLAG=(--no-merge)
          # --no-checkpoint : même raison que la passe précédente (#518).
          python3 src/generate_all_profiles.py \
            --pivot-only \
            --no-checkpoint \
            --candidats raw_data/roster_candidats.json \
            --workers 1 \
            "${MERGE_FLAG[@]}"

      # Commission saisie au fond, par dossier législatif (#328) — l'acte
      # `AN1-COM-FOND-SAISIE` des archives de dossiers déjà restaurées par le
      # cache ci-dessus, résolu en organe par le référentiel AMO30.
      #
      # Ne dépend d'AUCUN profil : c'est une table du référentiel, pas un
      # agrégat du corpus. Elle est donc construite ici plutôt qu'à l'intérieur
      # d'une passe pivot, et sa fusion est additive — un run sans archive
      # lisible conserve la table publiée au lieu de la vider (AGENTS.md §3a).
      #
      # Non bloquant : sans cette table, « L'essentiel » de la fiche candidat
      # n'affiche simplement pas la répartition par commission. Elle n'est
      # jamais déduite d'un intitulé de dossier — ce serait une classification
      # construite par ce dépôt (§2 règle 1).
      - name: Construire la table des commissions saisies au fond
        continue-on-error: true
        run: python3 src/build_commissions_dossiers.py

      # Le rattachement d'un scrutin à son dossier (#758). Même source, même
      # arbre `actesLegislatifs`, mêmes archives déjà téléchargées par l'étape
      # ci-dessus : c'est le troisième usage du même parcours, et il tient dans
      # le même cache.
      #
      # Un scrutin AN ne nomme pas le texte qu'il tranche — `objet.
      # referenceLegislative` est nul sur 0/18 311 scrutins bruts. Le lien
      # n'existe qu'en sens inverse, dans `voteRefs`. Sans cette table, la
      # section « Ce qu'il a voté » ne peut dire ni sur quoi porte un texte
      # voté, ni ce qu'il est devenu.
      #
      # Non bloquant, et fusion additive : un run sans archive lisible conserve
      # la table publiée au lieu de la vider (AGENTS.md §3a).
      - name: Construire le rattachement des scrutins aux dossiers
        continue-on-error: true
        run: python3 src/build_scrutins_dossiers.py

      # existing_profiles=overwrite → recréation complète des groupes.
      # Sinon → --merge-existing : membres absents du roster live réintégrés
      #         depuis le fichier précédent (résilience réseau).
      #
      # Réintégrer des membres depuis un fichier de groupe produit avec
      # l'ancien schéma ramènerait précisément les données que l'écrasement
      # vise à remplacer (#440). `cold_start` ne commande plus ce choix (#578) :
      # il purge le cache de téléchargement, pas la politique d'écriture.
      #
      # `--rosters-bruts` : la composition vient du roster que
      # `prepare-roster-matrix` a collecté au début du run, pas d'un fetch
      # propre à ce step. Deux raisons, et la seconde est la vraie (#518) :
      #   - ce fetch est celui qui a tué le run 32750929942. Les 5 groupes AN
      #     partagent la clé ('deputes','16') : un fetch raté = 5 échecs =
      #     step rouge = commit skippé, pour ~452 profils de candidats
      #     parfaitement collectés ;
      #   - la fiche publiée décrivait une composition lue ~7 min APRÈS celle
      #     qui a servi à collecter les profils. Une entrée/sortie de groupe
      #     entre les deux, et la composition publiée diverge du corpus
      #     collecté — sans qu'aucune étape n'échoue. Même défaut de
      #     correction que le roster de candidats, fermé de la même façon.
      # Une clé absente du fichier est fetchée normalement : le repli reste.
      #
      # SEUL LE CODE 2 EST TOLÉRÉ, et c'est la raison d'être du code 2.
      #
      # Même arbitrage que le step gouvernement ci-dessous (#427) : « roster
      # indisponible » veut dire qu'AUCUNE fiche n'a été touchée — les versions
      # committées sont intactes sur le disque. Faire tomber tout le job
      # priverait alors le run du commit des ~452 profils de candidats et des
      # profils de parti, qui sont corrects. Refuser qu'une donnée NON écrite
      # annule la publication d'une donnée écrite, c'est ce que le run
      # 32750929942 a fait faute de cette distinction.
      #
      # Le filtrage se fait ici, sur le code, et NON par un
      # `continue-on-error: true` sur le step : celui-ci avalerait aussi le
      # code 1 — une génération de groupe qui plante réellement —, ce qui
      # annulerait la distinction que ce même step vient d'introduire et
      # laisserait committer une fiche périmée sans que rien ne bloque. Le prix
      # de ce choix est que le step reste VERT sur un code 2 ; ce qui rend la
      # chose lisible n'est de toute façon pas sa couleur mais les annotations
      # `::error::` de `generate_group_profiles.py`, qui nomment la clé de
      # roster tombée et chaque fiche non régénérée (#518) — la couleur d'un
      # step ne dit jamais laquelle.
      #
      # Aucune tolérance ajoutée par ailleurs : la section 4 du quality gate
      # hard-faile toujours sur une fiche de groupe absente ou invalide.
      # #901 — l'index des scrutins européens. Il se construit APRÈS les passes
      # pivot : son périmètre est l'ensemble des `numero_scrutin` que les
      # profils publiés citent, et le lire avant les aurait indexé un corpus
      # d'hier. Le dump `ep_votes` est déjà en cache — `extract-parltrack` l'a
      # téléchargé — donc aucun appel réseau supplémentaire.
      #
      # Pas de tolérance : `DumpVotesIndisponible` fait échouer le step plutôt
      # que d'écrire un index vide, qui se lirait comme « aucun scrutin
      # européen » (#510).
      - name: Générer l'index des scrutins européens
        run: |
          python3 src/scrutins_europeens.py \
            --profils-dir pivot_data/profiles \
            --out pivot_data/scrutins_europeens.json

      # #901 — l'index des dossiers européens : référence de procédure →
      # intitulé. Même moment et même raison que l'index des scrutins juste
      # au-dessus : son périmètre est ce que les profils publiés citent — les
      # `texte_vise` des amendements ET les `reference_dossier` des textes
      # portés. La seconde source a été ajoutée le 16/09/2026 : sans elle, 34
      # références citées par une fiche ne résolvaient nulle part.
      - name: Générer l'index des dossiers européens
        run: |
          python3 src/dossiers_europeens.py \
            --profils-dir pivot_data/profiles \
            --out pivot_data/dossiers_europeens.json

      # #901 — le cache du portail est SAUVEGARDÉ ICI, sans attendre la fin du
      # job. `actions/cache` n'enregistre qu'en cas de succès : le run
      # 35231390627 a été annulé au dépassement des 120 minutes, et les 1 501
      # réponses apprises par la passe des domaines ont été perdues avec lui.
      # Clé distincte de celle du post-job (suffixe `-dossiers`), pour que les
      # deux sauvegardes coexistent : le préfixe de restauration prend la plus
      # récente, donc celle du post-job quand le run réussit, celle-ci sinon.
      - name: Sauvegarder le cache du portail européen (même si la suite échoue)
        if: ${{ always() && !inputs.cold_start }}
        uses: actions/cache/save@v5
        with:
          path: .cache/europarl
          key: public-data-cache-europarl-documents-v3-${{ github.run_id }}-dossiers

      # #901 — l'index des documents européens : `doceo` → matières EuroVoc.
      # Après l'index des dossiers, et pour ce qu'il ne couvre pas : 628 des 694
      # textes portés européens ne citent AUCUN dossier — des résolutions
      # déposées en séance, qui n'ouvrent pas de procédure. Le portail les
      # classe pourtant (`is_about`), et les concepts arrivent dans la réponse
      # que le résolveur télécharge déjà : aucune requête de plus au Parlement.
      # Seuls les libellés coûtent, chez l'Office des publications (EuroVoc,
      # CC BY 4.0), résolus par lots SPARQL.
      #   entrée   : src/documents_europeens.py (lit src/europarl_documents.py)
      #   consomme : pivot_data/profiles/*.pivot.json (les `source_url` doceo)
      #   produit  : pivot_data/documents_europeens.json
      - name: Générer l'index des documents européens
        run: |
          python3 src/documents_europeens.py \
            --profils-dir pivot_data/profiles \
            --out pivot_data/documents_europeens.json

      - name: Générer les profils de groupe parlementaire réel
        env:
          OVERWRITE: ${{ inputs.existing_profiles == 'overwrite' }}
        run: |
          MERGE_FLAG=()
          [[ "$OVERWRITE" != "true" ]] && MERGE_FLAG=(--merge-existing)
          CODE=0
          python3 src/generate_group_profiles.py \
            --config raw_data/groupes_reels.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/groupes \
            --rosters-bruts raw_data/rosters_bruts.json \
            --validate "${MERGE_FLAG[@]}" || CODE=$?
          # 2 = EXIT_ROSTER_INDISPONIBLE : rien d'écrit, rien de perdu.
          if [[ "$CODE" -eq 2 ]]; then
            echo "### Profils de groupe (#518)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Roster indisponible : aucune fiche de groupe régénérée, les versions committées restent en place. Le run continue — voir les annotations \`ROSTER_INDISPONIBLE\` pour la clé de fetch et les fiches concernées." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODE"

      # Les fiches de LIGNÉE (#836), lues sur les fiches de groupe que le step
      # précédent vient d'écrire — jamais du réseau. Elles tournent donc APRÈS
      # lui et survivent à son code 2 : un roster indisponible laisse les fiches
      # committées en place, et la lignée bâtie dessus reste juste, simplement
      # inchangée.
      #
      # continue-on-error, même arbitrage que le step gouvernement (#427) : un
      # défaut de lignée ne doit pas coûter au run le commit des profils et des
      # fiches de groupe, qui sont corrects. Le prix de ce choix est qu'une
      # fiche périmée resterait committée sans que rien ne bloque — et c'est
      # exactement pourquoi la §4c du quality gate hard-faile sur une fiche de
      # lignée absente ou invalide : le contrôle de perte, lui, ne verrait rien,
      # un fichier périmé n'ayant pas disparu.
      #
      # Coût mesuré sur le corpus du 11/09/2026 : 104 s et 1 453 Mio de RSS
      # maximum pour les 10 lignées, index des amendements compris.
      - name: Générer les fiches de lignée de groupe
        continue-on-error: true
        run: |
          python3 src/generate_lignee_profiles.py \
            --config raw_data/groupes_reels.json \
            --groupes-dir pivot_data/groupes \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/lignees \
            --validate

      # Agrégation locale depuis les profils pivot déjà produits ci-dessus,
      # pas de roster réseau (gouvernement_roster.py) : contrairement au step
      # groupes, pas de FRESH/--merge-existing équivalent — le résultat est
      # entièrement déterministe à partir des données locales à chaque run.
      # Seul appel réseau : le dump AN des dossiers législatifs
      # (gouvernement_textes.py, ~10 Mo), mutualisé une seule fois pour tous
      # les gouvernements du batch. Coût mesuré négligeable au regard du
      # budget de 60 min de ce job (#215) — pas de job dédié nécessaire, voir
      # docs/decisions/gouvernement-ci-integration.md.
      # continue-on-error : le code de sortie 2 signale une collecte incomplète
      # — aucun profil n'a été touché, les versions committées restent en
      # place. Faire échouer tout le job priverait le run du commit des
      # profils de candidats et de groupes, qui eux sont corrects. L'échec
      # reste visible dans la liste des steps et dans le résumé (#427).
      # #996 — la liste des gouvernements est lue dans AMO30 à chaque run, au
      # lieu d'être écrite à la main (#209 en listait 10 ; AMO30 en publie 17
      # depuis 2007). PAS de continue-on-error : une archive illisible lève
      # avant toute écriture, et la liste committée reste en place.
      #   entrée   : src/gouvernements_amo30.py
      #   produit  : raw_data/gouvernements_reels.json
      - name: Lister les gouvernements depuis AMO30
        run: python3 src/gouvernements_amo30.py --out raw_data/gouvernements_reels.json

      - name: Générer les profils de gouvernement
        continue-on-error: true
        run: |
          python3 src/generate_gouvernement_profiles.py \
            --config raw_data/gouvernements_reels.json \
            --rosters-bruts raw_data/rosters_bruts.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/gouvernements \
            --validate

      # Cache-only : cet artifact provient du job extract-amendements-an (#251),
      # qui n'est PAS dans le `needs:` de ce job (#413 §4) : le téléchargement ne
      # fonctionne que parce que extract-roster-groupes, lui, en dépend, et que
      # ce job dépend de extract-roster-groupes. Dépendance transitive, donc
      # fragile si un `needs:` bouge — l'artifact étant optionnel
      # (continue-on-error + dégradation gracieuse ci-dessous), la casse serait
      # silencieuse. Documenté plutôt que corrigé : ajouter le `needs:` direct
      # changerait le graphe de dépendances pour un gain nul tant que la chaîne
      # tient.
      # continue-on-error: true — même pattern que l'étape homonyme d'extract-an/
      # extract-roster-groupes (#252) : en cas d'échec/absence, la section 3d du
      # quality gate signale simplement chaque législature "jamais construite"
      # au lieu de lire une fraîcheur réelle (dégradation gracieuse, pas un échec
      # de job). Alimente check_quality_gate.py --amendements-cache-dir (défaut
      # .cache/amendements_an, section 3d, issue #254).
      - name: Download artifact amendements AN (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # Entrées dérivées de la table de correspondance (#715), AVANT le portail
      # et après que les pivots sont écrits — les deux conditions comptent.
      #
      # #708 a ouvert la porte d'entrée d'un membre de roster sans
      # correspondance relue : son slug est FABRIQUÉ depuis l'état civil AMO30
      # de son acteur. La §5b du portail, elle, exige une entrée de table pour
      # tout profil publié — et le constructeur ne propose que ce que les
      # profils DÉJÀ PUBLIÉS lui donnent. Résultat mesuré sur le run
      # 33613535746 : 160 profils neufs collectés, 160 slugs sans entrée,
      # commit bloqué, 57 min de collecte perdues, et un remède imprimé qui ne
      # pouvait rien proposer. Cette étape écrit l'entrée dans le run même qui
      # crée le profil, ce qui est aussi la seule façon de rendre le gel du
      # slug effectif : la table passe devant la fabrication (#708 §3), donc
      # elle doit exister avant la publication, pas après.
      #
      # `if: hashFiles(...)` sur le FICHIER, comme le step de normalisation
      # roster ci-dessus (#524) : sans roster il n'y a aucun slug fabriqué, et
      # la branche est sautée sans que rien n'échoue.
      #
      # HORS LIGNE, et c'est la raison du `--completer-derivees` plutôt que du
      # constructeur complet : celui-ci télécharge AMO30, et une panne de
      # source à cet endroit coûterait le commit d'un run dont la donnée est
      # bonne — ce que #524 interdit.
      #
      # Code 1 = un refus nommé (le profil publié ne corrobore pas l'acteur que
      # le roster déclare). On ne le rattrape pas : la §5b bloquerait de toute
      # façon trois steps plus bas, et échouer ici nomme la cause.
      - name: Correspondance — entrées dérivées des slugs fabriqués (#715)
        if: ${{ hashFiles('raw_data/rosters_bruts.json') != '' }}
        run: |
          python3 src/build_correspondance_acteurs_an.py \
            --completer-derivees \
            --rosters-bruts raw_data/rosters_bruts.json \
            --profiles-dir pivot_data/profiles

      # Sa jumelle pour les candidats déclarés (#757). Mêmes propriétés —
      # additive, hors ligne, disjointe — et même conditionnement sur le
      # FICHIER : sans résolutions, aucun slug n'a été fabriqué, donc il n'y a
      # rien à écrire et la branche est sautée sans que rien n'échoue.
      #
      # Code 1 = un refus nommé : l'identifiant externe et le profil publié ne
      # disent pas la même chose. On ne le rattrape pas — la §5b bloquerait
      # trois steps plus bas, et échouer ici nomme la cause.
      - name: Correspondance — entrées sourcées des candidats déclarés (#757)
        if: ${{ hashFiles('raw_data/resolutions_candidats.json') != '' }}
        run: |
          python3 src/build_correspondance_acteurs_an.py \
            --completer-candidats \
            --resolutions raw_data/resolutions_candidats.json \
            --profiles-dir pivot_data/profiles

      # inputs.incomplete_read_threshold appliqué dans tous les modes (y compris cold_start=true).
      # §5 ParlTrack : --parltrack-status-file active la section de rapport
      #   enrichi ce run vs fallback (nb candidats dans chaque catégorie).
      - name: Quality gate — résumé et contrôle qualité
        env:
          THRESHOLD: ${{ inputs.incomplete_read_threshold }}
        run: |
          # inputs.incomplete_read_threshold a un défaut déclaré de 3 ; traitement du défaut en
          # bash pour éviter que GHA évalue 0 comme falsy (0 || 3 → 3).
          GATE_THRESHOLD="${THRESHOLD:-3}"
          python3 src/check_quality_gate.py \
            --profiles-dir      pivot_data/profiles \
            --groupes-dir       pivot_data/groupes \
            --raw-dir           raw_data/profiles \
            --candidats         raw_data/candidats.json \
            --groupes-config    raw_data/groupes_reels.json \
            --gouvernements-dir    pivot_data/gouvernements \
            --gouvernements-config raw_data/gouvernements_reels.json \
            --threshold         "$GATE_THRESHOLD" \
            --low-interventions 10 \
            --groupe-min-members 1 \
            --parltrack-status-file parltrack-status.json
          # --groupe-min-coverage-pct : seuil de couverture RELATIF, optionnel,
          # défaut 0 = désactivé. Volontairement non passé ici (#413 §7). #193
          # (close) demandait de le calibrer « en fonction des résultats réels » ;
          # la décision prise en réponse est [[seuil-couverture-groupe]] :
          # conserver --groupe-min-members 1 et n'activer le seuil relatif QUE
          # lorsqu'un run à pleine échelle (roster_limit=0, ~750
          # membres) aura fourni des taux de couverture représentatifs. Les
          # chiffres à regarder pour trancher : taux_couverture_pct dans
          # coherence.ecart_couverture_roster (audit_groupe_dataset.py). Ce
          # n'est donc pas un réglage en attente d'arbitrage, mais une activation
          # en attente d'une donnée précise.
          #
          # Amendements (§3c/§3d) : aucun flag d'escalade n'est passé — il n'en
          # existe pas. « 0 amendement collecté » et « index jamais construit »
          # restent des signaux NON bloquants dans tous les modes, y compris
          # cold_start=true, et sont affichés en tête du rapport plutôt que
          # d'échouer le run (#378, arbitrage tranché dans
          # docs/decisions/amendements-zero-pas-de-hard-fail.md :
          # la collecte dépend d'un CDN AN chroniquement défaillant sur la
          # législature 17, bloquer ferait perdre tout le reste du run).

      # Garde-fou #390 : ne JAMAIS committer un build produit avec du code
      # périmé.
      #
      # actions/checkout fige le SHA de main au déclenchement du run, alors que
      # ce job ne démarre qu'après les 5 jobs d'extraction (20+ min plus tard).
      # Si une PR touchant src/ est mergée dans cette fenêtre, tout ce que ce
      # job vient de dériver (pivots, groupes, gouvernements) l'a été
      # avec l'ANCIEN code de génération. Committer ce résultat publierait de
      # la donnée fausse — et potentiellement en silence, si git parvient à
      # merger sans conflit. Vécu sur le run #266, où seul un conflit de rebase
      # a empêché d'écraser le correctif #379 par des groupes régénérés avec le
      # code d'avant ce correctif.
      #
      # Asymétrie qui fonde ce choix : ne rien committer coûte un run, et toute
      # la donnée dérivée est régénérable ; committer un build périmé publie
      # une erreur. Refuser de committer est donc le défaut, pas le cas
      # d'échec.
      #
      # PÉRIMÈTRE (#413 §3) : le code de génération (`src/`) ET les fichiers de
      # CONFIGURATION qui sont des ENTRÉES du build (raw_data/*.json hors
      # raw_data/profiles/ : candidats, groupes_reels, gouvernements_reels).
      # La condition ne couvrait que `src/`, au motif qu'« un commit de doc ou
      # de données ne doit rien déclencher » — ce qui confondait deux natures de
      # données : les données DÉRIVÉES (raw_data/profiles/, pivot_data/),
      # régénérées par ce job et dont le conflit est traité par la boucle de
      # rebase du push (#389), et les données de CONFIGURATION, qui pilotent la
      # génération. Un merge modifiant groupes_reels.json pendant le run faisait
      # committer des groupes générés avec l'ANCIENNE config, sans alerte —
      # exactement le défaut que #390 veut empêcher.
      #
      # `:(exclude)raw_data/profiles/` est indispensable : dans un pathspec git,
      # `*` traverse les répertoires, donc `raw_data/*.json` seul matcherait les
      # ~750 profils bruts régénérés à chaque run et le garde-fou se
      # déclencherait sur tout commit de données.
      # ── Contrôle de perte avant commit (#460) ─────────────────────────────
      # Le 19/08/2026, le run 32288588518 a effacé les 789 interventions du
      # corpus, et avec elles 647 tags_thematiques et 497 tags agrégés — des
      # champs PUBLIÉS. Personne ne l'a vu.
      #
      # Ce n'est pas un défaut de collecte : `collect_interventions=false` a
      # sauté la collecte (voulu, mode rapide) et `existing_profiles=overwrite` a
      # réécrit les profils sans elles (voulu aussi, c'est ce qui propage une
      # correction de clé). Deux comportements corrects dont la combinaison
      # détruit une donnée acquise — et qui ne se voit qu'en comparant l'avant
      # et l'après.
      #
      # La quality gate ne pouvait pas l'attraper : elle mesure un NIVEAU, pas
      # une VARIATION. Sa §3 a bien affiché « 209 profils sous le seuil » — sur
      # 209 profils. Un signal qui se déclenche sur tout le corpus ne dit rien
      # de ce qui a changé, et un profil à 0 intervention est indiscernable,
      # pour elle, selon qu'il n'en a jamais eu ou qu'il vient d'en perdre 789.
      #
      # `audit_diff_profils.py` mesure la variation, profil par profil et champ
      # par champ. Il existait, il était documenté « indispensable avant tout
      # commit de régénération » (#429) — et il n'était appelé par aucun
      # workflow ni aucun script. C'est cet appel manquant.
      #
      # `--ref HEAD` et non `origin/main` : HEAD est le commit que ce job a
      # checkouté, donc exactement l'état d'AVANT ce run. C'est aussi le seul
      # qui marche avec le `fetch-depth: 1` par défaut d'actions/checkout, et le
      # seul juste sur un run lancé hors main (même raison qu'au garde-fou
      # ci-dessous, #413 §2).
      #
      # Échec DUR par défaut : le step suivant ne s'exécute pas, donc rien n'est
      # committé ni déployé. Une perte doit être déclarée, jamais subie —
      # `allow_declared_losses` existe pour la déclarer explicitement, et son
      # emploi laisse une trace dans les inputs du run.
      #
      # PÉRIMÈTRE ÉTENDU PAR #470 : `--pivot-dir` ajoute aux profils les quatre
      # autres couches publiées et les deux index partagés. Les deux pertes qui
      # ont motivé cette extension étaient hors de portée du périmètre
      # d'origine, ALORS QUE CE STEP TOURNAIT — la cohésion de vote de SOC-16
      # tombée de 814 à 0 (un dénominateur publié, AGENTS.md §2.7) et `parti`
      # passé de renseigné à null sur trois profils, un scalaire qu'un contrôle
      # de longueurs de listes ne voit pas.
      - name: Contrôle de perte sur pivot_data (avant commit)
        env:
          TOLERER: ${{ inputs.allow_declared_losses }}
        run: |
          TOLERANCE=()
          if [[ "$TOLERER" == "true" ]]; then
            echo "::warning::allow_declared_losses=true — une perte bloquante ne bloquera pas le commit. À n'employer qu'après avoir élucidé chaque perte (#460)."
            TOLERANCE=(--tolerer-pertes)
          fi
          python3 src/audit_diff_profils.py \
            --ref HEAD \
            --profils-dir pivot_data/profiles \
            --pivot-dir pivot_data \
            --out diff-profils.md \
            --out-json diff-profils.json \
            "${TOLERANCE[@]}" || CODE=$?
          # Le rapport est joint au résumé de job DANS TOUS LES CAS : c'est en
          # échec qu'on en a le plus besoin, et un artifact qu'il faut aller
          # télécharger ne serait pas lu.
          {
            echo "### Contrôle de perte sur pivot_data (#460, étendu par #470)"
            echo ""
            cat diff-profils.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CODE:-0}" -ne 0 ]]; then
            echo "::error::PERTE_PROFILS_NON_DECLAREE — au moins un fichier de pivot_data a disparu, a perdu des entrées sur une liste stable (votes, mandats, textes portés, interventions, tags thématiques, membres, cohésion de vote, mandats agrégés, candidats, textes), ou a vu un scalaire surveillé passer de renseigné à null (parti, groupe, chambre, identite, premier_ministre…). Commit annulé. Voir le résumé de job. Si la perte est voulue, relancer avec allow_declared_losses=true (#460, #470)."
            exit 1
          fi

      - name: Rapport de perte — artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diff-profils
          path: |
            diff-profils.md
            diff-profils.json
          if-no-files-found: ignore

      # ── Intégrité référentielle avant commit (#485) ────────────────────────
      # CONTRÔLE DE NATURE DIFFÉRENTE du précédent, et c'est pourquoi il est un
      # step à part et non une option de celui-ci. `audit_diff_profils` compare
      # un AVANT et un APRÈS : il verrait une chute du nombre d'entrées d'un
      # index, mais pas une rupture de correspondance entre deux couches du MÊME
      # état. Un run où les profils et l'index seraient tous deux régénérés de
      # façon cohérente-mais-fausse — convention de clé changée des deux côtés —
      # lui paraîtrait irréprochable. Invariance dans un état donné, pas
      # variation dans le temps.
      #
      # POURQUOI ICI. Depuis #432 (votes) et #431 (amendements), un profil ne
      # garde qu'une CLÉ et le détail vit dans un index partagé : un vote n'a
      # plus de sens que si sa clé résout. Trois façons de casser ça sans qu'un
      # compteur bouge — clé qui ne résout pas, convention changée, index publié
      # partiellement (échec de shard). Le troisième n'est pas théorique : c'est
      # ce que #450 faisait aux profils, et #465 a montré qu'une sous-collecte
      # en échec s'écrit comme une collecte vide.
      #
      # ORDRE DES STEPS : les deux index sont écrits par les passes
      # `generate_all_profiles.py --pivot-only` ci-dessus (scrutins avant la
      # boucle, amendements après), et `cohesion_votes` par la génération des
      # profils de groupe. Les trois couches référençantes et les deux index
      # sont donc sur le disque quand ce step tourne. Le vérifier plus tôt
      # contrôlerait un état que le run n'a pas fini d'écrire.
      #
      # DRAPEAU DISTINCT, DÉLIBÉRÉMENT. `allow_declared_losses` ne désarme PAS
      # ce contrôle et ne doit jamais le faire : #470 a documenté le piège —
      # rendre bloquant un contrôle grossier force l'opérateur à relancer avec
      # la tolérance, ce qui désarme du même coup les contrôles précis. Une
      # perte peut être légitime et se déclare ; une référence orpheline n'a
      # aucune explication légitime (AGENTS.md §2.5). `allow_broken_references`
      # n'existe que pour qu'une panne de cet outil ne bloque pas indéfiniment
      # toute publication, jamais comme mode d'exploitation.
      #
      # COÛT : 3,02 s / 162,0 Mio mesurés sur les 209 profils, ~7,7 s projetées
      # à 752 (la RSS, elle, ne bouge pas : elle est fixée par les index, déjà
      # à pleine échelle). Processus séparé du contrôle de perte : le pic du job
      # reste celui du plus coûteux des deux, soit 186,6 Mio, sous les 236
      # actés par #460.
      - name: Intégrité référentielle de pivot_data (avant commit)
        env:
          TOLERER: ${{ inputs.allow_broken_references }}
        run: |
          TOLERANCE=()
          if [[ "$TOLERER" == "true" ]]; then
            echo "::warning::allow_broken_references=true — des votes ou des amendements publiés sans objet ne bloqueront pas le commit. Ce drapeau n'a pas de cas d'emploi normal (#485)."
            TOLERANCE=(--tolerer-orphelins)
          fi
          python3 src/audit_integrite_referentielle.py \
            --pivot-dir pivot_data \
            --out integrite-referentielle.md \
            --out-json integrite-referentielle.json \
            "${TOLERANCE[@]}" || CODE=$?
          # Joint au résumé DANS TOUS LES CAS, même raison qu'au step précédent :
          # c'est en échec qu'on en a le plus besoin.
          {
            echo "### Intégrité référentielle de pivot_data (#485)"
            echo ""
            cat integrite-referentielle.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CODE:-0}" -ne 0 ]]; then
            echo "::error::REFERENCES_ORPHELINES — au moins une clé publiée (votes[].scrutin_id, cohesion_votes[].scrutin_id, amendements[].amendement_id) ne résout pas dans son index partagé, ou l'index/le shard visé est absent. Ce serait un vote ou un amendement publié SANS OBJET, et pour un groupe un dénominateur faux (AGENTS.md §2.5, §2.7). Commit annulé. Le fichier et la clé fautifs sont nommés dans le résumé de job."
            exit 1
          fi

      - name: Rapport d'intégrité référentielle — artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integrite-referentielle
          path: |
            integrite-referentielle.md
            integrite-referentielle.json
          if-no-files-found: ignore

      # ── Collecté mais non publié, avant commit (#511) ──────────────────────
      # TROISIÈME ANGLE, et c'est pourquoi c'est un step de plus et non une
      # option des deux précédents :
      #   - le contrôle de perte compare un AVANT et un APRÈS. Un profil brut
      #     qui n'a JAMAIS eu de pivot ne lui apparaît pas : rien n'a été perdu,
      #     les deux compteurs montent, seule la correspondance manque ;
      #   - l'intégrité référentielle vérifie que les clés PUBLIÉES résolvent.
      #     Ce qui n'a jamais été publié ne porte aucune clé.
      # Run 32405297873 (20/08/2026), conclusion `success` : un `Read timed out`
      # a fait écrire un roster de 0 candidat, la passe pivot roster a itéré sur
      # le vide, et `68bc094` a été commité avec 229 profils bruts pour 209
      # pivots. Les 20 membres collectés par ce run (jusqu'à 3 536 votes chacun)
      # ne sont publiés nulle part, sans un seul signal.
      #
      # ORDRE DES STEPS : après les DEUX passes `generate_all_profiles.py
      # --pivot-only` — celle de `raw_data/candidats.json` et celle de
      # `raw_data/roster_candidats.json`. Placé avant, il signalerait un écart
      # qui n'existe pas encore : entre les deux passes, tout membre de roster
      # est légitimement sans pivot. Vérifié par
      # tests/test_ci_collecte_non_publiee.py.
      #
      # SEUIL 0, MESURÉ. Sur les 12 commits produits par un run generate-data
      # entre 604c8d6 (16/08) et e82406a (20/08), l'écart brut/pivot est 0 à
      # chaque fois, pendant que le corpus passait de 48 à 209 profils. Ce n'est
      # pas une valeur basse, c'est une invariance — et un profil brut est
      # toujours normalisable (`process_candidat` n'écrit rien quand la collecte
      # ne rend ni identité FR ni mandat UE).
      #
      # COÛT : 0,05 s / 13,7 Mio mesurés à 229 profils, 0,08 s / 13,9 Mio
      # MESURÉS à 752 (doublure de 752+752 noms de fichiers) — pas projetés. Ce
      # contrôle ne parse aucun profil : il compare deux listes de NOMS de
      # fichiers, seule façon de tenir 1 642 Mo de profils bruts à mémoire
      # bornée. Processus séparé des deux précédents : le pic du job reste celui
      # du plus coûteux, le contrôle de perte (186,6 Mio à #485), sous les 236
      # actés par #460.
      #
      # DRAPEAU DISTINCT, comme pour #485 : ni `allow_declared_losses` ni
      # `allow_broken_references` ne désarme celui-ci. #470 a documenté le piège
      # — un contrôle grossier rendu bloquant force à relancer avec la
      # tolérance, ce qui désarme du même coup les contrôles précis.
      - name: Collecté mais non publié (avant commit)
        env:
          TOLERER: ${{ inputs.allow_unpublished_profiles }}
        run: |
          TOLERANCE=()
          if [[ "$TOLERER" == "true" ]]; then
            echo "::warning::allow_unpublished_profiles=true — des profils collectés resteront publiés nulle part. À n'employer qu'après avoir élucidé chaque écart (#511)."
            TOLERANCE=(--tolerer-non-publies)
          fi
          python3 src/audit_collecte_non_publiee.py \
            --raw-dir raw_data/profiles \
            --pivot-dir pivot_data/profiles \
            --out collecte-non-publiee.md \
            --out-json collecte-non-publiee.json \
            "${TOLERANCE[@]}" || CODE=$?
          # Joint au résumé DANS TOUS LES CAS, même raison que les deux steps
          # précédents : c'est en échec qu'on en a le plus besoin.
          {
            echo "### Collecté mais non publié (#511)"
            echo ""
            cat collecte-non-publiee.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CODE:-0}" -ne 0 ]]; then
            echo "::error::COLLECTE_NON_PUBLIEE — au moins un profil de raw_data/profiles/ n'a pas de pivot dans pivot_data/profiles/. Il a été collecté (identité, mandats, votes) et n'atteint aucune vue : une passe pivot a itéré sur moins que ce que ce run a collecté. Commit annulé. Les slugs sont nommés dans le résumé de job (#511)."
            exit 1
          fi

      - name: Rapport collecté/non publié — artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collecte-non-publiee
          path: |
            collecte-non-publiee.md
            collecte-non-publiee.json
          if-no-files-found: ignore

      # ── Collecté vs publié, LISTE PAR LISTE, avant commit (#545) ───────────
      # QUATRIÈME ANGLE, et c'est pourquoi c'est un step de plus et non une
      # option des trois précédents. Aucun des trois n'était en défaut ; c'est
      # l'espace ENTRE eux qui n'était pas couvert :
      #   - le contrôle de perte (#460/#470) surveille les PERTES entre une
      #     référence git et le disque. Une publication qui *augmente* n'est pas
      #     une perte : les deux compteurs montent, et il ne bloque pas ;
      #   - « collecté mais non publié » (#511) vérifie qu'un profil collecté a
      #     un pivot. Il raisonne sur des PROFILS, jamais sur le contenu de
      #     leurs listes : un pivot présent mais vidé de ses interventions lui
      #     est irréprochable ;
      #   - l'intégrité référentielle (#485) vérifie qu'une clé résout. Elle ne
      #     COMPTE rien : 891 clés qui résolvent toutes lui valent autant que
      #     16 242.
      # Run 33100214165 (27/08/2026), conclusion `success` : la clé de fusion
      # pivot des interventions prenait l'URL d'archive Syceron pour un
      # identifiant (#540). 7 767 interventions collectées, 891 publiées, les
      # trois garde-fous verts, le commit parti. Vu à la relecture manuelle.
      #
      # LA TABLE DE RELATIONS EST LE CŒUR DU CONTRÔLE. Un « le pivot doit porter
      # autant que le brut » naïf crierait à tort sur deux champs sur cinq :
      # `dossiers_legislatifs` est RENOMMÉ en `textes_portes` (−472 et +472 pour
      # zéro défaut) et `mandats` reçoit dans le pivot les mandats européens que
      # le brut range sous `mandat_europeen.mandats_europeens` (+278). Chaque
      # liste publiée déclare donc les chemins du brut dont elle est la somme —
      # l'apport européen est une SOURCE nommée, pas une marge tolérée, et c'est
      # ce qui permet de garder le seuil à 0 partout.
      #
      # ORDRE DES STEPS : après les DEUX passes `generate_all_profiles.py
      # --pivot-only`, comme #511 et pour la même raison — entre les deux, un
      # membre de roster est légitimement sans pivot. Vérifié par
      # tests/test_ci_collecte_vs_publie.py.
      #
      # SEUIL 0, MESURÉ. Sur les 476 profils de `3104e37` (run 33110395663,
      # premier run complet après le correctif de #540) : 0 déficit ET 0
      # excédent sur les 2 380 couples (profil, relation). Rejoué sur l'état
      # d'avant (`deb28a7`, mêmes 476 profils), le contrôle sort en erreur et
      # nomme les cinq profils en déficit — gabriel-attal 3 351 → 17,
      # marine-le-pen 2 247 → 384, jerome-guedj 1 083 → 396, laurent-wauquiez
      # 535 → 23, bruno-retailleau 486 → 6.
      #
      # COÛT : 58,7 s / 158,2 Mio mesurés sur les 476 profils bruts (4,3 Go) et
      # leurs pivots (360 Mo). Il faut LIRE les bruts — c'est ce qui distingue
      # ce contrôle de #511, qui ne compare que des noms de fichiers — mais
      # aucun profil n'est matérialisé : un `object_pairs_hook` ne retient que
      # les clés de la table, ce qui ramène le plus gros profil de 186,3 à
      # 96,0 Mio. Sous les 236 Mio actés par #460, et processus séparé des trois
      # autres contrôles.
      #
      # DRAPEAU DISTINCT, comme pour #485 et #511 : aucune des trois autres
      # tolérances ne désarme celle-ci. #470 a documenté le piège — un contrôle
      # grossier rendu bloquant force à relancer avec la tolérance, ce qui
      # désarme du même coup les contrôles précis.
      - name: Collecté vs publié, liste par liste (avant commit)
        env:
          TOLERER: ${{ inputs.allow_publication_gaps }}
        run: |
          TOLERANCE=()
          if [[ "$TOLERER" == "true" ]]; then
            echo "::warning::allow_publication_gaps=true — des entrées collectées resteront publiées nulle part. À n'employer qu'après avoir élucidé chaque écart (#545)."
            TOLERANCE=(--tolerer-ecarts)
          fi
          python3 src/audit_collecte_vs_publie.py \
            --raw-dir raw_data/profiles \
            --pivot-dir pivot_data/profiles \
            --out collecte-vs-publie.md \
            --out-json collecte-vs-publie.json \
            "${TOLERANCE[@]}" || CODE=$?
          # Joint au résumé DANS TOUS LES CAS, même raison que les trois steps
          # précédents : c'est en échec qu'on en a le plus besoin.
          {
            echo "### Collecté vs publié, liste par liste (#545)"
            echo ""
            cat collecte-vs-publie.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CODE:-0}" -ne 0 ]]; then
            echo "::error::ECART_COLLECTE_PUBLICATION — au moins une liste publiée (votes, amendements, interventions, textes_portes, mandats) porte MOINS d'entrées que ce que la collecte a rendu pour ce profil. La donnée est dans raw_data/profiles/ et n'atteint aucune vue : c'est le défaut de #540, où 7 767 interventions collectées n'en publiaient que 891. Commit annulé. Les profils et les deux comptes sont nommés dans le résumé de job (#545)."
            exit 1
          fi

      - name: Rapport collecté/publié — artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collecte-vs-publie
          path: |
            collecte-vs-publie.md
            collecte-vs-publie.json
          if-no-files-found: ignore

      #
      # BRANCHE COMPARÉE (#413 §2) : celle du run (`github.ref_name`), pas
      # `main` en dur. Ce workflow est déclenchable par workflow_dispatch sur
      # n'importe quelle ref, et retry-generate-data.yml propage explicitement
      # `--ref "${{ github.event.workflow_run.head_branch }}"`. Sur un run lancé
      # depuis dev ou une branche de worktree, `$BASE_SHA` est le HEAD de CETTE
      # branche : le diff contre origin/main remontait alors TOUTES les
      # différences entre la branche et main, pas les commits arrivés pendant le
      # run. Conséquence observable : commit toujours annulé, retry automatique
      # déclenché, qui échouait à l'identique — un run hors main ne pouvait
      # jamais committer, pour une raison étrangère au motif de #390.
      - name: Vérifier que le code de génération n'a pas changé pendant le run
        env:
          BASE_SHA: ${{ github.sha }}
          # Via env: et pas en substitution directe dans le script — le nom de
          # branche est une donnée contrôlable par qui déclenche le run.
          RUN_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Entrées du build surveillées. Modifier cette liste suffit : elle
          # n'est dupliquée nulle part ailleurs.
          BUILD_INPUTS=(src/ 'raw_data/*.json' ':(exclude)raw_data/profiles/')

          git fetch origin "$RUN_REF" --quiet
          if git diff --quiet "$BASE_SHA" "origin/$RUN_REF" -- "${BUILD_INPUTS[@]}"; then
            echo "✓ Entrées du build inchangées sur origin/$RUN_REF depuis le début du run — commit sûr."
            exit 0
          fi
          echo "Entrées du build modifiées sur origin/$RUN_REF pendant ce run :"
          git diff --name-only "$BASE_SHA" "origin/$RUN_REF" -- "${BUILD_INPUTS[@]}" | sed 's/^/  - /'
          {
            echo "### ⛔ Commit annulé — entrées du build modifiées pendant le run"
            echo ""
            echo "\`src/\` ou un fichier de configuration (\`raw_data/*.json\`) a changé"
            echo "sur \`origin/$RUN_REF\` depuis le SHA sur lequel ce job a été checkouté"
            echo "(\`$BASE_SHA\`). Les fichiers dérivés produits ici l'ont donc été avec"
            echo "du code ou une configuration périmés : les committer publierait de la"
            echo "donnée potentiellement fausse (voir #390, périmètre étendu en #413)."
            echo ""
            echo "Aucune donnée n'est perdue — tout est régénérable. Un nouveau run"
            echo "sur \`$RUN_REF\` à jour produira un résultat cohérent."
          } >> "$GITHUB_STEP_SUMMARY"
          # Marqueur greppable par retry-generate-data.yml, distinct de la
          # signature de préemption runner, pour que le diagnostic de la
          # relance reste lisible. Texte conservé à l'identique : le retry le
          # cherche littéralement.
          echo "::error::GENERATION_CODE_CHANGED_DURING_RUN — src/ ou configuration raw_data/*.json modifié sur origin/$RUN_REF pendant le run ; commit annulé pour ne pas publier un build périmé (#390/#413)."
          exit 1

      # `pushed` (output) : consommé par l'étape de déploiement ci-dessous, qui
      # ne doit partir que si des données ont réellement atterri sur main.
      # Écrit avant chaque `exit 0` — un `exit` termine le step immédiatement,
      # un output posé après ne serait jamais écrit.
      # RUN DE TEST : ON NE COMMITTE PAS. C'est l'effet le plus important du
      # champ, et le seul qui ne se rattrape pas : un run à périmètre réduit
      # publierait un corpus dont on SAIT qu'il est partiel. Les quatre
      # garde-fous d'avant-commit, eux, tournent quand même — c'est précisément
      # ce qu'un run de test vient exercer.
      #
      # Les deux étapes qui suivent (signal `tests.yml` #685, déclenchement de
      # `deploy-pages` #416) se sautent d'elles-mêmes : elles lisent
      # `steps.commit.outputs.pushed`, qui reste vide quand ce step ne tourne
      # pas. Rien à conditionner en double.
      - name: Run de test — commit désarmé
        if: ${{ inputs.test_slugs != '' }}
        run: |
          echo "::notice::RUN_DE_TEST — les données NE SONT PAS committées (périmètre réduit à : ${{ inputs.test_slugs }}). Les garde-fous d'avant-commit ont tourné et leur verdict est au-dessus."
          {
            echo "### 🧪 Run de test — rien n'a été committé"
            echo
            echo "Périmètre demandé : \`${{ inputs.test_slugs }}\`"
            echo
            echo "Les quatre contrôles d'avant-commit ont tourné normalement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer et pousser les données mises à jour
        id: commit
        if: ${{ inputs.test_slugs == '' }}
        env:
          # Même raison que sur le garde-fou ci-dessus (#413 §2) : le rebase de
          # la boucle de retry doit viser la branche du run, pas main en dur.
          RUN_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Les index partagés font partie des données : sans eux, les mappings
          # des profils (#432 votes, #431 amendements) pointent dans le vide et
          # les vues se vident sans erreur visible. `scrutins.json` manquait
          # ici depuis #432 — constaté et corrigé en même temps que l'ajout
          # d'`amendements/`, la panne aurait été la même.
          # `raw_data/correspondance_acteurs_an.json` (#715) : la table fait
          # partie des données depuis que le step ci-dessus l'étend. Sans elle
          # dans le `git add`, l'entrée dérivée serait réécrite à chaque run et
          # le gel du slug qu'elle est censée produire n'existerait pas — même
          # classe de panne que les index partagés absents du commit (AGENTS §3a).
          # `raw_data/candidats.json` (#757) : la liste est rafraîchie par le job
          # de tête et voyage en artifact ; sans elle dans le `git add`, le
          # périmètre serait recalculé à chaque run sans jamais être conservé,
          # et les slugs fabriqués seraient refabriqués — donc jamais gelés.
          # `resolutions_candidats.json` N'entre PAS : c'est un intermédiaire de
          # run, comme `rosters_bruts.json`, et le committer ferait bouger un
          # fichier à chaque exécution sans que personne ne le lise.
          git add raw_data/candidats.json raw_data/profiles raw_data/correspondance_acteurs_an.json raw_data/gouvernements_reels.json pivot_data/profiles pivot_data/groupes pivot_data/gouvernements pivot_data/scrutins.json pivot_data/scrutins_europeens.json pivot_data/dossiers_europeens.json pivot_data/documents_europeens.json pivot_data/amendements
          # Table des commissions saisies au fond (#328), ajoutée seulement si
          # elle existe : `git add` sur un chemin absent échoue, et le step qui
          # la produit est non bloquant. Un run sans archive lisible ne doit pas
          # coûter le commit des profils, qui sont corrects.
          # Fiches de lignée (#836), ajoutées seulement si le répertoire
          # existe : le step qui les produit est non bloquant, et `git add` sur
          # un chemin absent échoue.
          if [ -d pivot_data/lignees ]; then
            git add pivot_data/lignees
          fi
          if [ -f pivot_data/commissions_dossiers.json ]; then
            git add pivot_data/commissions_dossiers.json
          fi
          # Même garde pour le rattachement scrutin → dossier (#758) : l'étape
          # qui le construit est `continue-on-error`, le fichier peut manquer.
          if [ -f pivot_data/scrutins_dossiers.json ]; then
            git add pivot_data/scrutins_dossiers.json
          fi
          if git diff --cached --quiet; then
            echo "Aucun changement de données à committer."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: mise à jour automatique des données ($(date -u +%Y-%m-%d))"

          # actions/checkout sur workflow_dispatch fige le SHA de la ref au moment
          # du déclenchement du run, pas au démarrage de ce job — et ce job ne
          # démarre qu'après les 5 jobs d'extraction (needs), qui peuvent prendre
          # 20+ min (extraction séquentielle, cf. #222). Tout commit humain ou
          # automatisé atterrissant sur cette branche dans la fenêtre fait échouer
          # un simple `git push` (non fast-forward) alors que la donnée collectée
          # est valide — vécu sur le run #29 (rejeté par un commit doc poussé
          # pendant le run). Rebase + retry au lieu d'échouer tout le job sur une
          # donnée déjà committée localement.
          #
          # Rebase sur la BRANCHE DU RUN (#413 §2), pas sur main en dur : même
          # défaut que le garde-fou ci-dessus, en plus grave ici — sur un run
          # lancé hors main, `git rebase origin/main` rejouait le commit de
          # données par-dessus main au lieu de la branche poussée.
          #
          # `set +e` sur la portée de la boucle (#389) : ce step s'exécute avec
          # `bash -e {0}` (aucun `defaults: shell` déclaré dans ce workflow), donc
          # le premier `git rebase` en conflit terminait immédiatement le step —
          # les tentatives 2 et 3 ne s'exécutaient jamais, et le message d'erreur
          # final n'était jamais atteint. Constaté sur le run #266 : une seule
          # ligne « tentative 1/3 » dans le log, puis sortie en échec.
          #
          # `push.log` (#508) : la sortie du push est capturée pour être RELUE,
          # pas seulement affichée. Le 20/08/2026, le serveur a nommé la cause
          # exacte du rejet — `Required status check "Suite complète" is
          # expected` — et ce step a conclu « concurrence soutenue » : le
          # diagnostic publié contredisait la ligne imprimée trois lignes plus
          # haut. Un rejet de RÈGLE n'est pas un rejet de CONCURRENCE ; il ne
          # cède pas au rebase, et reboucler dessus ne fait que le répéter
          # (trois tentatives, trois fois la même erreur, 30 s perdues).
          #
          # Écrit dans RUNNER_TEMP et pas dans l'arbre de travail : un fichier
          # non suivi de plus dans le dépôt pendant un `git rebase --autostash`
          # est une complication gratuite.
          #
          # `git push >log 2>&1` puis test de `$?` plutôt qu'un pipe vers tee :
          # dans `if git push | tee log`, le statut testé est celui de `tee`,
          # donc toujours 0 — le rejet passerait pour un succès.
          set +e
          push_status=""
          push_log="${RUNNER_TEMP:-/tmp}/push.log"
          for attempt in 1 2 3; do
            git push >"$push_log" 2>&1
            push_code=$?
            cat "$push_log"
            if [ "$push_code" -eq 0 ]; then
              echo "Push réussi (tentative ${attempt}/3)."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Rejet par une règle de dépôt : sortie immédiate, la boucle n'a
            # rien à y gagner. GH013 est le code que GitHub renvoie pour toute
            # violation de ruleset ; le libellé anglais est cherché en second
            # au cas où le code changerait de forme.
            if grep -qi 'GH013\|repository rule violations' "$push_log"; then
              push_status="regle"
              break
            fi
            echo "Push rejeté (tentative ${attempt}/3) — rebase sur origin/${RUN_REF} et nouvel essai."
            git fetch origin "$RUN_REF"
            if ! git rebase --autostash "origin/$RUN_REF"; then
              # Un conflit de rebase ne se résoudra jamais en rebouclant : les
              # deux côtés ont réécrit les mêmes fichiers générés (cas du run
              # #266, cause traitée dans #390). On sort tout de suite, après
              # avoir rendu le dépôt propre — un rebase inachevé bloquerait
              # toute logique ajoutée ensuite.
              git rebase --abort || true
              push_status="conflit"
              break
            fi
          done
          set -e

          if [ "$push_status" = "regle" ]; then
            echo "::error::Push refusé par une règle du dépôt (GH013), pas par de la concurrence — la ligne \`remote:\` ci-dessus nomme la règle. Un rebase n'y peut rien. Si c'est un check requis : ce job pousse sans PR, aucun check ne peut être attaché à son commit ; vérifier que le secret DATA_PUSH_SSH_KEY est renseigné et que la clé de déploiement correspondante figure bien dans les bypass_actors du ruleset (#508, docs/decisions/push-donnees-cle-de-deploiement-508.md)."
          elif [ "$push_status" = "conflit" ]; then
            echo "::error::Conflit de rebase sur les fichiers générés — un retry ne peut pas le résoudre. Les deux côtés ont régénéré les mêmes fichiers (voir #390). Intervention manuelle requise."
          else
            echo "::error::Push toujours rejeté après 3 tentatives, rebases réussis — concurrence soutenue sur ${RUN_REF}. Intervention manuelle requise."
          fi
          exit 1

      # ── Le push a-t-il émis un événement `push` ? (#685) ──────────────────
      # POURQUOI CE STEP EXISTE. `AGENTS.md` §3b affirmait, au titre de #508 :
      # « A deploy-key push emits a `push` event, so `tests.yml` really runs on
      # data commits. » Mesuré le 01/09/2026 : sur les **15** commits de
      # données arrivés sur `main` depuis que `tests.yml` existe (20/08/2026),
      # **aucun** ne porte de run de la suite — dont les **11** postérieurs à
      # #508. Le dépôt n'a AUCUNE clé de déploiement (`GET /repos/{o}/{r}/keys`
      # rend `[]`) et le secret `DATA_PUSH_SSH_KEY` n'existe pas : `ssh-key`
      # vaut la chaîne vide, `actions/checkout` retombe sur le GITHUB_TOKEN en
      # HTTPS, et un push sous le GITHUB_TOKEN n'émet aucun événement
      # (protection anti-boucle des workflows).
      #
      # CE QUI A RENDU LA PANNE INVISIBLE quinze commits durant, ce n'est pas
      # le repli — il est documenté et voulu — c'est qu'il est MUET. Le « rejet
      # bruyant » que #508 promet ne parle que sur un `GH013`, lequel suppose
      # le check requis… qui n'a jamais été rétabli non plus. Les deux gestes
      # omis se couvrent l'un l'autre : le push passe, et rien ne dit que la
      # suite ne tournera pas.
      #
      # CE QUI EST MESURÉ, ET PAS DEVINÉ : l'URL du dépôt distant telle que le
      # push vient réellement de l'employer. `actions/checkout` pose
      # `git@github.com:` quand `ssh-key` est renseignée, `https://github.com/`
      # sinon — tester `secrets.DATA_PUSH_SSH_KEY != ''` serait un indice sur
      # l'intention, ceci est le fait sur l'exécution.
      #
      # NON BLOQUANT DÉLIBÉRÉMENT : les trois gestes qui répareraient le
      # mécanisme (clé de déploiement, secret, check requis) vivent hors du
      # dépôt et hors de portée d'un run. Faire échouer le job priverait le
      # site de ses données fraîches pour une configuration que seule une
      # humaine peut poser. Un signal, donc, et sur les deux canaux qui se
      # relisent : l'annotation du run et le résumé du job.
      #
      # Voir docs/decisions/identite-du-push-et-declenchement-des-tests-685.md.
      - name: Le commit de données déclenchera-t-il `tests.yml` ? (#685)
        if: steps.commit.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          url_distante="$(git remote get-url origin)"
          titre="### Suite de tests sur le commit de données"
          case "$url_distante" in
            git@*|ssh://*)
              echo "Push sous clé de déploiement (${url_distante}) : l'événement \`push\` est émis, \`tests.yml\` se déclenche sur ce commit de données."
              {
                echo "$titre"
                echo
                echo "Push SSH sous clé de déploiement — \`tests.yml\` se déclenche sur ce commit."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::warning::Ce commit de données est parti sous le GITHUB_TOKEN (${url_distante}) et non sous une clé de déploiement : GitHub n'émet AUCUN événement \`push\` pour lui, donc \`tests.yml\` ne tournera pas dessus et rien ne vérifiera les invariants que la suite verrouille. Le secret DATA_PUSH_SSH_KEY est absent ou vide. Réparation : les trois gestes de docs/decisions/push-donnees-cle-de-deploiement-508.md §7 (#685)."
              {
                echo "$titre"
                echo
                echo "**\`tests.yml\` NE tournera PAS sur ce commit.** Il est parti sous le"
                echo "\`GITHUB_TOKEN\` (\`${url_distante}\`), qui n'émet pas d'événement \`push\`."
                echo "Voir \`docs/decisions/identite-du-push-et-declenchement-des-tests-685.md\`."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # ── Publication du site avec les données fraîches (#416) ──────────────
      # POURQUOI CE DÉCLENCHEMENT EXPLICITE EXISTE (#416) : tant que le push
      # ci-dessus se faisait avec le GITHUB_TOKEN, GitHub n'émettait AUCUN
      # événement `push` (protection anti-boucle des workflows) —
      # deploy-pages.yml ne pouvait donc pas se déclencher sur ce commit,
      # quels que soient ses `paths:`. Vérifié à l'époque sur l'historique des
      # runs : aucun workflow n'avait jamais été déclenché par un commit
      # « chore: mise à jour automatique des données ». Sans ce déclenchement
      # explicite, le site publié servait les données du dernier build en
      # date, déclenché par une modification d'interface sans rapport.
      #
      # workflow_dispatch est l'exception documentée à la règle anti-boucle
      # (comme repository_dispatch) : un `gh workflow run` avec le
      # GITHUB_TOKEN démarre bien un run. Même mécanique que le
      # re-déclenchement de generate-data.yml par retry-generate-data.yml.
      #
      # CE QUI A CHANGÉ AVEC #508, ET POURQUOI CE STEP RESTE : sous la clé de
      # déploiement, le push ÉMET un événement `push`, et les `paths:` de
      # deploy-pages.yml (`pivot_data/**`) le voient. Le commit de données
      # déclenche donc DEUX runs de publication, sérialisés par la concurrence
      # `pages` de deploy-pages.yml — le second republie un contenu identique,
      # ou est annulé comme run en attente supplanté.
      #
      # Ce doublon est le prix ASSUMÉ de ne pas faire dépendre la publication
      # de l'identité qui pousse. Supprimer ce step reviendrait à écrire dans
      # le workflow l'hypothèse « le push émettra toujours un événement » : le
      # jour où le secret DATA_PUSH_SSH_KEY manque ou est révoqué, le push
      # retombe sur le GITHUB_TOKEN (cf. le `ssh-key:` du checkout) et le site
      # cesserait silencieusement de se mettre à jour — exactement la panne
      # que #416 a corrigée. Un run de publication en trop coûte une minute ;
      # une donnée fraîche jamais publiée ne se voit pas.
      #
      # Garde sur main : deploy-pages.yml publie le site de production. Un run
      # de génération lancé depuis une branche de travail ne doit jamais
      # publier — il committe sur sa branche, pas sur main.
      # ── FENÊTRE DE RÉTENTION DE L'HISTORIQUE DE DONNÉES (#551) ───────────
      #
      # #434 a borné l'historique de données à une fenêtre de commits, et
      # affirmait que « ce qui est automatisé, c'est la détection ». Le code
      # existait — `src/audit_volumetrie_profils.py` sait dire si la fenêtre est
      # contraignante — mais AUCUN workflow ne l'invoquait : la détection était
      # outillée, pas armée (#551). Ce step l'arme.
      #
      # Il COMPTE, il ne borne pas. La réécriture d'historique reste manuelle et
      # le restera : elle est irréversible pour tous les clones existants, et
      # `scripts/borner_historique_donnees.sh` garantit par test
      # (`test_le_script_ne_pousse_jamais`) qu'aucun script ne pousse à notre
      # place. Ce step ne l'appelle donc jamais.
      #
      # Il n'appelle pas non plus `audit_volumetrie_profils.py --mesurer` :
      # celui-ci clone le dépôt entier et le repacke deux fois — mesuré le
      # 28/08/2026, 1 min 52 s de temps réel et 3 min 37 s de CPU pour ~434 Mo
      # dans un temporaire. Un compteur de commits coûte une commande.
      #
      # La valeur de la fenêtre est LUE, jamais recopiée. Elle vit déjà à deux
      # endroits (`FENETRE` du script de bornage, `FENETRE_COMMITS_DONNEES` de
      # l'audit), dont un test verrouille l'égalité ; en écrire un troisième ici
      # ferait répondre deux valeurs différentes à « la fenêtre est-elle
      # contraignante ? ». Même raison pour le motif du commit.
      #
      # ── DEUX UNITÉS À NE PAS CONFONDRE (#579) ────────────────────────────
      #
      # Le step a compté faux DEUX fois, et la seconde fois pour une raison que
      # la première correction ne pouvait pas voir.
      #
      #   · Run 33185097538 (28/08 matin) : `actions/checkout` cloue
      #     l'historique à UN commit et le step ne demandait rien d'autre. Le
      #     compteur rendait 1. Corrigé par #574, qui a ajouté un
      #     approfondissement de `FENETRE + 10`.
      #   · Run 33200210924 (28/08 soir) : toujours aucune annotation, à 32
      #     commits de données pour une fenêtre de 30. Le step a duré 3,8 s et a
      #     conclu `success`.
      #
      # #579 soupçonnait le filtre d'objets d'être REFUSÉ par GitHub sur un
      # clone superficiel mais non partiel. C'est FAUX, et c'est mesuré : rejoué
      # le 29/08/2026 contre github.com (git 2.43.0), depuis un clone
      # `--depth=1` NON partiel, l'approfondissement filtré rend 0, sans
      # avertissement, et enregistre bien `remote.origin.promisor`. Les 3,8 s ne
      # sont pas la trace d'un fetch en échec : c'est la durée d'un fetch qui a
      # RÉUSSI.
      #
      # La vraie faute est une CONFUSION D'UNITÉS, la même famille que les
      # chiffres faux du budget de temps mur plus haut :
      #
      #     la fenêtre se compte en COMMITS DE DONNÉES   (30)
      #     l'approfondissement se compte en PROFONDEUR D'HISTOIRE
      #
      # Sur ce dépôt les deux sont sans rapport : 32 commits de données pour 867
      # commits atteignables depuis le commit de données du run 33200210924, et
      # les commits de données ne sont pas contigus — un lot de PR les sépare.
      # Mesuré le 29/08/2026 sur l'historique réel, en modélisant la sémantique
      # exacte de l'approfondissement (profondeur = plus court chemin depuis la
      # pointe) :
      #
      #     profondeur  11  →  26 commits vus,   3 commits de données
      #     profondeur  41  → 119 commits vus,   8 commits de données   ← #574
      #     profondeur 101  → 284 commits vus,  17 commits de données
      #     profondeur 199  →                   30 commits de données
      #     profondeur 203  →                   32 commits de données
      #
      # Approfondir de 40 faisait donc voir 8 commits de données sur 32. 8 est
      # au-dessous de 27, donc la branche « non contraignante », donc le
      # silence. Le compteur comptait juste ; il comptait sur la mauvaise
      # population.
      #
      # Aucune profondeur devinée ne corrige ça : le rapport entre les deux
      # unités dépend du rythme des PR, il n'est pas une constante du dépôt. Le
      # step ne devine donc plus — il DÉ-SUPERFICIALISE, et il refuse de compter
      # tant que l'historique est tronqué.
      #
      # ── POURQUOI `tree:0` ET NON `blob:none` ─────────────────────────────
      #
      # `git log --grep` ne lit que des objets COMMIT. `blob:none` laissait
      # encore venir tous les ARBRES — c'est-à-dire l'essentiel du poids d'un
      # dépôt qui porte des dizaines de milliers de fichiers de profils.
      # `tree:0` rend enfin ce que le commentaire de #574 promettait déjà : le
      # graphe, pas le contenu.
      #
      # Mesuré le 29/08/2026 contre github.com, sur CE dépôt : dé-superficialiser
      # avec `tree:0` coûte 3,16 s, ramène 877 commits, laisse un `.git` de
      # 972 Ko au total, et `git log --grep` y rend 32 — le chiffre de #579.
      # Et depuis un clone superficiel NON partiel (github/gitignore, 4 221
      # commits) : 1,58 s, code 0, filtre bien enregistré, arbres anciens
      # absents du clone. La dé-superficialisation filtrée n'est donc pas
      # réservée aux clones déjà partiels.
      #
      # ── CE STEP NE SE TAIT PLUS (#579) ───────────────────────────────────
      #
      #   · plus de `|| true` sur le fetch : un approfondissement en échec
      #     n'autorise AUCUN compte, et le step le dit par `::warning::`. « Je
      #     n'ai pas pu compter » n'est pas « la fenêtre n'est pas atteinte ».
      #     Même famille que le `except Exception` de #562.
      #   · le compte part sur STDOUT, pas seulement dans le résumé de run :
      #     `$GITHUB_STEP_SUMMARY` n'est récupérable ni par `gh run view --log`
      #     ni par l'API (`output.summary` et `output.text` reviennent vides), et
      #     c'est ce qui a rendu les deux premières pannes indébogables — il a
      #     fallu télécharger le journal brut et MESURER LA DURÉE du step.
      #   · le step ne fait toujours pas tomber le job : il vient de committer
      #     des données, et un compteur n'est pas une porte de qualité.
      - name: Fenêtre de rétention de l'historique de données (#551)
        if: ${{ always() && inputs.test_slugs == '' }}
        run: |
          set -euo pipefail
          LU=$(python3 -c "import sys; sys.path.insert(0, 'src'); import audit_volumetrie_profils as a; print(a.FENETRE_COMMITS_DONNEES, a.MOTIF_COMMIT_DONNEES)")
          FENETRE=${LU%% *}
          MOTIF=${LU#* }

          # L'historique arrive tronqué (`fetch-depth: 1` par défaut). On le
          # complète, sans arbres ni blobs. Dé-superficialiser un dépôt déjà
          # complet est une erreur fatale : on ne le demande que s'il y a
          # quelque chose à compléter.
          CODE=0
          SORTIE=""
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            SORTIE=$(git fetch --filter=tree:0 --unshallow origin 2>&1) || CODE=$?
          fi

          # Deux façons de ne PAS pouvoir compter, et elles se disent toutes les
          # deux. La seconde est celle qui a survécu à #574 : un fetch qui
          # réussit sans lever la troncature laisse un compte qui est un
          # MINORANT, et un minorant plausible ne se voit pas.
          INDETERMINE=""
          if [[ "$CODE" -ne 0 ]]; then
            INDETERMINE="l'approfondissement a échoué (git fetch, code ${CODE})"
          elif [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            INDETERMINE="l'historique est resté superficiel après approfondissement"
          fi

          if [[ -n "$INDETERMINE" ]]; then
            echo "Fenêtre de rétention : AUCUN compte établi — ${INDETERMINE}."
            # Un `[[ ... ]] && echo` ici ferait TOMBER le step quand la sortie
            # est vide : sous `set -e`, une liste `&&` fausse est un échec.
            if [[ -n "$SORTIE" ]]; then
              echo "$SORTIE"
            fi
            echo "::warning::Fenêtre de rétention : RIEN n'a pu être compté — ${INDETERMINE}. Ce n'est PAS « la fenêtre n'est pas atteinte », c'est « on ne sait pas ». À compter à la main sur un clone complet, avec le motif ${MOTIF}."
            {
              echo "### Fenêtre de rétention de l'historique (#551)"
              echo ""
              echo "**Indéterminée** : ${INDETERMINE}. Aucun compte n'est publié ici — un nombre plausible vaudrait moins que pas de nombre (#579)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NB=$(git log --grep="$MOTIF" --oneline | wc -l)
          VUS=$(git rev-list --count HEAD)
          RESTE=$(( FENETRE - NB ))

          # LA ligne qui manquait : lisible dans `gh run view --log` et par
          # l'API, et elle nomme la population de chaque chiffre.
          echo "Fenêtre de rétention : ${NB} commit(s) de données pour une fenêtre de ${FENETRE}, sur ${VUS} commit(s) d'historique complet parcourus."

          {
            echo "### Fenêtre de rétention de l'historique (#551)"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| Commits de données dans l'historique | ${NB} |"
            echo "| Fenêtre (\`FENETRE_COMMITS_DONNEES\`) | ${FENETRE} |"
            echo "| Commits parcourus (historique complet) | ${VUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$NB" -ge "$FENETRE" ]]; then
            echo "| État | **contraignante** |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Borner est désormais la seule chose qui tienne le plateau. L'opération est **manuelle et irréversible pour tous les clones existants**, et elle exige d'archiver l'ancien historique **ailleurs** au préalable — sans quoi les SHA cités dans \`docs/technical_decisions.md\` et dans les issues cessent de résoudre. La procédure complète est dans \`docs/decisions/fenetre-recalibrage-551.md\`, avec le runner qui la déroule ; ne pas la recopier ici." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Fenêtre de rétention atteinte : ${NB} commits de données pour une fenêtre de ${FENETRE}. Borner est une opération MANUELLE et irréversible, qui exige d'archiver l'ancien historique ailleurs au préalable — procédure dans docs/decisions/fenetre-recalibrage-551.md."
          elif [[ "$RESTE" -le 3 ]]; then
            echo "| État | ${RESTE} commit(s) avant qu'elle morde |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Fenêtre de rétention : ${RESTE} commit(s) de données avant qu'elle devienne contraignante (${NB}/${FENETRE})."
          else
            echo "| État | non contraignante |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Déclencher le déploiement du site (données mises à jour)
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --repo "${REPO}" --ref main
          {
            echo "### 🚀 Déploiement du site déclenché"
            echo ""
            echo "Les données mises à jour ont été poussées sur \`main\` ; un run de"
            echo "\`deploy-pages.yml\` a été déclenché pour les publier (le commit du bot"
            echo "n'émet pas d'événement \`push\`, cf. #416)."
          } >> "$GITHUB_STEP_SUMMARY"
