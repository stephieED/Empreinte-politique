<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTRECHAMP — Politique en clair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Palette éditoriale — justifiée par le sujet */
    --bg: #F4EFE4;          /* Parchemin — fond de page, évoque les archives */
    --surface: #FFFDF8;     /* Blanc chaud — panneaux de contenu */
    --text: #1A2332;        /* Encre — texte principal, procès-verbal */
    --muted: #7A6652;       /* Sépia — secondaire, labels, dates */
    --line: #DDD5C5;        /* Lin chaud — bordures discrètes */
    --deep: #1A2332;        /* = Encre (compatibilité interne) */
    --accent: #7A6652;      /* = Sépia (liens discrets, neutralité) */
    --accent-soft: #EDE8DC; /* Parchemin clair — état actif des filtres */
    /* Couleurs sémantiques de vote — jamais décoratives */
    --vert: #27744F;        /* Vert quorum — vote POUR / présence */
    --rouge: #C0392B;       /* Rouge scrutin — vote CONTRE / absence */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  button { font: inherit; }

  .page { max-width: 1040px; margin: 0 auto; padding: 1rem 0.9rem 5rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.9rem;
    margin-bottom: 0.8rem;
  }

  h1, h2, h3 { margin: 0 0 0.55rem; color: var(--deep); line-height: 1.2; font-family: 'Libre Baskerville', Georgia, serif; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.05rem; }
  h3 { font-size: 0.98rem; }
  p { margin: 0.35rem 0; }
  .small { font-size: 0.88rem; color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  /* Références vérifiables : signal visuel "coordonnée de source primaire" */
  .source-ref {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: -0.01em;
  }

  .section-kicker {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 0.4rem;
  }

  /* Carrousel d'avatars — remplace le menu déroulant de sélection */
  .avatar-carousel {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 0.15rem 0.1rem 0.35rem;
    -webkit-overflow-scrolling: touch;
  }
  .avatar-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.28rem;
    flex-shrink: 0;
    width: 64px;
    scroll-snap-align: start;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
  }
  .avatar-chip-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--line);
    background: linear-gradient(145deg, var(--accent-soft), var(--line));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.92rem;
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--deep);
    transition: border-color 0.15s, transform 0.15s;
  }
  .avatar-chip-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-chip.active .avatar-chip-circle { border-color: var(--accent); transform: scale(1.06); }
  .avatar-chip:disabled { opacity: 0.4; cursor: not-allowed; }
  .avatar-chip-name {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 64px;
  }
  .avatar-chip.active .avatar-chip-name { color: var(--deep); font-weight: 600; }

  /* Variante compacte pour la sélection de comparaison (multi-sélection) */
  .avatar-chip--mini .avatar-chip-circle { width: 40px; height: 40px; font-size: 0.76rem; }
  .avatar-chip--mini .avatar-chip-name { max-width: 52px; }

  .hero {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 0.7rem;
    align-items: center;
  }
  .avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, var(--accent-soft), var(--line));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--deep);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.25rem; }
  .tag {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    padding: 0.13rem 0.56rem;
    font-size: 0.8rem;
    color: var(--deep);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.55rem;
    margin-top: 0.65rem;
  }

  /* Cartes KPI en flip 3D : recto = pictogramme + chiffre, verso = l'explication/limite */
  .kpi-flip {
    perspective: 1000px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .kpi-flip-inner {
    position: relative;
    min-height: 132px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .kpi-flip.flipped .kpi-flip-inner,
  .kpi-flip:focus-visible .kpi-flip-inner { transform: rotateY(180deg); }
  @media (hover: hover) {
    .kpi-flip:hover .kpi-flip-inner { transform: rotateY(180deg); }
  }
  .kpi-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .kpi-face--back { transform: rotateY(180deg); overflow-y: auto; justify-content: center; }
  .kpi-icon { color: var(--accent); margin-bottom: 0.2rem; }
  .kpi-icon svg { display: block; }
  /* Valeur chiffrée en monospace : signal "donnée vérifiable, pas décorative" */
  .kpi-value {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    color: var(--deep);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }
  .kpi-label { font-size: 0.78rem; color: var(--muted); margin-top: auto; }
  .kpi-face--back .kpi-back-text { font-size: 0.8rem; color: var(--text); margin: 0 0 0.4rem; }
  .kpi-face--back .kpi-back-link {
    align-self: flex-start;
    font-size: 0.78rem;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  .trust-line {
    margin-top: 0.5rem;
    border-top: 1px dashed var(--line);
    padding-top: 0.48rem;
    font-size: 0.84rem;
    color: var(--muted);
  }

  /* Répartition thématique — histogramme horizontal */
  .theme-dist { margin-top: 0.85rem; }
  .theme-dist-title { font-size: 0.84rem; color: var(--muted); margin: 0 0 0.45rem; }
  .theme-dist-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.38rem; }
  .theme-dist-label { width: 110px; flex-shrink: 0; font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-dist-bar-wrap { flex: 1; background: var(--line); border-radius: 3px; height: 7px; overflow: hidden; }
  .theme-dist-bar { height: 100%; background: var(--deep); border-radius: 3px; }
  .theme-dist-count { width: 36px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }

  /* Profil de vote — répartition, jamais un score unique */
  .vote-profile-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 0.4rem; background: var(--line); }
  .vote-profile-seg--pour { background: var(--vert); }
  .vote-profile-seg--contre { background: var(--rouge); }
  .vote-profile-seg--abstention { background: var(--muted); }
  .vote-profile-seg--absent { background: var(--line); }
  .vote-profile-legend { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.4rem; font-size: 0.78rem; color: var(--muted); }
  .vote-profile-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.28rem; vertical-align: middle; }

  /* Panneaux glissants (swipe) — remplace la navigation par ancres empilées */
  .panel-indicator {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    align-items: center;
    margin: 0.6rem 0;
  }
  .panel-dot {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    font-size: 0.95rem;
  }
  .panel-dot.active { background: var(--accent-soft); border-color: var(--accent); color: var(--deep); }
  .swipe-deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    scrollbar-width: none;
  }
  .swipe-deck::-webkit-scrollbar { display: none; }
  .swipe-panel {
    flex: 0 0 100%;
    scroll-snap-align: start;
    min-width: 100%;
    padding-right: 0.1rem;
  }
  .swipe-hint { text-align: center; font-size: 0.74rem; color: var(--muted); margin: 0.1rem 0 0.5rem; }

  .themes-row {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }
  .theme-pill {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 0.22rem 0.58rem;
    font-size: 0.83rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .theme-pill.active {
    background: var(--accent-soft);
    border-color: #C4B8A4;
    color: var(--deep);
    font-weight: 600;
  }

  .rows { display: grid; gap: 0.55rem; }
  .row-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    padding: 0.65rem;
  }
  .row-item p { margin: 0.18rem 0; }

  /* Bande de scrutin — élément signature.
     Barre verticale gauche de 4 px : la colonne de couleurs formée
     en vue liste donne un bilan visuel immédiat sans lire les libellés. */
  .vote-card { border-left-width: 4px; }
  .vote-card--pour       { border-left-color: var(--vert); }
  .vote-card--contre     { border-left-color: var(--rouge); }
  .vote-card--abstention { border-left-color: var(--muted); border-left-style: dashed; }
  .vote-card--absent     { border-left-color: var(--line); }

  /* Badges de position — couleur réservée au sens, jamais décorative */
  .vote-badge {
    display: inline-block;
    border-radius: 4px;
    padding: 0.12rem 0.45rem;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    margin-left: 0.3rem;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--bg);
  }
  .vote-badge.pour {
    background: #EAF5EE;
    border-color: var(--vert);
    color: var(--vert);
    font-weight: 600;
  }
  .vote-badge.contre {
    background: #FAEAEA;
    border-color: var(--rouge);
    color: var(--rouge);
    font-weight: 600;
  }
  .vote-badge.abstention {
    background: var(--bg);
    border-color: var(--muted);
    border-style: dashed;
    color: var(--muted);
  }
  .vote-badge.absent {
    background: var(--bg);
    border-color: var(--line);
    color: var(--muted);
  }

  .votes-table-wrap { display: none; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td {
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 0.84rem;
    padding: 0.5rem 0.45rem;
    vertical-align: top;
  }
  th { color: var(--deep); font-family: 'Libre Baskerville', Georgia, serif; }

  details.inline-help {
    display: inline-block;
    margin-left: 0.35rem;
    vertical-align: middle;
  }
  details.inline-help summary {
    list-style: none;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    color: var(--deep);
    user-select: none;
  }
  details.inline-help summary::-webkit-details-marker { display: none; }
  details.inline-help p {
    margin-top: 0.45rem;
    margin-bottom: 0;
    font-size: 0.82rem;
    color: var(--muted);
    max-width: 320px;
  }

  .absence-grid {
    display: grid;
    gap: 0.5rem;
    grid-template-columns: 1fr;
  }
  .absence-box {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 0.58rem;
    background: var(--bg);
  }
  .absence-box ul { margin: 0.3rem 0 0; padding-left: 1rem; }

  .inter-controls {
    display: flex;
    gap: 0.45rem;
    margin-bottom: 0.45rem;
    flex-wrap: wrap;
  }
  .ghost-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    padding: 0.28rem 0.58rem;
    font-size: 0.84rem;
    cursor: pointer;
  }
  .ghost-btn.active-choice {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--deep);
    font-weight: 600;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.52rem;
    margin-top: 0.5rem;
  }
  .compare-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem;
    background: var(--surface);
  }

  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }

  @media (min-width: 760px) {
    .page { padding: 1.15rem 1.15rem 4rem; }
    h1 { font-size: 1.6rem; }
    .panel { padding: 1rem; }
    .hero { grid-template-columns: 76px 1fr; }
    .avatar { width: 76px; height: 76px; }
    .votes-cards { display: none; }
    .votes-table-wrap { display: block; }
    .absence-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .compare-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .theme-dist-label { width: 140px; }
  }

  /* Variante B — "Le Bulletin" : cockpit civique, dense et tactile. */
  .cockpit {
    --bg: #F0F2ED;
    --surface: #FAFBF7;
    --text: #17211D;
    --deep: #17211D;
    --muted: #65716B;
    --line: #C9D0C9;
    --accent: #006B64;
    --accent-soft: #D8EBE6;
    --signal: #E8593C;
    --sun: #E6B447;
    font-family: 'Manrope', sans-serif;
    background-color: var(--bg);
    background-image: linear-gradient(rgba(23, 33, 29, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 33, 29, 0.035) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .cockpit h1,
  .cockpit h2,
  .cockpit h3 { font-family: 'Newsreader', serif; }
  .cockpit .page { max-width: 1180px; padding-bottom: 6.5rem; }
  .cockpit .panel { border-radius: 8px; box-shadow: 0 4px 18px rgba(23, 33, 29, 0.045); }
  .cockpit .masthead {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.7rem;
    align-items: end;
    border-top: 5px solid var(--deep);
  }
  .cockpit .masthead h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0; }
  .cockpit .masthead > .section-kicker,
  .cockpit .masthead > .avatar-carousel { grid-column: 1 / -1; }
  .cockpit .edition-mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-align: right;
    color: var(--muted);
  }

  /* Les candidats deviennent des tickets horizontaux, pas des stories. */
  .cockpit .avatar-carousel { gap: 0.5rem; padding: 0.45rem 0 0.15rem; }
  .cockpit .avatar-chip {
    width: 132px;
    min-height: 56px;
    display: grid;
    grid-template-columns: 38px 1fr;
    grid-template-rows: 1fr;
    gap: 0.5rem;
    text-align: left;
    align-items: center;
    padding: 0.45rem;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
  }
  .cockpit .avatar-chip-circle {
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
  }
  .cockpit .avatar-chip-name {
    max-width: 78px;
    font-size: 0.76rem;
    color: var(--text);
  }
  .cockpit .avatar-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: inset 4px 0 0 var(--accent);
  }
  .cockpit .avatar-chip.active .avatar-chip-circle { transform: none; border-color: var(--accent); }
  .cockpit .avatar-chip--mini { width: 110px; min-height: 48px; }

  .cockpit #resume { position: relative; overflow: hidden; }
  .cockpit #resume::before {
    content: "DOSSIER";
    position: absolute;
    top: 0.7rem;
    right: 0.8rem;
    color: var(--signal);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.64rem;
    font-weight: 600;
    border: 1px solid currentColor;
    padding: 0.14rem 0.35rem;
  }
  .cockpit .hero { grid-template-columns: 54px 1fr; }
  .cockpit .avatar { width: 54px; height: 54px; border-radius: 6px; background: var(--accent-soft); }

  /* KPI bento avec révélation plane; aucune rotation 3D. */
  .cockpit .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cockpit .kpi-flip { perspective: none; }
  .cockpit .kpi-flip-inner { min-height: 142px; transform-style: flat; transition: none; }
  .cockpit .kpi-face {
    border-radius: 7px;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    background: var(--surface);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .cockpit .kpi-face--front { border-top: 4px solid var(--accent); }
  .cockpit .kpi-flip:nth-child(2) .kpi-face--front { border-top-color: var(--sun); }
  .cockpit .kpi-flip:nth-child(3) .kpi-face--front { border-top-color: var(--signal); }
  .cockpit .kpi-flip:nth-child(4) .kpi-face--front { border-top-color: var(--deep); }
  .cockpit .kpi-face--back {
    transform: translateY(8px);
    opacity: 0;
    pointer-events: none;
    justify-content: center;
    background: var(--deep);
    color: var(--surface);
  }
  .cockpit .kpi-face--back .kpi-back-text { color: var(--surface); }
  .cockpit .kpi-face--back .kpi-back-link { color: #9FE0D5; }
  .cockpit .kpi-flip.flipped .kpi-flip-inner,
  .cockpit .kpi-flip:focus-visible .kpi-flip-inner { transform: none; }
  .cockpit .kpi-flip.flipped .kpi-face--front { opacity: 0; transform: translateY(-8px); }
  .cockpit .kpi-flip.flipped .kpi-face--back { opacity: 1; transform: none; pointer-events: auto; }
  @media (hover: hover) {
    .cockpit .kpi-flip:hover .kpi-flip-inner { transform: none; }
    .cockpit .kpi-flip:hover .kpi-face--front { opacity: 0; transform: translateY(-8px); }
    .cockpit .kpi-flip:hover .kpi-face--back { opacity: 1; transform: none; pointer-events: auto; }
  }
  .cockpit .kpi-icon { color: var(--accent); }
  .cockpit .kpi-value { font-size: clamp(1.35rem, 5vw, 2.3rem); }

  /* Barre d'onglets fixe, comportement familier des apps mobiles. */
  .cockpit .panel-indicator {
    position: fixed;
    left: 0.6rem;
    right: 0.6rem;
    bottom: 0.55rem;
    z-index: 80;
    margin: 0 auto;
    max-width: 680px;
    min-height: 58px;
    justify-content: space-around;
    gap: 0;
    padding: 0.4rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(250, 251, 247, 0.96);
    box-shadow: 0 10px 32px rgba(23, 33, 29, 0.16);
    backdrop-filter: blur(12px);
  }
  .cockpit .panel-dot {
    width: auto;
    min-width: 44px;
    height: 44px;
    flex-direction: column;
    gap: 0.1rem;
    border: none;
    border-radius: 5px;
    background: transparent;
    font-size: 0.74rem;
  }
  .cockpit .panel-dot small { font-size: 0.54rem; line-height: 1; }
  .cockpit .panel-dot.active { color: var(--surface); background: var(--accent); }
  .cockpit .swipe-deck { display: block; overflow: visible; border-radius: 0; }
  .cockpit .swipe-panel { display: none; min-width: 0; padding: 0; animation: panel-in 0.26s ease both; }
  .cockpit .swipe-panel.active { display: block; }
  .cockpit .swipe-hint { display: none; }
  @keyframes panel-in {

  }

  @media (min-width: 760px) {

    .cockpit .panel-dot { min-width: 76px; }
    .cockpit .panel-dot small { font-size: 0.62rem; }
  }

  /* Variante C — CONTRECHAMP. Chaque famille de données a sa propre forme. */
  .deconstructed {
    --bg: #F2F0E7;
    --surface: #F2F0E7;
    --text: #11110F;
    --deep: #11110F;
    --muted: #5E5C55;
    --line: #11110F;
    --accent: #006FEE;
    --accent-soft: #B9DEFF;
    --vert: #007A45;
    --rouge: #E53420;
    --acid: #DFFF00;
    --pink: #FF70A6;
    --candidate-dock-height: 52px;
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
  }
  .deconstructed .page { max-width: none; padding: 0 0 7rem; }
  .deconstructed h1,
  .deconstructed h2,
  .deconstructed h3 { font-family: 'Archivo Black', sans-serif; letter-spacing: 0; }
  .deconstructed .panel { border: 0; border-radius: 0; background: transparent; margin: 0; box-shadow: none; }
  .deconstructed .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;

    align-items: end;
    padding: 1rem;
    border-bottom: 2px solid var(--line);
    background: var(--acid);
  }
  .deconstructed .masthead h1 {
    font-size: clamp(3rem, 13vw, 9rem);
    line-height: 0.78;
    max-width: 8ch;
    margin: 0;
    text-transform: uppercase;
  }
  .deconstructed .brand-home {
    appearance: none;
    border: 0;
    padding: 0;

    color: inherit;
    font: inherit;
    line-height: inherit;
    text-align: left;
    text-transform: inherit;
    cursor: pointer;
  }
  .deconstructed .brand-home:hover { color: var(--accent); }
  .deconstructed .edition-mark {
    align-self: start;
    writing-mode: vertical-rl;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
  }
  .deconstructed .candidate-dock {

    z-index: 85;
    height: var(--candidate-dock-height);
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);

    border-top: 2px solid var(--line);

  }
  .deconstructed .candidate-dock-label {

    margin: 0;
    padding: 0 0.7rem;
    border-right: 2px solid var(--line);

  }

  /* Index typographique des candidats, sans avatar ni carte. */
  .deconstructed .avatar-carousel { gap: 0; padding: 0; border: 0; overflow-x: auto; }
  .deconstructed .avatar-chip {

  .deconstructed .avatar-chip-name {

  }
  .deconstructed .avatar-chip.active { color: white; background: var(--text); }
  .deconstructed .avatar-chip.active .avatar-chip-name { color: white; }

  .deconstructed #candidat-root { position: relative; }
  .deconstructed .home-stage {
    min-height: 66vh;

  }

  }

  }

  .deconstructed .home-candidates {

  .deconstructed .home-candidate small { font-family: 'IBM Plex Mono', monospace; }
  .deconstructed .home-note { grid-column: 1 / -1; padding: 0.75rem 1rem; background: var(--accent); color: white; }
  .deconstructed #resume { padding: 0; }
  .deconstructed .hero {

  .deconstructed .avatar { display: none; }
  .deconstructed .hero h2 {
    color: var(--bg);
    font-size: clamp(3rem, 12vw, 9rem);
    line-height: 0.82;
    max-width: 9ch;
    text-transform: uppercase;
  }
  .deconstructed .tag { border-radius: 0; border-color: var(--bg); background: transparent; color: var(--bg); }

  /* Les KPI sont des annotations asymétriques, pas quatre cartes homogènes. */
  .deconstructed .summary-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0;
    margin: 0;
    border-bottom: 2px solid var(--line);
  }
  .deconstructed .kpi-flip { grid-column: span 3; perspective: none; border-right: 2px solid var(--line); }
  .deconstructed .kpi-flip:nth-child(3n) { background: var(--accent-soft); }
  .deconstructed .kpi-flip:nth-child(2) { background: var(--pink); }
  .deconstructed .kpi-flip:nth-child(4) { grid-column: span 4; }
  .deconstructed .kpi-flip-inner { min-height: 170px; transform-style: flat; transition: none; }
  .deconstructed .kpi-face { border: 0; border-radius: 0; background: transparent; padding: 1rem; backface-visibility: visible; }
  .deconstructed .kpi-face--front { justify-content: space-between; }
  .deconstructed .kpi-face--back {
    transform: none;
    opacity: 0;
    background: var(--text);
    color: var(--bg);
    pointer-events: none;
  }
  .deconstructed .kpi-face--back .kpi-back-text { color: var(--bg); }
  .deconstructed .kpi-face--back .kpi-back-link { color: var(--acid); }
  .deconstructed .kpi-flip.flipped .kpi-flip-inner,
  .deconstructed .kpi-flip:focus-visible .kpi-flip-inner { transform: none; }
  .deconstructed .kpi-flip.flipped .kpi-face--front { opacity: 0; }
  .deconstructed .kpi-flip.flipped .kpi-face--back { opacity: 1; pointer-events: auto; }
  @media (hover: hover) {
    .deconstructed .kpi-flip:hover .kpi-flip-inner { transform: none; }
    .deconstructed .kpi-flip:hover .kpi-face--front { opacity: 0; }
    .deconstructed .kpi-flip:hover .kpi-face--back { opacity: 1; pointer-events: auto; }
  }
  .deconstructed .kpi-icon { color: currentColor; }
  .deconstructed .kpi-value { font-size: clamp(2rem, 7vw, 5rem); letter-spacing: -0.04em; }
  .deconstructed .kpi-label { color: currentColor; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .deconstructed .theme-dist { display: none; }
  .deconstructed .trust-line { border: 0; padding: 0.8rem 1rem; margin: 0; background: var(--accent); color: white; }
  .deconstructed .trust-line a { color: white; }

  .deconstructed .theme-dock {
    position: sticky;
    top: var(--candidate-dock-height);
    z-index: 75;
    padding: 0.55rem 1rem;
    border-top: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
    background: rgba(242, 240, 231, 0.96);
    backdrop-filter: blur(10px);
  }
  .deconstructed .theme-dock .section-kicker { margin: 0 0 0.3rem; }
  .deconstructed .themes-row { gap: 0; padding: 0; }
  .deconstructed .theme-pill,
  .deconstructed .ghost-btn {
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    margin: 0 -1px -1px 0;
  }
  .deconstructed .theme-pill.active,
  .deconstructed .ghost-btn.active-choice { background: var(--text); color: var(--bg); }

  /* Rail spatial: les sections sont des coordonnées, pas des onglets. */
  .deconstructed .panel-indicator {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
    border-top: 2px solid var(--line);
    background: var(--bg);
  }
  .deconstructed .panel-dot {
    width: 100%;
    height: 64px;
    border: 0;
    border-right: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    padding: 0.25rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .deconstructed .panel-dot small { font-size: 0.55rem; text-transform: uppercase; }
  .deconstructed .panel-dot.active { background: var(--acid); color: var(--text); }
  .deconstructed .swipe-deck { display: block; overflow: visible; border-radius: 0; }
  .deconstructed .swipe-panel { display: none; min-width: 0; padding: 0; }
  .deconstructed .swipe-panel.active { display: block; }
  .deconstructed .swipe-panel > .panel { min-height: 66vh; padding: clamp(1rem, 4vw, 3rem); }
  .deconstructed .swipe-panel h2 { font-size: clamp(2rem, 7vw, 5rem); max-width: 10ch; line-height: 0.9; }
  .deconstructed .swipe-hint { display: none; }

  /* Formes spécifiques des données détaillées. */
  .deconstructed .orbit {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(0.4rem, 2vw, 1.4rem);
    min-height: 50vh;
    padding: 2rem 0;
  }
  .deconstructed .orbit-node {
    position: relative;
    max-width: 230px;
    padding: 0.65rem;
    border: 2px solid var(--line);
    background: var(--bg);
    transform: rotate(var(--tilt));
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .deconstructed .orbit-node:nth-child(3n) { border-radius: 50%; padding: 1.2rem; text-align: center; }
  .deconstructed .orbit-node.is-notable { background: var(--acid); border-width: 3px; }
  .deconstructed .orbit-node small { display: block; font-family: 'IBM Plex Mono', monospace; }
  .deconstructed .orbit-node:hover,
  .deconstructed .orbit-node:focus-visible,
  .deconstructed .orbit-node.expanded { transform: rotate(0) scale(1.04); z-index: 2; }
  .deconstructed .orbit-detail {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.2s ease, opacity 0.2s ease;
  }
  .deconstructed .orbit-detail > span { overflow: hidden; }
  .deconstructed .orbit-node:hover .orbit-detail,
  .deconstructed .orbit-node:focus-visible .orbit-detail,
  .deconstructed .orbit-node.expanded .orbit-detail { grid-template-rows: 1fr; opacity: 1; margin-top: 0.45rem; }
  .deconstructed .orbit-legend { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; padding: 0.5rem; border: 2px solid var(--line); background: var(--acid); }

  .deconstructed .text-atlas { display: grid; gap: 2rem; }
  .deconstructed .text-shelf { min-width: 0; }
  .deconstructed .text-shelf-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.7rem;
    align-items: center;
    margin-bottom: 0.65rem;
  }
  .deconstructed .text-shelf-head::after { content: ""; height: 2px; background: var(--line); }
  .deconstructed .text-shelf-head strong { font-family: 'Archivo Black', sans-serif; font-size: 1.05rem; }
  .deconstructed .text-shelf-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; }
  .deconstructed .text-shelf-track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(250px, 34vw);
    gap: 0.65rem;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scroll-snap-type: x proximity;
    padding: 0 0 0.55rem;
  }
  .deconstructed .text-leaf {
    min-height: 190px;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem;
    border: 2px solid var(--line);
    background: var(--bg);
  }
  .deconstructed .text-leaf:nth-child(3n + 2) { background: var(--accent-soft); }
  .deconstructed .text-leaf:nth-child(3n) { background: var(--pink); }
  .deconstructed .text-leaf-title { font-family: 'Archivo Black', sans-serif; font-size: clamp(1rem, 2.2vw, 1.45rem); line-height: 1.08; }
  .deconstructed .text-leaf-meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; }
  .deconstructed .text-shelf-more {
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    padding: 0.2rem 0;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .deconstructed .text-shelf-more:hover { color: var(--accent); }

  .deconstructed .vote-atlas { display: grid; gap: 2.2rem; margin-top: 1rem; }
  .deconstructed .vote-shelf { min-width: 0; }
  .deconstructed .vote-shelf-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.7rem;
    align-items: center;
    margin-bottom: 0.45rem;
  }
  .deconstructed .vote-shelf-head::after { content: ""; height: 2px; background: var(--line); }
  .deconstructed .vote-shelf-head strong { font-family: 'Archivo Black', sans-serif; font-size: 1.05rem; }
  .deconstructed .vote-shelf-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; }
  .deconstructed .vote-cloud { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; padding-top: 0.4rem; }
  .deconstructed .vote-token {
    --vote-color: var(--muted);
    max-width: min(300px, 86vw);
    padding: calc(0.45rem + var(--weight) * 0.08rem);
    border: 2px solid var(--vote-color);
    border-radius: 999px;
    background: transparent;
    color: var(--text);

    text-align: left;
    font-size: calc(0.7rem + var(--weight) * 0.03rem);
    text-decoration: none;

  .deconstructed .vote-token.pour { --vote-color: var(--vert); }

  .deconstructed .vote-token.abstention { --vote-color: var(--muted); border-style: dashed; }
  .deconstructed .vote-token.absent { --vote-color: #A7A39A; opacity: 0.7; }
  .deconstructed .vote-token:hover,
  .deconstructed .vote-token:focus-visible { background: var(--vote-color); color: white; }
  .deconstructed .vote-token em { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; font-style: normal; }
  .deconstructed .vote-token .source-mark { display: inline-block; margin-left: 0.25rem; font-weight: 600; }
  .deconstructed .vote-shelf-more {
    margin-top: 0.65rem;
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    padding: 0.2rem 0;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .deconstructed .vote-shelf-more:hover { color: var(--accent); }

  .deconstructed .void-map { display: grid; grid-template-columns: 1fr; border: 2px solid var(--line); }
  .deconstructed .void-signal { min-height: 170px; padding: 1rem; border-bottom: 2px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; }
  .deconstructed .void-signal:last-child { border: 0; }
  .deconstructed .void-number { font-family: 'Archivo Black', sans-serif; font-size: clamp(3rem, 14vw, 8rem); line-height: 0.8; }

  .deconstructed .speech-tape { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 38vw); gap: 0; overflow-x: auto; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
  .deconstructed .speech-fragment { min-height: 350px; padding: 1rem; border-right: 2px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; }
  .deconstructed .speech-fragment:nth-child(even) { background: var(--acid); }
  .deconstructed .speech-quote { font-family: 'Archivo Black', sans-serif; font-size: clamp(1.05rem, 2.5vw, 1.65rem); }

  .deconstructed .versus-stage { display: grid; gap: 0; border: 2px solid var(--line); }
  .deconstructed .versus-person { padding: 1rem; border-bottom: 2px solid var(--line); }
  .deconstructed .versus-person:last-child { border: 0; }
  .deconstructed .versus-name { font-family: 'Archivo Black', sans-serif; font-size: clamp(1.4rem, 5vw, 3.5rem); }
  .deconstructed .versus-metrics { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 1rem; }
  .deconstructed .versus-metric { border-top: 1px solid var(--line); padding: 0.5rem 0.2rem; }
  .deconstructed .versus-metric b { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 1.35rem; }

  @media (min-width: 820px) {
    .deconstructed .page { padding: 0 0 0 84px; }
    .deconstructed .panel-indicator { top: 0; bottom: 0; right: auto; width: 84px; grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); border: 0; border-right: 2px solid var(--line); }
    .deconstructed .panel-dot { height: auto; border: 0; border-bottom: 1px solid var(--line); }
    .deconstructed .summary-grid { grid-template-columns: repeat(12, 1fr); }
    .deconstructed .kpi-flip { grid-column: span 3; }
    .deconstructed .kpi-flip:nth-child(2) { grid-column: span 2; }
    .deconstructed .kpi-flip:nth-child(3) { grid-column: span 4; }
    .deconstructed .kpi-flip:nth-child(4) { grid-column: span 3; }
    .deconstructed .void-map { grid-template-columns: repeat(3, 1fr); }
    .deconstructed .void-signal { border: 0; border-right: 2px solid var(--line); }
    .deconstructed .versus-stage { grid-template-columns: repeat(3, 1fr); }
    .deconstructed .versus-person { border: 0; border-right: 2px solid var(--line); }
    .deconstructed .home-manifesto { grid-column: 1 / 4; }
    .deconstructed .home-candidates { grid-column: 4 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* V4 — Revue civique : même profondeur de données, tonalité plus calme. */
  .panorama {
    --bg: #F5F3ED;
    --surface: #FCFBF7;
    --text: #263730;
    --deep: #193A56;
    --muted: #6B7771;
    --line: #AEBBB4;
    --accent: #285F87;
    --accent-soft: #DDE9F0;
    --vert: #39775C;
    --rouge: #B85F50;
    --acid: #DCE8DF;
    --pink: #F0DCD4;
    font-family: 'Manrope', sans-serif;
    background: #E9EEE9;
  }
  .panorama .page {

  .panorama .masthead h1 {
    max-width: none;

  }
  .panorama .brand-home { color: var(--deep); }

  .panorama .edition-mark {
    writing-mode: horizontal-tb;
    align-self: end;
    padding: 0.4rem 0;
    border-top: 1px solid var(--deep);
    color: var(--deep);
  }
  .panorama .candidate-dock {
    border-width: 0 0 1px;
    border-color: var(--line);

  }
  .panorama .candidate-dock-label,
  .panorama .avatar-chip { border-color: var(--line); border-width: 0 1px 0 0; }
  .panorama .avatar-chip.active { background: var(--accent); color: white; }
