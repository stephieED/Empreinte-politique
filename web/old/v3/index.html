<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empreinte politique — En clair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css">
</head>
<body class="deconstructed">
  <main class="page">
    <section class="masthead">
      <div>
        <p class="section-kicker">Présidentielle 2027 / données publiques</p>

    <nav class="candidate-dock" aria-label="Choisir une vue et un profil">

        <button type="button" class="rail-scroll-btn" id="rail-scroll-btn" aria-label="Faire défiler le rail" hidden>→</button>
      </div>

    <div id="candidat-root"></div>
    <footer class="site-footer">
      <a href="mentions-legales.html" target="_blank" rel="noopener">Mentions légales</a>
